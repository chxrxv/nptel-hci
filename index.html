MS Word?', the null hypothesis is:","exp":"H0: no effect; H1: our design is faster. Significance testing tries to refute H0.","tip":"Null = no effect.","opts":["Our design is not faster than MS Word","MS Word is faster than our design","Our design is faster than MS Word","Participants like our design"],"ans":[0]},{"id":"nfa0e4082","sec":2,"type":"mcq","topic":"empirical","concept":"variables","diff":"H","cat":"A","beyond":false,"q":"Participants type first with interface A and then with interface B, and their B typing improves because of the experience. This is an example of a:","exp":"The practice effect varies with the test conditions systematically though we do not account for it.","tip":"Practice effect = confound.","opts":["nominal variable","dependent variable","control variable","confounding variable (practice effect)"],"ans":[3]},{"id":"n618d155e","sec":2,"type":"mcq","topic":"empirical","concept":"variables","diff":"H","cat":"A","beyond":false,"q":"Only male participants are used in an experiment because gender might affect speed. Gender is now a:","exp":"A control variable is fixed (here to male); the conclusion applies only to that group.","tip":"Fixed = control.","opts":["independent variable","control variable","dependent variable","confounding variable"],"ans":[1]},{"id":"n0fc43707","sec":2,"type":"mcq","topic":"empirical","concept":"study-design","diff":"H","cat":"A","beyond":false,"q":"20 participants are split into 4 groups of 5 and each group tries only 5 of the 20 interfaces. This is a:","exp":"When participants perform tasks for only a subset of test conditions, it is between-subject.","tip":"Subsets = between.","opts":["within-subject design","pilot study","Latin square design","between-subject design"],"ans":[3]},{"id":"nf24220e1","sec":2,"type":"mcq","topic":"empirical","concept":"study-design","diff":"H","cat":"A","beyond":false,"q":"Why would you choose a between-subject design?","exp":"Within-subject designs need longer involvement (and risk practice effects); between-subject needs more participants.","tip":"Too many conditions -> between.","opts":["It needs fewer participants than a within-subject design","Participants may refuse or be unable to perform tasks for too many test conditions","It removes the need for tasks because groups differ","It is always easier to manage than a within-subject design"],"ans":[1]},{"id":"n8fcd23c0","sec":2,"type":"mcq","topic":"empirical","concept":"participants","diff":"H","cat":"A","beyond":false,"q":"Using only a few friends of the same age and background as participants mainly affects the study by:","exp":"Homogeneous participants make the user profile a control variable; the conclusion applies only to similar users.","tip":"Narrow profile = narrow conclusion.","opts":["turning the dependent variable into a nominal variable","making the study within-subject","limiting the user profile so conclusions cannot be claimed for any user","eliminating the practice effect"],"ans":[2]},{"id":"n07a8b3fc","sec":2,"type":"mcq","topic":"stats","concept":"type-errors","diff":"H","cat":"A","beyond":false,"q":"A researcher rejects a null hypothesis that is actually true. She has made a:","exp":"Type I = alpha error; type II = failing to reject a false null hypothesis (avoided by larger samples).","tip":"Type I = false positive.","opts":["Type I error (false positive)","Gulf of evaluation","Sampling effect","Type II error (false negative)"],"ans":[0]},{"id":"n57d8125c","sec":2,"type":"mcq","topic":"stats","concept":"parametric","diff":"H","cat":"A","beyond":false,"q":"Which is NOT a condition for using a parametric test?","exp":"The three conditions are normality, interval/ratio scale and equal variance; otherwise use non-parametric tests.","tip":"Normal, interval, equal variance.","opts":["Data from a normally distributed population","A within-subject design","Approximately equal variance in the groups","At least an interval scale for the dependent variable"],"ans":[1]},{"id":"n57677a0f","sec":2,"type":"mcq","topic":"stats","concept":"parametric","diff":"H","cat":"A","beyond":false,"q":"Which tests help check whether sample data come from a normally distributed population?","exp":"The course names Shapiro-Wilk and Kolmogorov-Smirnov.","tip":"Shapiro-Wilk checks normality.","opts":["SUS and ASQ","Latin square and Gantt","t-test and ANOVA","Shapiro-Wilk and Kolmogorov-Smirnov"],"ans":[3]},{"id":"n0261249e","sec":2,"type":"mcq","topic":"project","concept":"cocomo","diff":"H","cat":"A","beyond":false,"q":"A project deals with a well-understood application with a small, experienced team. In basic COCOMO it is:","exp":"Organic: understood application, small experienced team (a = 2.4). Semidetached: mixed team; embedded: strongly coupled to hardware or regulations.","tip":"Organic = simple + experienced.","opts":["organic","agile","embedded","semidetached"],"ans":[0]},{"id":"nd1cb891a","sec":2,"type":"mcq","topic":"project","concept":"cocomo","diff":"H","cat":"A","beyond":false,"q":"Software strongly coupled to complex hardware under stringent regulations is classed in basic COCOMO as:","exp":"Embedded projects use a = 3.6, a1 = 1.2.","tip":"Hardware + rules = embedded.","opts":["organic","iterative","embedded","semidetached"],"ans":[2]},{"id":"n49f4c39a","sec":2,"type":"mcq","topic":"project","concept":"agile","diff":"H","cat":"A","beyond":false,"q":"Which is a core reason traditional SDLCs can be problematic, as described in the course?","exp":"All requirements are identified first, everything is implemented before deployment and each stage produces detailed documents.","tip":"Rigid + document heavy.","opts":["They cannot be made iterative in any form at all","They have no testing stage before the product is deployed","Strict requirements and heavy documentation at each stage lead to rigidity and overruns","They eliminate documentation to save time and cost"],"ans":[2]},{"id":"n3200517c","sec":2,"type":"mcq","topic":"project","concept":"agile","diff":"H","cat":"A","beyond":false,"q":"Which practice helps agile development stay agile?","exp":"Daily meetings, live demos, regular feedback sharing and openness to change.","tip":"Daily + demo + feedback.","opts":["Daily meetings, live demos after each iteration and regular feedback","Avoiding stakeholder feedback until the final release","Delivering the product only at the end of the project","Freezing all the requirements at the start of the project"],"ans":[0]},{"id":"n5e5423b7","sec":2,"type":"mcq","topic":"project","concept":"gantt","diff":"H","cat":"A","beyond":false,"q":"Which chart uses boxes and arrows annotated with pessimistic, likely and optimistic estimates?","exp":"PERT charts: network of activities (boxes) and dependencies (arrows) with time estimates; Gantt bar length is planned duration.","tip":"PERT = network.","opts":["Gantt chart","PERT chart","DFD","Affinity diagram"],"ans":[1]},{"id":"n9ad79293","sec":3,"type":"msq","topic":"intro","concept":"history","diff":"M","cat":"A","beyond":false,"q":"Select ALL developments that belong to the early phase (1980s to early 21st century) of interactive systems.","exp":"Early phase: the era of personal computers (IBM PC, Xerox Star, Mac, WWW 1989, Mosaic 1993). Sketchpad is pre-history; Android belongs to the pre-modern phase.","tip":"PC era = early phase.","opts":["Apple Mac (1984)","IBM PC (1981)","Xerox Star introducing GUI, WYSIWYG and metaphors (1981)","Android 1.0 (2008)","Sketchpad (1963)"],"ans":[0,1,2]},{"id":"n5b027a36","sec":3,"type":"msq","topic":"intro","concept":"nielsen-components","diff":"M","cat":"A","beyond":false,"q":"Which of the following are Nielsen's five quality components of usability?","exp":"Utility is a separate quality attribute that, with usability, makes a product acceptable.","tip":"LEMES.","opts":["Efficiency","Memorability","Satisfaction","Errors","Learnability","Utility"],"ans":[0,1,2,3,4]},{"id":"na11e1c82","sec":3,"type":"msq","topic":"intro","concept":"usability-def","diff":"M","cat":"A","beyond":false,"q":"Which three measures are part of the ISO definition of usability?","exp":"ISO 9241-210: effectiveness, efficiency and satisfaction in a specified context.","tip":"ISO = EES.","opts":["Learnability","Efficiency","Memorability","Satisfaction","Effectiveness"],"ans":[1,3,4]},{"id":"nd67f359d","sec":3,"type":"msq","topic":"intro","concept":"user-categories","diff":"M","cat":"A","beyond":false,"q":"Which are generic user categories used in the course?","exp":"Generic categories are novice, intermittent and expert.","tip":"NIE.","opts":["Super knowledgeable","Novice","Programmer","Expert","Intermittent"],"ans":[1,3,4]},{"id":"n0b870419","sec":3,"type":"msq","topic":"intro","concept":"waterfall","diff":"M","cat":"A","beyond":false,"q":"Which of the following are stages of the classical waterfall model?","exp":"Seven stages: feasibility, requirements, system design, coding and unit testing, integration and system testing, deployment, maintenance.","tip":"No learnability stage.","opts":["Feasibility study","Maintenance","System design","Integration and system testing","Learnability study"],"ans":[0,1,2,3]},{"id":"nbede37c0","sec":3,"type":"msq","topic":"intro","concept":"spiral-model","diff":"M","cat":"A","beyond":false,"q":"Select ALL true statements about the spiral model.","exp":"1st quadrant identifies objectives and risks; 3rd is development.","tip":"4 quadrants, many spirals.","opts":["Each iteration is divided into four quadrants","It is a meta model encompassing other SDLCs","The third quadrant defines objectives","The second quadrant handles risk assessment and mitigation","It has exactly one iteration"],"ans":[0,1,3]},{"id":"nab727d9f","sec":3,"type":"msq","topic":"intro","concept":"ucd-lifecycle","diff":"M","cat":"B","beyond":false,"q":"Which statements about the interactive system life cycle (UCD) are correct?","exp":"Frequent late loops raise development cost.","tip":"Early quick loops only.","opts":["Requirement gathering should involve end users, not only the client","Loops other than design-prototype-evaluate should be frequent","The design-prototype-evaluate loop is repeated quickly","Empirical study with end users differs from code testing"],"ans":[0,2,3]},{"id":"nacd5a671","sec":3,"type":"msq","topic":"reqs","concept":"nfr","diff":"M","cat":"A","beyond":false,"q":"Which of the following are categories of non-functional requirements in the course?","exp":"NFR categories as listed in lecture 5.","tip":"Five NFR groups.","opts":["Economic considerations","Interface issues","Performance related","Life-cycle requirements","Function hierarchy","Operating constraints"],"ans":[0,1,2,3,5]},{"id":"n66c3b8b3","sec":3,"type":"msq","topic":"reqs","concept":"contextual-inquiry","diff":"M","cat":"A","beyond":false,"q":"Which are stages of contextual inquiry?","exp":"Five stages: plan, initiate, execute, close, reflect.","tip":"PIECR.","opts":["Close","Plan","Execute","Reflect","Initiate","Analyse and deploy"],"ans":[0,1,2,3,4]},{"id":"nc732f25d","sec":3,"type":"msq","topic":"reqs","concept":"contextual-inquiry","diff":"M","cat":"A","beyond":false,"q":"Select ALL activities that belong to the PLAN stage of contextual inquiry.","exp":"Thank-you notes belong to the close stage; permission is the initiate stage.","tip":"Plan = prepare.","opts":["Gathering knowledge about the task domain","Identifying goals of observation","Scripting the procedure and rehearsing","Arranging for recording observations","Sending thank-you notes"],"ans":[0,1,2,3]},{"id":"nf2098b52","sec":3,"type":"msq","topic":"reqs","concept":"contextual-inquiry","diff":"H","cat":"A","beyond":false,"q":"Which statements about contextual inquiry are TRUE?","exp":"CI observes users in their natural work setting.","tip":"Natural setting.","opts":["It is a functional requirement specification notation","It combines interview and observation","It is performed in a lab away from the work setting","It usually continues for one to two hours","It is often called a semi-structured interview process"],"ans":[1,3,4]},{"id":"nac75cbd2","sec":3,"type":"msq","topic":"reqs","concept":"affinity-diagram","diff":"M","cat":"A","beyond":false,"q":"Which are steps of the affinity diagram method?","exp":"Five steps, ending with drawing the finished diagram.","tip":"GDSHD.","opts":["Display ideas","Draw a DFD","Create group headers","Generate ideas","Sort ideas into groups"],"ans":[0,2,3,4]},{"id":"n2d745b96","sec":3,"type":"msq","topic":"reqs","concept":"srs","diff":"M","cat":"A","beyond":false,"q":"Which are TRUE of functional requirement specification (SRS)?","exp":"Abstraction, decomposition and hierarchy are the main ideas.","tip":"What, not how.","opts":["It states what is needed, not how to get it","Functions are black boxes with defined input and output","It specifies the algorithm of each function","Functions are organised hierarchically"],"ans":[0,1,3]},{"id":"n66bcbf6b","sec":3,"type":"msq","topic":"design","concept":"golden-rules","diff":"M","cat":"A","beyond":false,"q":"Which of the following are among Shneiderman's eight golden rules?","exp":"The last two are Norman's principles.","tip":"Shneiderman vs Norman.","opts":["Exploit natural and artificial constraints","Use both knowledge in the world and in the head","Permit easy reversal of actions","Offer informative feedback","Reduce short-term memory load","Strive for consistency"],"ans":[2,3,4,5]},{"id":"nfd5a1700","sec":3,"type":"msq","topic":"design","concept":"golden-rules","diff":"M","cat":"A","beyond":false,"q":"Which are TRUE of Shneiderman's rule 'strive for consistency'?","exp":"Consistency is both internal and with the environment.","tip":"Internal + external.","opts":["It includes external (environmental) consistency","It applies only to command-line interfaces","It means all users must be given the same interface","It includes internal consistency"],"ans":[0,3]},{"id":"nb109cf68","sec":3,"type":"msq","topic":"design","concept":"norman-principles","diff":"H","cat":"B","beyond":false,"q":"Which are among Norman's seven principles?","exp":"The last two are Shneiderman's golden rules.","tip":"Norman: knowledge, simplify, visible, mappings, constraints, error, standardise.","opts":["Permit easy reversal of actions","Standardise when all else fails","Simplify the structure of tasks","Design dialogues to yield closure","Get the mappings right","Design for error"],"ans":[1,2,4,5]},{"id":"n4abefc0d","sec":3,"type":"msq","topic":"design","concept":"code-design","diff":"M","cat":"A","beyond":false,"q":"Which are part of high-level (preliminary) design?","exp":"The last two belong to detailed design.","tip":"High-level = modules and links.","opts":["Definition of interfaces between modules","Identification of algorithms for modules","Selection of data structures for modules","Control relationships between modules","Identification of modules"],"ans":[0,3,4]},{"id":"nef7e9982","sec":3,"type":"msq","topic":"design","concept":"code-design-lang","diff":"M","cat":"A","beyond":false,"q":"Code design can be expressed using:","exp":"Storyboards and mock-ups are interface design languages (prototypes).","tip":"Three kinds of language.","opts":["paper mock-ups","storyboards","formal languages","natural languages","semi-formal languages"],"ans":[2,3,4]},{"id":"na675cfd5","sec":3,"type":"msq","topic":"norman","concept":"norman-model","diff":"M","cat":"A","beyond":false,"q":"Which are actions of the EXECUTION stage in Norman's model?","exp":"Perception, interpretation and evaluation form the evaluation stage.","tip":"4 execute + 3 evaluate.","opts":["Execute the action","Perceive the system state","Formulate the intention","Specify the action sequence","Establish the goal","Interpret the system state"],"ans":[0,2,3,4]},{"id":"nb9c4091d","sec":3,"type":"msq","topic":"norman","concept":"norman-model","diff":"M","cat":"A","beyond":false,"q":"Which actions of Norman's model are purely mental?","exp":"Execution is motor action and p ","cat":"A","beyond":false,"q":"Assertion (A): A calendar app with all features can still be unusable. Reason (R): Usability is defined for specified users, goals and context, not for every feature.","exp":"Adding every conceivable feature does not necessarily make a product usable.","tip":"Specified.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"na5e16a9a","sec":4,"type":"mcq","topic":"reqs","concept":"srs","diff":"M","cat":"A","beyond":false,"q":"Assertion (A): SRS functions describe how the output is computed from the input. Reason (R): SRS functions are black boxes with defined input and output.","exp":"SRS says what is needed, not how.","tip":"What not how.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[3],"ar":true},{"id":"n789f9b79","sec":4,"type":"mcq","topic":"norman","concept":"gulfs","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): A user who cannot find a control to print on both sides faces a gulf of execution. Reason (R): The actions the user specifies are not supported by the interface.","exp":"Gulf of execution = mismatch between intended actions and what the interface supports.","tip":"Can't do it.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"nc08e540b","sec":4,"type":"mcq","topic":"eval","concept":"cognitive-walkthrough","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): Heuristic evaluation is preferred for large systems with many usage scenarios. Reason (R): It does not need task scenarios; evaluators check the whole system against a checklist.","exp":"Scenario-based walkthroughs cannot cover all usage scenarios.","tip":"Checklist covers all.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"nbbec726f","sec":4,"type":"mcq","topic":"sysdesign","concept":"dfd","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): The context diagram of a DFD shows all data stores. Reason (R): Data stores are shown first at level 1.","exp":"Level 0 has one process and no stores shown.","tip":"Stores from level 1.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[3],"ar":true},{"id":"n488324d2","sec":4,"type":"mcq","topic":"blackbox","concept":"equivalence-class","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): Testing with one value of an equivalence class is as good as testing with all its values. Reason (R): The program is assumed to behave similarly for every member of the class.","exp":"Equivalence class definition.","tip":"One per class.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"n576c802c","sec":4,"type":"mcq","topic":"whitebox","concept":"coverage","diff":"H","cat":"B","beyond":false,"q":"Assertion (A): Branch coverage guarantees statement coverage. Reason (R): Covering both outcomes of every branch condition executes every statement.","exp":"Branch coverage is a stronger strategy than statement coverage.","tip":"Branch > statement.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"n820f1bfe","sec":4,"type":"mcq","topic":"empirical","concept":"variables","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): The practice effect is a confounding variable in a within-subject design. Reason (R): Participants' experience with the first interface may affect their performance with the second.","exp":"Counterbalancing (e.g. Latin Square) deals with it.","tip":"Practice effect.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"ndbcd1065","sec":4,"type":"fill","topic":"intro","concept":"history","diff":"E","cat":"A","beyond":false,"q":"The modern age of computing, the era of interconnected devices, is considered to start in ______.","exp":"Modern phase: 2011 onwards.","tip":"2011.","fills":["2011","2011 onwards"]},{"id":"ne2068e0f","sec":4,"type":"fill","topic":"intro","concept":"nielsen-components","diff":"M","cat":"A","beyond":false,"q":"Nielsen proposed ______ quality components of usability.","exp":"Learnability, efficiency, memorability, errors, satisfaction.","tip":"Five.","fills":["five","5"]},{"id":"nbb28cccf","sec":4,"type":"fill","topic":"reqs","concept":"contextual-inquiry","diff":"M","cat":"A","beyond":false,"q":"A contextual inquiry session typically lasts one to two ______.","exp":"One to two hours.","tip":"Hours.","fills":["hours","hour"]},{"id":"nea1cd2ec","sec":4,"type":"fill","topic":"design","concept":"golden-rules","diff":"M","cat":"A","beyond":false,"q":"Miller's 1956 rule limiting short-term memory is called the '7 plus or minus ______' rule.","exp":"Seven plus or minus two.","tip":"7 +- 2.","fills":["2","two"]},{"id":"n9903cacd","sec":4,"type":"fill","topic":"norman","concept":"gulfs","diff":"M","cat":"A","beyond":false,"q":"A mismatch between the user's interpretation of the interface and its actual state is the gulf of ______.","exp":"Gulf of evaluation.","tip":"Evaluation.","fills":["evaluation"]},{"id":"n4de1e4ff","sec":4,"type":"fill","topic":"eval","concept":"sus","diff":"M","cat":"A","beyond":false,"q":"SUS stands for System Usability ______.","exp":"System Usability Scale.","tip":"Scale.","fills":["scale"]},{"id":"nf2c2506c","sec":4,"type":"fill","topic":"sysdesign","concept":"er-diagram","diff":"M","cat":"A","beyond":false,"q":"The ER diagram was proposed by Peter ______ in 1976.","exp":"Peter Chen.","tip":"Chen.","fills":["chen"]},{"id":"ne480483c","sec":4,"type":"fill","topic":"ood","concept":"uml","diff":"M","cat":"A","beyond":false,"q":"UML stands for ______ Modeling Language.","exp":"Unified Modeling Language.","tip":"Unified.","fills":["unified"]},{"id":"n69286c03","sec":4,"type":"fill","topic":"blackbox","concept":"boundary-value","diff":"M","cat":"B","beyond":false,"q":"Selecting test cases at the edges of equivalence classes is called boundary value ______.","exp":"Boundary value analysis.","tip":"BVA.","fills":["analysis"]},{"id":"na3d50c3c","sec":4,"type":"fill","topic":"whitebox","concept":"cyclomatic","diff":"M","cat":"A","beyond":false,"q":"Cyclomatic complexity computed from edges (E) and nodes (N) is E - N + ______.","exp":"E - N + 2.","tip":"+2.","fills":["2","two"]},{"id":"n71ba10ca","sec":4,"type":"fill","topic":"empirical","concept":"hypothesis","diff":"M","cat":"A","beyond":false,"q":"The hypothesis stating that the test condition does not affect the outcome is the ______ hypothesis.","exp":"Null hypothesis.","tip":"Null.","fills":["null"]},{"id":"n023beef3","sec":4,"type":"fill","topic":"project","concept":"cocomo","diff":"M","cat":"A","beyond":false,"q":"COCOMO was proposed by ______ in 1981.","exp":"Boehm.","tip":"Boehm.","fills":["boehm"]},{"id":"n960ec211","sec":4,"type":"short","topic":"reqs","concept":"contextual-inquiry","diff":"H","cat":"A","beyond":false,"q":"List the five stages of contextual inquiry and briefly state what happens in the Reflect stage.","exp":"Contextual inquiry.","tip":"PIECR.","ref":"The stages are plan, initiate, execute, close and reflect. In the reflect stage the collected data is analysed to identify design goals, often with tools such as the affinity diagram method.","rubric":[{"t":"Names the five stages","kw":["plan","initiate","execute","close","reflect"]},{"t":"Reflect stage analyses collected data","kw":["analy","data"]},{"t":"Identifies design goals or mentions affinity diagram","kw":["design goals","affinity"]}]},{"id":"n620c9d2b","sec":4,"type":"short","topic":"design","concept":"golden-rules","diff":"H","cat":"A","beyond":false,"q":"Explain any four of Shneiderman's eight golden rules with one example each.","exp":"Golden rules.","tip":"8 rules.","ref":"Examples: strive for consistency (internal and external); design for universal usability (menus and hotkeys); offer informative feedback (progress bars); design dialogues to yield closure; offer error prevention and simple error handling; permit easy reversal of actions (undo/redo); keep users in control (drag and drop); reduce short-term memory load (7+-2).","rubric":[{"t":"Mentions at least four rules","kw":["consisten","universal","feedback","closure","error","reversal","undo","control","memory"]},{"t":"Gives examples","kw":["example","progress","undo","hotkey","menu","drag"]},{"t":"Correct attribution to Shneiderman and eight rules","kw":["shneiderman","eight","8"]}]},{"id":"n59a49096","sec":4,"type":"short","topic":"norman","concept":"norman-model","diff":"H","cat":"A","beyond":false,"q":"Describe Norman's model of interaction and explain the gulf of execution and the gulf of evaluation.","exp":"Norman.","tip":"7 actions, 2 gulfs.","ref":"Norman's model has seven actions in two stages. Execution: goal, intention, action sequence specification and execution. Evaluation: perceiving, interpreting and evaluating the system state against the goal. The gulf of execution is a gap between intended actions and those the interface supports; the gulf of evaluation is a mismatch between the user's interpretation and the actual system state.","rubric":[{"t":"Seven actions or two stages (execution and evaluation)","kw":["seven","execution","evaluation"]},{"t":"Execution stage actions (goal, intention, specify, execute)","kw":["goal","intention"]},{"t":"Evaluation stage actions (perceive, interpret, evaluate)","kw":["perceive","interpret"]},{"t":"Defines gulf of execution","kw":["gulf of execution"]},{"t":"Defines gulf of evaluation","kw":["gulf of evaluation"]}]},{"id":"nbb5fda03","sec":4,"type":"short","topic":"eval","concept":"heuristic-eval","diff":"H","cat":"A","beyond":false,"q":"Compare cognitive walkthrough and heuristic evaluation.","exp":"Expert evaluation.","tip":"CW = tasks; HE = checklist.","ref":"Cognitive walkthrough is scenario-based: evaluators perform tasks on a vertical low-fidelity prototype and answer questions framed beforehand. Heuristic evaluation checks the whole system against a checklist (heuristics such as Nielsen's 10) without scenarios; horizontal prototypes suffice. Both use a team of at least 3-5 evaluators.","rubric":[{"t":"Walkthrough is scenario-based with vertical prototype","kw":["scenario","vertical","task"]},{"t":"Heuristic evaluation uses a checklist of heuristics","kw":["checklist","heuristic"]},{"t":"Heuristic needs no scenario and horizontal is enough","kw":["horizontal","no scenario","without scenario"]},{"t":"Team of 3-5 evaluators","kw":["3-5","three","team"]}]},{"id":"nec339d82","sec":4,"type":"short","topic":"blackbox","concept":"equivalence-class","diff":"H","cat":"A","beyond":false,"q":"Explain equivalence class partitioning and boundary value analysis with the example of a square root program for integers in [0, 5000].","exp":"Black-box testing.","tip":"3 classes + 4 boundaries.","ref":"Equivalence classes: negative integers (invalid), integers 0 to 5000 (valid), integers above 5000 (invalid); one test case per class is enough. Boundary value analysis adds test cases at the boundaries: -1, 0, 5000 and 5001. Test cases include input and expected output.","rubric":[{"t":"Defines equivalence class partitioning","kw":["equivalence","partition","class"]},{"t":"Three classes for the example","kw":["negative","valid","5000"]},{"t":"Boundary values -1, 0, 5000, 5001","kw":["-1","5001","boundary"]}]},{"id":"ne620c31d","sec":4,"type":"short","topic":"empirical","concept":"study-design","diff":"H","cat":"A","beyond":false,"q":"Differentiate within-subject and between-subject designs and explain how the practice effect is handled.","exp":"Experiment design.","tip":"Within = all; between = subsets.","ref":"In a within-subject (repeated-measure) design every participant performs tasks for all test conditions; it is easy to manage but may cause practice effect. In a between-subject design participants perform tasks for only a subset of conditions; it needs more participants. The practice effect is handled by counterbalancing the sequence, randomising it or using the Latin Square method.","rubric":[{"t":"Within-subject: all conditions per participant","kw":["within","all","repeated"]},{"t":"Between-subject: subset of conditions per group","kw":["between","subset","group"]},{"t":"Practice effect arises in within-subject designs","kw":["practice"]},{"t":"Counterbalancing, randomising or Latin Square","kw":["counterbalanc","latin","random"]}]},{"id":"n703a4344","sec":4,"type":"short","topic":"stats","concept":"type-errors","diff":"H","cat":"A","beyond":false,"q":"What are Type I and Type II errors in significance testing and how can each be reduced?","exp":"Errors.","tip":"I = alpha; II = beta.","ref":"A Type I error (alpha, false positive) occurs when a true null hypothesis is rejected; it is reduced by using a low p value such as p < 0.05. A Type II error (beta, false negative) occurs when a false null hypothesis is not rejected; it is reduced by using larger sample sizes.","rubric":[{"t":"Type I = false positive (reject a true null)","kw":["type i","false positive","alpha"]},{"t":"Type II = false negative (fail to reject a false null)","kw":["type ii","false negative","beta"]},{"t":"Low p value reduces Type I","kw":["p","low"]},{"t":"Larger sample reduces Type II","kw":["larger","sample"]}]},{"id":"n09b03897","sec":4,"type":"mcq","topic":"coding","concept":"review-testing","diff":"M","cat":"A","beyond":false,"q":"Which review-based method resembles a heuristic evaluation?","exp":"Inspection uses a checklist of common errors.","tip":"Inspection = checklist.","opts":["Integration testing","Black-box testing","Code walkthrough","Code inspection"],"ans":[3]},{"id":"n514c7d68","sec":4,"type":"mcq","topic":"norman","concept":"norman-model","diff":"H","cat":"A","beyond":false,"q":"A user presses the wrong key although she knows exactly what she wants to do. Which concept applies?","exp":"Right goal, wrong action = slip.","tip":"Slip.","opts":["Gulf of evaluation","Slip","Mistake","Heuristic violation"],"ans":[1]},{"id":"nbfd75102","sec":4,"type":"msq","topic":"design","concept":"golden-rules","diff":"H","cat":"A","beyond":false,"q":"Which golden rules are violated when users must switch to another page to look up station codes?","exp":"The case study cites rules 2, 7 and 8.","tip":"2, 7, 8.","opts":["Keep users in control","Reduce short-term memory load","Offer informative feedback","Permit easy reversal of actions","Design for universal usability"],"ans":[0,1,4]},{"id":"n8b462205","sec":4,"type":"msq","topic":"sysdesign","concept":"cohesion","diff":"H","cat":"A","beyond":false,"q":"Which are cohesion types in which all functions share a common element?","exp":"Content is coupling, not cohesion.","tip":"Cohesion types.","opts":["Temporal (same time span)","Communication (same data structure)","Logical (similar operations)","Content"],"ans":[0,1,2]},{"id":"n16746be8","sec":4,"type":"msq","topic":"project","concept":"agile","diff":"H","cat":"A","beyond":false,"q":"Which practices help an agile project?","exp":"Agile eliminates unnecessary documentation.","tip":"Agile = small, fast, feedback.","opts":["Starting small","Regular stakeholder feedback","Completing all documentation before coding","Daily team meetings","Live demo after each iteration"],"ans":[0,1,3,4]},{"id":"n74ebee34","sec":1,"type":"mcq","topic":"coding","concept":"blackbox-req","diff":"M","cat":"A","beyond":false,"q":"Which information is enough to design black-box test cases?","exp":"Black-box tests use only input/output values; no knowledge of design or code is needed.","tip":"I/O only.","opts":["The source code listing","The internal data structures","The control flow graph","The input domain and expected outputs"],"ans":[3]},{"id":"n68eb1eac","sec":2,"type":"mcq","topic":"whitebox","concept":"branch-coverage","diff":"H","cat":"A","beyond":false,"q":"A test suite executes every statement of a program but no test ever makes an 'if' condition false. Which stronger coverage is NOT satisfied?","exp":"Branch coverage needs both true and false outcomes for each condition; statement coverage is the weaker strategy.","tip":"Branch needs both outcomes.","opts":["Statement coverage","Branch coverage","Neither statement nor branch coverage","Both are satisfied"],"ans":[1]},{"id":"nd4b3286b","sec":1,"type":"mcq","topic":"eval","concept":"cw-questions","diff":"M","cat":"A","beyond":false,"q":"Which question would typically be framed for a cognitive walkthrough?","exp":"Walkthrough questions follow the user's steps through a task (see the control, see the effect, select another control, understand feedback, error handling).","tip":"Walkthrough = user steps.","opts":["Will a user see the control for a particular action?","Does the product have documentation?","Is the error message in plain language?","Is the system status always visible?"],"ans":[0]},{"id":"n2b5c627b","sec":1,"type":"mcq","topic":"design","concept":"design-prototype-eval","diff":"M","cat":"A","beyond":false,"q":"The design-prototype-evaluate l inciples","New functional requirements","A test suite","Design guidelines or recommendations","A code walkthrough report"],"ans":[0,1,3]},{"id":"nedff25d1","sec":1,"type":"mcq","topic":"coding","concept":"functional-testing","diff":"M","cat":"A","beyond":false,"q":"Functional testing designs test cases using only the:","exp":"Functional (black-box) testing uses no knowledge of internal structure.","tip":"Functional = spec only.","opts":["functional specification of the software","internal structure of the code","coding standards","control flow graph"],"ans":[0]},{"id":"n8d70b515","sec":1,"type":"mcq","topic":"ood","concept":"functional-vs-oo","diff":"M","cat":"A","beyond":false,"q":"In an object-oriented design of a library management system, which is a natural 'object'?","exp":"Issue book, register and check availability are services (functions) in the functional approach; member and book register are objects.","tip":"Nouns = objects.","opts":["Member","Check availability","Issue book","Register"],"ans":[0]},{"id":"n7edce97d","sec":2,"type":"mcq","topic":"coding","concept":"inspection","diff":"H","cat":"A","beyond":false,"q":"Which finding is typical of a code inspection?","exp":"Inspection finds common oversights (uninitialised variables, jumps into loops, non-terminating loops).","tip":"Inspection = common code errors.","opts":["A request for a new feature","A user cannot find the print button","A slow network response","An uninitialised variable used in a loop"],"ans":[3]},{"id":"n90d20d12","sec":1,"type":"mcq","topic":"intro","concept":"iterative-dev","diff":"M","cat":"A","beyond":false,"q":"Why is interactive software development described as iterative?","exp":"UCD needs iteration between stages to account for user feedback.","tip":"Feedback -> iteration.","opts":["Developers dislike documentation and want to rewrite it","User feedback must be accounted for repeatedly across stages","Code can never be compiled in a single step","Requirements never exist until opts":["executable code generated from the SRS","test suites used for system testing","abstract descriptions of the system being analysed","user manuals written for end users"],"ans":[2]},{"id":"nd650fc3b","sec":1,"type":"mcq","topic":"eval","concept":"valid-methods","diff":"M","cat":"A","beyond":false,"q":"Which is a prototype evaluation method rather than a requirements analysis tool?","exp":"Cognitive walkthrough and heuristic evaluation evaluate prototypes; CI and affinity diagrams belong to requirements.","tip":"Evaluate vs analyse.","opts":["Heuristic evaluation","Affinity diagram","SRS","Contextual inquiry"],"ans":[0]},{"id":"n37352150","sec":1,"type":"mcq","topic":"whitebox","concept":"wbt-def","diff":"M","cat":"A","beyond":false,"q":"White-box testing is also known as:","exp":"Structural testing designs cases using knowledge of the internal structure.","tip":"White = structural.","opts":["usability testing","functional testing","structural testing","acceptance testing"],"ans":[2]},{"id":"nc658fa49","sec":2,"type":"mcq","topic":"whitebox","concept":"whitebox-def","diff":"H","cat":"A","beyond":false,"q":"Why is white-box testing harder than black-box testing?","exp":"White-box needs internal knowledge, program visualisation (CFG) and coverage design.","tip":"Internal knowledge needed.","opts":["It cannot measure coverage of the code at all","It needs no test cases because the code is visible","It tests only the user interface of the product","It requires knowledge of the internal structure of the code"],"ans":[3]},{"id":"nf512ea89","sec":4,"type":"tf","topic":"coding","concept":"whitebox-def","diff":"M","cat":"A","beyond":false,"q":"Black-box testing requires knowledge of the internal structure of the code.","exp":"That is required for white-box testing.","tip":"Black = no code knowledge.","opts":["True","False"],"ans":[1]}],"revision":{"people":[["Ben Shneiderman","Coined 'user-centered design' (1986); eight golden rules of interface design; direct manipulation (1982)"],["Don Norman","Model of interaction (seven stages of action); gulfs of execution and evaluation; seven design principles (1988)"],["Jakob Nielsen","Five quality components of usability (learnability, efficiency, memorability, errors, satisfaction); 10 usability heuristics (1994); utility + usability"],["George A. Miller","'7 +- 2' short-term memory rule (1956)"],["Mark Weiser","Introduced 'ubiquitous computing' (1991)"],["Kevin Ashton / Helen Gill","IoT (1999) / Cyber-Physical Systems (2006)"],["Ivan Sutherland","Sketchpad (1963)"],["Douglas Engelbart","NLS (1968): the mouse"],["Peter Chen","Entity-Relationship (ER) diagram (1976)"],["Barry Boehm","COCOMO (1981); three stages of cost estimation (basic, intermediate, complete)"],["Henry Gantt","Gantt chart"],["Likert","Likert rating scale (1932)"],["Beyer and Holtzblatt","Contextual design (1997)"],["Rajib Mall","Fundamentals of Software Engineering - reference for design and testing chapters"]],"confusable":[["Usability vs utility","Usability = effectiveness/efficiency/satisfaction for specified users, goals and context. Utility = functional support for user needs. A useful product needs both."],["Learnability vs memorability","Learnability = first-time users doing basic tasks. Memorability = intermittent users re-establishing proficiency after a gap."],["System-centred vs user-centred design","SCD: what can I build easily, what do tools offer, what do I find interesting? UCD: based on users' abilities, context and goals."],["Functional vs non-functional requirements","Functional: expressed as functions with input and output. Non-functional: quality attributes (performance, constraints, cost, life cycle, interface issues, usability)."],["Active vs passive contextual inquiry","Active: observer physically present. Passive: activities recorded and reviewed later."],["Plan vs Initiate stage of CI","Plan: goals, domain knowledge, recording, users/place, script and rehearsal. Initiate: contact authorities and L), programming."],["Boundary vs controller vs entity objects","Boundary: actors interact (screens). Controller: coordinate. Entity: hold information."],["Code walkthrough vs code inspection","Walkthrough: hand-execute representative cases for logical errors (like cognitive walkthrough). Inspection: check against common errors/standards (like heuristic evaluation)."],["Black-box vs white-box testing","Black-box: inputs and outputs only (equivalence classes, boundary values). White-box: internal structure (coverage, CFG)."],["Statement vs branch vs condition vs path coverage","Increasing strength: statement, branch (implies statement), condition (implies branch), path (linearly independent paths)."],["Stub vs driver","Stub simulates lower-level routines (top-down). Driver simulates upper-level modules (bottom-up)."],["Alpha vs beta vs acceptance testing","Alpha: in-house test team. Beta: friendly customers. Acceptance: the customer."],["Independent vs dependent vs control vs confounding variables","Independent: controlled by experimenter. Dependent: observed. Control: fixed. Confounding: unnoticed or ignored but influences results."],["Nominal vs ordinal vs interval vs ratio","Codes, order, equal spacing, ratios (CPM)."],["Within-subject vs between-subject","Within: every participant does all conditions (practice effect). Between: each group does a subset (more participants)."],["Type I vs Type II error","Type I (alpha): false positive, reject a true null. Type II (beta): false negative, fail to reject a false null."],["Parametric vs non-parametric tests","Parametric (t-test) needs normality, interval/ratio scale, equal variance."],["Gantt vs PERT chart","Gantt: bars with length proportional to planned duration. PERT: network of boxes and arrows with pessimistic, likely, optimistic estimates."]],"topics":[{"id":"intro","defs":[["Computer (Oxford)","Electronic device that receives data, performs a sequence of operations per a stored program and produces information or ns":["OOA, OOD and OOP are different."],"memory":["9 diagrams, 5 views"]},{"id":"coding","defs":[["Code inspection","Check code against common errors and coding standards."],["Code walkthrough","Hand-execute representative cases to find logical errors."]],"points":["Coding standards improve readability, understandability and teamwork.","Function length at most about 10 lines; one comment per 3 lines.","Avoid cryptic style, obscure side effects, multi-purpose identifiers, lengthy functions, indiscriminate goto.","Code testing: review-based (inspection, walkthrough) and execution-based (black-box, white-box).","Walkthrough team of 3-5."],"misconceptions":["Walkthrough discussion is about finding errors, not fixing them."],"memory":["Inspection = heuristic; walkthrough = cognitive"]},{"id":"blackbox","defs":[["Test case","[input, system state, expected output]."],["Test suite","Set of all test cases."],["Equivalence class","Set of inputs on which the program behaves the same."]],"points":["Black-box: ECP and BVA; inputs and outputs only.","Square-root example: three classes and boundaries -1, 0, 5000, 5001.","Authentication example: six classes."],"misconceptions":["More random test cases does not mean better testing."],"memory":["One value per class"]},{"id":"whitebox","defs":[["CFG","Control flow graph: nodes = statements, edges = control transfer."],["Cyclomatic complexity","E - N + 2 or D + 1; upper bound of linearly independent paths."]],"points":["Coverage: statement, branch (edge), condition (2^n), path.","Integration: top-down (stubs), bottom-up (drivers).","System testing: alpha, beta, acceptance.","Performance tests: stress, volume, configuration, compatibility, regression, recovery, documentation, usability."],"misconceptions":["Branch coverage guarantees statement coverage, not the other way round."],"memory":["Stub = lower, driver = upper"]},{"id":"empirical","defs":[["Empirical research","Controlled experiment collecting and analysing observation data."],["Confounding variable","Influences results but is unnoticed or ignored (e.g. practice effect)."],["Null hypothesis","Test condition has no effect."]],"points":["Four stages: research question, variables, design, analysis.","Testable RQs are specific.","Independent (factors with levels), dependent, control, confounding variables.","Scales: nominal, ordinal, interval, ratio.","Participants: pilot 5; reliable 12-25.","Within-subject vs between-subject; counterbalance with randomisation or Latin Square."],"misconceptions":["Control variables limit the conclusion to fixed groups."],"memory":["NOIR"]},{"id":"stats","defs":[["Significance test","Test to refute the null hypothesis."],["Type I / Type II error","False positive / false negative."]],"points":["t(11) = 2.70, p < 0.05 format.","Parametric tests need normal data, interval/ratio scale, equal variance (check with Shapiro-Wilk, Kolmogorov-Smirnov).","Otherwise use non-parametric tests."],"misconceptions":["t-test is not the only test."],"memory":["Refute H0"]},{"id":"project","defs":[["COCOMO","Constructive Cost Estimation Model (Boehm 1981); basic, intermediate, complete."],["Agile","Quick turn-around with minimal documentation; iterations of 4-6 weeks."]],"points":["Planning estimates size, cost, duration, effort.","Size: LoC or function points.","Basic COCOMO: organic, semidetached, embedded.","Scheduling: task hierarchy, activity network, Gantt chart, PERT chart.","Agile methods: Scrum, XP, DAD, DSDM."],"misconceptions":["Gantt bars show duration; PERT is a network."],"memory":["Organic, Semi, Embedded"]}]},"seed":20261022};

/* ===== CORE: question model, grading, state, selection logic (no DOM access) ===== */
const OB = (function () {
  'use strict';
  const LS_KEY = 'nptelHCIsim.v1';

  const CATS = { asg: 'Original NPTEL assignment questions', newA: 'New questions on assignment concepts', newB: 'New questions on other syllabus concepts' };
  const DIFFN = { E: 'Easy', M: 'Moderate', H: 'Difficult' };
  const TYPEN = { mcq: 'Single answer', tf: 'True / False', msq: 'Multiple answer', match: 'Match the following', fill: 'Fill in the blank', short: 'Short answer', ar: 'Assertion-Reason' };
  const SECN = { 0: 'Assignment', 1: 'Section 1 - Standard MCQs', 2: 'Section 2 - Twisted / application MCQs', 3: 'Section 3 - Multiple-answer', 4: 'Section 4 - Mixed formats', 5: 'Original assignment questions' };

  /* ---------- question registry ---------- */
  const Q = {};
  const ASG = [];
  const NEW = [];
  const TOPIC = {};
  DATA.topics.forEach(t => (TOPIC[t.id] = t));
  DATA.assign.forEach(a => {
    const q = {
      id: a.id, src: 'asg', cat: 'asg', sec: 0, type: a.type, topic: a.topic, concept: a.concept, diff: a.diff,
      q: a.q, opts: a.opts, ans: a.type === 'fill' ? null : (a.keys || (a.key == null ? null : [a.key])), fills: a.fills, official: a.official, keySrc: a.keySrc,
      exp: a.exp, tip: a.tip, week: a.week, kind: a.kind, n: a.n, flag: a.flag || ''
    };
    Q[q.id] = q; ASG.push(q);
  });
  DATA.qs.forEach(d => {
    const q = Object.assign({}, d, { src: 'new', cat: d.cat === 'A' ? 'newA' : 'newB', official: true });
    q.kind2 = q.ar ? 'ar' : q.type;
    Q[q.id] = q; NEW.push(q);
  });
  const ALL = ASG.concat(NEW);
  const qtypeLabel = q => TYPEN[q.ar ? 'ar' : q.type];

  /* ---------- text helpers ---------- */
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(the|a|an)\s+/, '');
  }
  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function fillOK(q, a) {
    const n = norm(a);
    if (!n) return false;
    const n2 = n.replace(/\s+(stage|power|effect|bias|trust|theory|approach|conflict|style|motive)$/, '');
    return q.fills.some(f => {
      const g = norm(f);
      if (n === g || n2 === g) return true;
      if (g.length >= 6 && lev(n, g) <= (g.length >= 12 ? 2 : 1)) return true;
      return false;
    });
  }
  function rubricSuggest(q, text) {
    const t = String(text || '').toLowerCase();
    return q.rubric.map(r => {
      const hits = r.kw.filter(k => t.includes(k)).length;
      let need = 1;
      const m = r.t.match(/^at least (two|three)|^(two|three)\b/i);
      if (m) need = /two/i.test(m[0]) ? 2 : 3;
      return hits >= need;
    });
  }

  /* ---------- grading ---------- */
  // st: 'c' correct, 'w' wrong, 'p' partial, 'u' unanswered, 'r' needs manual review
  function isAnswered(a) {
    if (a == null) return false;
    if (Array.isArray(a)) return a.some(x => x != null && x !== '' && x !== -1);
    if (typeof a === 'string') return a.trim() !== '';
    return true;
  }
  function grade(q, a, cfg) {
    cfg = cfg || {};
    if (!isAnswered(a)) return { st: 'u', m: 0 };
    switch (q.type) {
      case 'mcq': case 'tf':
        if (!q.ans) return { st: 'r', m: 0 };
        return a === q.ans[0] ? { st: 'c', m: 1 } : { st: 'w', m: 0 };
      case 'msq': {
        const C = new Set(q.ans); const A = new Set(a);
        let hit = 0, bad = 0;
        A.forEach(x => (C.has(x) ? hit++ : bad++));
        if (hit === C.size && bad === 0) return { st: 'c', m: 1 };
        if (cfg.partial) {
          const m = Math.max(0, (hit - bad) / C.size);
          return { st: m > 0 ? 'p' : 'w', m: Math.round(m * 1000) / 1000 };
        }
        return { st: 'w', m: 0 };
      }
      case 'match': {
        let ok = 0;
        q.ans.forEach((r, i) => { if (a[i] === r) ok++; });
        if (ok === q.ans.length) return { st: 'c', m: 1 };
        if (cfg.partial && ok > 0) return { st: 'p', m: Math.round(ok / q.ans.length * 1000) / 1000 };
        return { st: 'w', m: 0 };
      }
      case 'fill':
        return fillOK(q, a) ? { st: 'c', m: 1 } : { st: 'w', m: 0 };
      case 'short':
        return { st: 'r', m: 0 };
    }
    return { st: 'w', m: 0 };
  }
  function reviewGrade(q, checks) {
    const n = q.rubric.length; const k = (checks || []).filter(Boolean).length;
    const f = n ? k / n : 0;
    return { st: f >= 0.6 ? 'c' : 'w', m: Math.round(f * 1000) / 1000 };
  }
  function correctText(q) {
    switch (q.type) {
      case 'mcq': case 'tf': return q.ans ? q.opts[q.ans[0]] : '(no key)';
      case 'msq': return q.ans.map(i => q.opts[i]).join('  |  ');
      case 'match': return q.lefts.map((l, i) => l + '  ->  ' + q.rights[q.ans[i]]).join('\n');
      case 'fill': return q.fills.join(' / ');
      case 'short': return q.ref;
    }
    return '';
  }
  function answerText(q, a) {
    if (!isAnswered(a)) return '(not answered)';
    switch (q.type) {
      case 'mcq': case 'tf': return q.opts[a] != null ? q.opts[a] : String(a);
      case 'msq': return a.map(i => q.opts[i]).join('  |  ');
      case 'match': return q.lefts.map((l, i) => l + '  ->  ' + (a[i] != null && a[i] >= 0 ? q.rights[a[i]] : '(blank)')).join('\n');
      default: return String(a);
    }
  }

  /* ---------- state ---------- */
  let storageOK = true;
  function defaultState() {
    return { v: 1, created: Date.now(), settings: { timerMin: 90, partial: false, defaultN: 20 }, q: {}, tests: [], asg: {}, mockUse: {}, mockCount: 0, current: null };
  }

function optionsHtml(q, s, reveal) {
  const id = q.id, a = s.ans[id], lock = reveal ? ' data-locked="1"' : '';
  if (q.type === 'mcq' || q.type === 'tf') {
    return `<div class="opts" role="radiogroup" aria-label="Answer options">` + q.opts.map((o, i) => {
      const sel = a === i, ok = q.ans && q.ans[0] === i;
      let cls = 'opt' + (sel ? ' sel' : '');
      if (reveal) { if (ok) cls += ' ok'; else if (sel) cls += ' bad'; }
      return `<button type="button" class="${cls}" role="radio" aria-checked="${sel}" data-act="pick" data-i="${i}"${lock}><span class="ltr">${LET[i]}</span><span class="otxt">${esc(o)}</span>${reveal && ok ? '<span class="tag ok">Correct answer</span>' : ''}${reveal && sel && !ok ? '<span class="tag bad">Your answer</span>' : ''}</button>`;
    }).join('') + '</div>';
  }
  if (q.type === 'msq') {
    const A = Array.isArray(a) ? a : [];
    return `<div class="opts" role="group" aria-label="Answer options (select all that apply)">` + q.opts.map((o, i) => {
      const sel = A.includes(i), ok = q.ans.includes(i);
      let cls = 'opt chk' + (sel ? ' sel' : '');
      if (reveal) { if (ok) cls += ' ok'; else if (sel) cls += ' bad'; }
      return `<button type="button" class="${cls}" role="checkbox" aria-checked="${sel}" data-act="pick" data-i="${i}"${lock}><span class="ltr">${sel ? '&#10003;' : LET[i]}</span><span class="otxt">${esc(o)}</span>${reveal && ok ? '<span class="tag ok">Correct option</span>' : ''}${reveal && sel && !ok ? '<span class="tag bad">Selected - incorrect</span>' : ''}${reveal && ok && !sel ? '<span class="tag bad">Missed</span>' : ''}</button>`;
    }).join('') + '</div>';
  }
  if (q.type === 'match') {
    const A = Array.isArray(a) ? a : [];
    return `<div class="match">` + q.lefts.map((l, i) => {
      const ok = reveal && A[i] === q.ans[i];
      return `<div class="mrow"><div class="ml">${esc(l)}</div><select data-act="match" data-i="${i}" aria-label="Match for ${esc(l)}"${reveal ? ' disabled' : ''}><option value="-1">- choose -</option>${q.rights.map((r, j) => `<option value="${j}"${A[i] === j ? ' selected' : ''}>${esc(r)}</option>`).join('')}</select>${reveal ? (ok ? '<span class="tag ok">Correct</span>' : `<span class="tag bad">Correct: ${esc(q.rights[q.ans[i]])}</span>`) : ''}</div>`;
    }).join('') + '</div>';
  }
  if (q.type === 'fill') {
    return `<input type="text" class="txt" data-act="fill" value="${esc(a || '')}" ${reveal ? 'readonly' : ''} autocomplete="off" spellcheck="false" aria-label="Type your answer" placeholder="Type your answer here">` +
      (reveal ? `<p class="expect"><b>Accepted answer(s):</b> ${esc(q.fills.join(' / '))}</p>` : '');
  }
  if (q.type === 'short') {
    return `<textarea class="txt" rows="7" data-act="short" ${reveal ? 'readonly' : ''} aria-label="Type your answer" placeholder="Write your answer in your own words...">${esc(a || '')}</textarea>`;
  }
  return '';
}
function rubricHtml(q, s, mode) {
  // self-review checklist for descriptive answers
  const id = q.id;
  const sug = OB.rubricSuggest(q, s.ans[id]);
  const cur = s.rev ? s.rev[id] : null;
  const done = cur && s.checked && s.checked[id] && s.checked[id].reviewed;
  const checks = cur || sug;
  return `<div class="rubric"><p class="expect"><b>Reference answer:</b> ${esc(q.ref)}</p>
  <p><b>Self-review rubric</b> - tick each point your answer covered (pre-ticked where keywords were detected; adjust honestly). 60% or more counts as correct.</p>
  <ul class="rub">${q.rubric.map((r, i) => `<li><label><input type="checkbox" data-rub="${i}" ${checks[i] ? 'checked' : ''} ${done ? 'disabled' : ''}> ${esc(r.t)}</label></li>`).join('')}</ul>
  ${done ? `<p class="note">Review saved: ${(cur || []).filter(Boolean).length} of ${q.rubric.length} points.</p>` : `<button class="btn primary" data-act="saveRubric" data-id="${id}">Save self-review</button>`}</div>`;
}
function explainHtml(q, extra) {
  const keyNote = q.src === 'asg'
    ? (q.official ? '<span class="tag ok">Official portal key</span>' : (q.keySrc === 'duplicate' ? '<span class="tag warn">Key from identical graded question</span>' : '<span class="tag warn">Unofficial answer (derived from lecture slides) - no official key in your export</span>'))
    : (q.beyond ? '<span class="tag warn">Uses textbook knowledge beyond the slides</span>' : '');
  return `<div class="explain" aria-live="polite">
    <div class="meta"><span class="pill">Concept: ${esc(conceptName(q.concept))}</span><span class="pill">${esc(topicTitle(q.topic))}</span><span class="pill">${OB.DIFFN[q.diff]}</span><span class="pill">${esc(OB.qtypeLabel(q))}</span> ${keyNote}</div>
    <p><b>Answer:</b> ${esc(OB.correctText(q)).replace(/\n/g, '<br>')}</p>
    <p><b>Explanation:</b> ${esc(q.exp)}</p>
    ${q.tip ? `<p class="memo"><b>Memory aid:</b> ${esc(q.tip)}</p>` : ''}
    ${q.flag ? `<p class="note">${esc(q.flag)}</p>` : ''}
    <p class="src">Source: ${esc(qSource(q))}</p>${extra || ''}</div>`;
}
function hint(q) {
  if (q.type === 'msq') return 'Multiple-answer question: select ALL options that are correct.';
  if (q.type === 'match') return 'Match every item on the left with one option from its drop-down list.';
  if (q.type === 'fill') return 'Type a short answer (capitalisation and extra spaces are ignored).';
  if (q.type === 'short') return 'Descriptive question: you will self-review it against a rubric. It is not auto-graded.';
  if (q.type === 'tf') return 'True / False.';
  return 'Single-answer question: choose ONE option.';
}

/* ---------- play view ---------- */

  groups.forEach((n, gi) => {
    if (s.secs) out += `<h4>${esc(OB.SECN[gi + 1])}</h4>`;
    out += '<div class="pal">';
    for (let i = off; i < off + n; i++) {
      const id = s.qids[i]; const ans = OB.isAnswered(s.ans[id]);
      let cls = 'pb';
      if (i === s.idx) cls += ' cur';
      if (s.mode !== 'learn') {
        if (!exam && s.checked[id]) cls += s.checked[id].st === 'c' ? ' good' : (s.checked[id].st === 'r' ? ' ans' : ' badd');
        else if (ans) cls += ' ans';
      }
      if (s.marked[id]) cls += ' mk';
      out += `<button class="${cls}" data-act="goto" data-i="${i}" aria-label="Question ${i + 1}${ans ? ', answered' : ''}${s.marked[id] ? ', marked for review' : ''}">${i + 1}</button>`;
    }

}

function advance() {
  // move to next question; in practice mode pause for a checkpoint after every 10 questions
  if (sess.sub && sess.idx >= sess.qids.length - 1) { finishSub(); return true; }
  if (sess.idx >= sess.qids.length - 1) return false;
  sess.idx++;
  if (sess.mode === 'practice' && !sess.sub && sess.idx % 10 === 0) sess.cp = true;
  OB.save(); render(); window.scrollTo(0, 0);
  return true;
}
function startReask(ids) {
  if (!mainSess) mainSess = sess;
  sess = OB.newSession({ kind: 'retry', label: 'Re-asking your mistakes', mode: 'practice', qids: OB.shuffle(ids), partial: S().settings.partial });
  sess.sub = true;
  go('play');
}
function finishSub() {
  const still = sess.qids.filter(id => !(sess.checked[id] && sess.checked[id].st === 'c'));
  if (still.length) { toast(still.length + ' still wrong - asking them again until you get them right.'); startReask(still); return; }
  sess = mainSess; mainSess = null; sess.cp = false; OB.save();
  toast('All mistakes from that block answered correctly - back to the quiz.');
  go('play');
}
function viewCheckpoint() {
  const s = sess, end = s.idx, start = end - 10;
  let c = 0, w = 0, u = 0, tc = 0, tw = 0;
  s.qids.forEach((id, i) => {
    const g = s.checked[id];
    if (i < end) { if (g && g.st === 'c') tc++; else if (g && (g.st === 'w' || g.st === 'p')) tw++; }
    if (i >= start && i < end) { if (!g) u++; else if (g.st === 'c') c++; else if (g.st === 'w' || g.st === 'p') w++; }
  });
  app.innerHTML = `<section class="card narrow"><h1>Checkpoint: ${end} of ${s.qids.length} done</h1>
   <div class="stats"><div><b>${c}</b>Correct (last 10)</div><div><b>${w}</b>Wrong (last 10)</div><div><b>${u}</b>Skipped</div></div>
   <p>So far: <b>${tc}</b> correct, <b>${tw}</b> wrong${end ? ' (' + Math.round(tc / Math.max(1, tc + tw) * 100) + '% accuracy)' : ''}. Wrong answers are already saved to your wrong-answer list.</p>
   ${(() => { const bad = s.qids.slice(start, end).filter(id => s.checked[id] && (s.checked[id].st === 'w' || s.checked[id].st === 'p')); if (!bad.length) return '<div class="banner good">No mistakes in the last 10 - nice.</div>'; return '<h2>Review your ' + bad.length + ' mistake(s)</h2><p class="small">Read each one, then continue when ready. They stay in your wrong-answer list until you answer them correctly twice.</p>' + bad.map(id => { const q = Q[id]; return `<details class="qrow st-w" open><summary><span class="qs">${esc(q.q)}</span></summary><div class="qbody">${q.type === 'fill' || q.type === 'short' ? '<p><b>Your answer:</b> ' + esc(s.ans[id] || '') + '</p>' : optionsHtml(q, s, true)}${explainHtml(q)}</div></details>`; }).join(''); })()}
   <div class="row">${(() => { const bad = s.qids.slice(start, end).filter(id => s.checked[id] && (s.checked[id].st === 'w' || s.checked[id].st === 'p')); return bad.length ? `<button class="btn primary lg" data-act="cp-reask" data-ids="${bad.join(',')}">Re-ask my ${bad.length} mistake(s) now</button>` : ''; })()}<button class="btn lg" data-act="cp-continue">Continue (next 10)</button><button class="btn" data-act="finish-practice">Finish &amp; see results</button><button class="btn" data-act="exit">Take a break (saved)</button></div></section>`;
}
function viewConfirm() {
  const s = sess;

/* ---------- results ---------- */
function resultStatusChip(st, reviewed) {
  const m = { c: ['Correct', 'good'], w: ['Incorrect', 'bad'], p: ['Partial', 'warn'], u: ['Unanswered', 'none'], r: ['Needs review', 'warn'] }[st];

}
function breakdownTable(title, obj, labelFn, order) {

    keys.map(k => { const o = obj[k]; const acc = o.scored ? o.m / o.scored : null; return `<tr><td>${esc(labelFn(k))}</td><td>${o.n}</td><td>${o.c}</td><td>${o.w}</td><td>${o.u}</td><td>${o.r}</td><td>${(Math.round(o.m * 100) / 100)}</td><td>${pct(acc)}</td></tr>`; }).join('') + '</table></div>';
}

     <div class="stats"><div><b>${sm.correct}</b>Correct</div><div><b>${sm.wrong}</b>Incorrect</div><div><b>${sm.unanswered}</b>Unanswered</div><div><b>${sm.review}</b>Need review</div></div>
   </div>

   ${target}

/* ===== UI part 2: dashboard, assignments, practice, mock, retry, progress, revision, settings, events ===== */
const pf = { cats: ['newA', 'newB'], topics: [], diffs: [], types: [], status: 'all', n: 20 };
const rf = { src: '', scope: 'all', topic: '', week: '', n: 20 };

function navBtn(name, label, cls) { return `<button class="btn ${cls || ''}" data-go="${name}">${label}</button>`; }
let menuOpen = false;
function renderHeader() {
  const h = $('#hdr'); if (!h) return;
  const items = [['home', 'Home'], ['assign', '1. Assignments'], ['practice', '2. New questions'], ['mock', '3. Mock exam'], ['retry', 'Wrong answers'], ['bookmarks', 'Bookmarks'], ['progress', 'Progress'], ['revision', 'Revision'], ['settings', 'Backup & settings']];
  h.innerHTML = `<div class="hwrap"><button class="burger" data-act="menu" aria-label="Menu" aria-expanded="${menuOpen}" aria-controls="menupanel">&#9776;</button><a class="brand" href="#/home" data-go="home">nptel <span>HCI quiz</span></a></div>
  ${menuOpen ? `<nav id="menupanel" aria-label="Main">${items.map(([n, l]) => `<button class="navb ${view.name === n || (n === 'assign' && view.name === 'asgweek') || (n === 'practice' && (view.name === 'setview' || view.name === 'custom')) ? 'on' : ''}" data-go="${n}">${esc(l)}</button>`).join('')}</nav>` : ''}`;
}

/* ---------- home ---------- */
function viewHome() {
  const o = OB.overall(); const cur = S().current; const cs = OB.catStats();
  const weakT = OB.topicStats().filter(t => t.a >= 3 && t.acc < 0.8).sort((a, b) => a.acc - b.acc).slice(0, 4);

  const storage = !OB.storageOK ? '<div class="banner warn" role="alert">Your browser blocked local storage, so progress cannot be saved between sessions. Use Export progress regularly, or open this file in a normal (non-private) browser window.</div>' : '';
  app.innerHTML = `<section>
  ${flash ? `<div class="banner info" role="status">${esc(flash)}</div>` : ''}${storage}${resume}
  <div class="hero"><h1>NPTEL HCI Quiz</h1>
   <p>Design &amp; Implementation of Human-Computer Interfaces (Dr. Samit Bhattacharya, IIT Guwahati) - ${o.total} questions: ${OB.ASG.length} original assignment questions and ${OB.NEW.length} new questions. Works offline; progress is saved in this browser.</p></div>
  <div class="stages">
    <article class="stage rec"><span class="badge">Recommended first step</span><h2>1. Learn NPTEL Assignments</h2>
      <p>Learn every assignment question with explanations, practise without seeing the answer, then pass a 90% mastery test per assignment.</p>
      ${bar(o.aSeenPct)}<p class="small">${o.aSeen}/${o.aTot} attempted (${pct(o.aSeenPct)}) &middot; ${o.aMast}/${o.aTot} mastered (${pct(o.aMastPct)})</p>
      <button class="btn primary lg" data-go="assign">Learn NPTEL Assignments</button></article>
    <article class="stage"><h2>2. Practise New Questions</h2>
      <p>New reworded, scenario-based and trap questions on the same concepts and on PPT topics the assignments barely touched. Adaptive practice targets your weak concepts.</p>
      <p class="small">${cs.newA.seen + cs.newB.seen}/${OB.NEW.length} seen &middot; accuracy ${pct(((cs.newA.c + cs.newB.c) / Math.max(1, cs.newA.a + cs.newB.a)) || null)}</p>
      <button class="btn primary lg" data-go="practice">Practise New Questions</button></article>
    <article class="stage"><h2>3. Take a Full Mock Exam</h2>
      <p>80 questions in four sections (20 + 20 + 20 + 20) with a configurable timer, section-wise scoring and a full report.</p>
      <p class="small">${mocks.length ? 'Recent: ' + mocks.map(m => OB.summarize(m).pct.toFixed(0) + '%').join(', ') : 'No mock exams taken yet.'}</p>
      <button class="btn primary lg" data-go="mock">Take a Full Mock Exam</button></article>
  </div>
  <div class="grid4">
    <div class="tile"><h3>Assignment progress</h3><b>${pct(o.aSeenPct)}</b><span>attempted</span>${bar(o.aSeenPct)}<b class="b2">${pct(o.aMastPct)}</b><span>mastered</span>${bar(o.aMastPct, 'ok')}</div>
    <div class="tile"><h3>Active wrong answers</h3><b>${o.active}</b><span>still to master</span><button class="btn sm primary" data-go="retry" ${o.active ? '' : 'disabled'}>Retry wrong answers</button></div>
    <div class="tile"><h3>Overall</h3><b>${pct(o.acc)}</b><span>accuracy over ${o.attempts} attempts</span><span class="small">${o.attempted} of ${o.total} attempted &middot; ${o.unanswered} unanswered &middot; ${Math.round(o.marks * 10) / 10} marks earned (${o.maxm} scored answers) &middot; ${o.bookmarks} bookmarked</span></div>
    <div class="tile"><h3>Weak topics</h3>${weakT.length ? '<ul class="plain">' + weakT.map(t => `<li>${esc(t.title)} <b>${pct(t.acc)}</b> <button class="linkbtn" data-act="topic-practice" data-t="${t.id}">practise</button></li>`).join('') + '</ul>' : '<span>Not enough data yet (needs 3+ attempts in a topic below 80%).</span>'}</div>
  </div>
  <div class="quick"><button class="btn" data-go="retry">Retry Wrong Answers</button><button class="btn" data-act="smart">Smart adaptive practice</button><button class="btn" data-act="difficult">Practise difficult questions</button><button class="btn" data-go="practice">Practise by topic</button><button class="btn" data-go="bookmarks">Bookmarked questions (${o.bookmarks})</button><button class="btn" data-go="progress">View progress</button><button class="btn" data-go="revision">Revision notes</button><button class="btn" data-go="settings">Export / import progress</button></div>
  <p class="small foot">Visitors: <b id="vis">${visitCount == null ? '-' : visitCount}</b> (one count per browser per day)<br>Practice scoring defaults: 1 mark per question, no negative marking, exact answer needed on multiple-answer questions (all changeable in Backup &amp; settings). These are practice defaults; they are not NPTEL's official marking scheme. Generated questions are practice material and are not guaranteed to appear in the real exam.</p>
  </section>`;
  flash = '';
}

}

/* ---------- practice (stage 2) ---------- */

  <div class="tiles3">${['asg', 'newA', 'newB'].map(k => `<div class="tile"><h3>${esc(OB.CATS[k])}</h3><b>${pct(cs[k].a ? cs[k].c / cs[k].a : null)}</b><span>${cs[k].seen}/${cs[k].qs} seen &middot; ${cs[k].mastered} mastered</span></div>`).join('')}</div>

   <fieldset><legend>Topics / chapters (none ticked = mix of all chapters)</legend><div class="cbgrid">${OB.DATA.topics.map(t => chkbox('topics', t.id, t.title, pf.topics.includes(t.id))).join('')}</div><button class="linkbtn" data-act="pf-all">Select all</button> <button class="linkbtn" data-act="pf-none">Clear</button></fieldset>

   <fieldset><legend>Question type</legend>${types.map(([k, l]) => chkbox('types', k, l, pf.types.includes(k))).join('')}<div class="selrow"><button class="linkbtn" data-act="pf-set" data-g="types" data-v="all">Select all</button> <button class="linkbtn" data-act="pf-set" data-g="types" data-v="none">Clear</button></div></fieldset>
   <fieldset><legend>Status</legend>${[['all', 'All'], ['unseen', 'Unseen only'], ['wrong', 'Previously incorrect (active)'], ['notmastered', 'Not yet mastered']].map(([k, l]) => `<label class="cb"><input type="radio" name="pfstatus" data-pf="status" value="${k}" ${pf.status === k ? 'checked' : ''}> ${l}</label>`).join('')}</fieldset>
   <label class="cb">Number of questions <input type="number" min="1" max="600" value="${pf.n}" data-pf="n" class="numin"> <button class="linkbtn" data-act="pf-allq">use all matching</button></label>

}

function setQs(t) { return t === 'all' ? OB.NEW : OB.NEW.filter(q => q.topic === t); }
// practice pool: questions you have NOT answered correctly yet (new or wrong); falls back to not-yet-mastered
function setPracticeIds(t) {
  let q = setQs(t).filter(x => { const s = OB.status(x.id); return s === 'new' || s === 'incorrect'; });
  if (!q.length) q = setQs(t).filter(x => OB.status(x.id) !== 'mastered');
  return OB.shuffle(q.map(x => x.id));
}

  const ss = OB.setStats();
  app.innerHTML = `<section><h1>Stage 2 - Practise New Questions</h1>

}

/* ---------- wrong answers ---------- */
function viewRetry() {
  const ids = OB.activeWrongIds(); const rows = ids.map(id => ({ q: Q[id], r: S().q[id], s: OB.status(id) })).sort((a, b) => b.r.wc - a.r.wc || b.r.lw - a.r.lw);
  const mastered = Object.keys(S().q).filter(id => Q[id] && S().q[id].ew && OB.status(id) === 'mastered');
  const inc = rows.filter(x => x.s === 'incorrect').length, imp = rows.filter(x => x.s === 'improving').length;
  const list = OB.retryList({ src: rf.src || undefined, topic: rf.topic || undefined, week: rf.week === '' ? undefined : +rf.week, recent: rf.scope === 'recent' });
  app.innerHTML = `<section><h1>Wrong-answer revision queue</h1>
  <p>Every question you get wrong stays here until you answer it correctly <b>once</b> on a retry. A wrong answer sends it back to the queue. Repeated misses are shown first, then recent ones, and older mistakes keep resurfacing.</p>
