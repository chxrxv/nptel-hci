<!doctype html>
<html lang="en">

<title>nptel hci</title>

<meta property="og:description" content="NPTEL Human-Computer Interfaces practice quiz">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mut:#5b6678;--line:#dde3ee;--pri:#2b4fd8;--pri-ink:#fff;--pri-soft:#e8edff;--ok:#157347;--ok-bg:#e3f5ea;--bad:#b42318;--bad-bg:#fdeceb;--warn:#8a5a00;--warn-bg:#fff4d6;--info-bg:#e6f0ff;--focus:#ff9f1a;--shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#181e2a;--ink:#e8ecf4;--mut:#9aa6bb;--line:#2a3345;--pri:#6f8bff;--pri-ink:#0b1020;--pri-soft:#222c4d;--ok:#4cc38a;--ok-bg:#12301f;--bad:#ff8a80;--bad-bg:#3a1a19;--warn:#f2c14e;--warn-bg:#3a2e10;--info-bg:#16284a;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:clamp(17px,.5vw + 12px,24px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1{font-size:1.6rem;margin:.2em 0 .5em;line-height:1.25}h2{font-size:1.2rem;margin:.2em 0 .5em}h3{font-size:1rem;margin:1em 0 .4em}h4{margin:.8em 0 .3em;font-size:.9rem;color:var(--mut)}
p{margin:.5em 0}code{background:var(--pri-soft);padding:1px 5px;border-radius:4px}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#hdr{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:min(1560px,96vw);margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;color:var(--ink);text-decoration:none;font-size:1.02rem}.brand span{color:var(--pri);font-weight:600}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.navb{background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--mut);cursor:pointer;font:inherit;font-size:.9rem}.navb:hover{background:var(--pri-soft);color:var(--ink)}.navb.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
main{max-width:min(1560px,96vw);margin:0 auto;padding:18px 16px 60px}
.card,.tile,.stage,.qcard,.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin:0 0 16px}
.narrow{max-width:760px;margin:20px auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;font:inherit;font-size:.93rem;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--pri)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}.btn.danger-soft{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.82rem}.btn.lg{padding:11px 20px;font-size:1rem}.btn.active{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;font:inherit;text-decoration:underline;padding:0 3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.row.end{justify-content:flex-end}.wrap{flex-wrap:wrap}.spacer{flex:1}
.small{font-size:.85rem;color:var(--mut)}.foot{margin-top:24px}
.banner{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid var(--line);font-size:.95rem}
.banner.info{background:var(--info-bg)}.banner.good{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.hero{margin:6px 0 16px}.hero p{color:var(--mut);max-width:780px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:6px}
.stage{display:flex;flex-direction:column;gap:6px;position:relative}.stage .btn{margin-top:auto;align-self:flex-start}
.stage.rec{border:2px solid var(--pri)}.badge{position:absolute;top:-11px;left:14px;background:var(--pri);color:var(--pri-ink);font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:99px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile h3{margin:0 0 4px;font-size:.85rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}.tile b{display:block;font-size:1.7rem;line-height:1.2}.tile b.b2{margin-top:6px}.tile span{display:block;font-size:.85rem;color:var(--mut)}
.plain{list-style:none;padding:0;margin:0}.plain li{padding:3px 0;font-size:.92rem}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pri)}.bar.ok i{background:var(--ok)}.bar.low i{background:var(--bad)}.bar.thin{height:6px;flex:1}
.tscroll{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:.92rem}.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{color:var(--mut);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.76rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.st-new{color:var(--mut)}.st-correct{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.st-incorrect{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.st-improving{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.st-mastered{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
.rs-good{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.rs-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.rs-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.rs-none{color:var(--mut)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:6px;margin-left:8px;background:var(--line);color:var(--ink)}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.pill{display:inline-block;font-size:.76rem;background:var(--pri-soft);color:var(--pri);padding:2px 10px;border-radius:99px;margin:0 6px 4px 0;font-weight:600}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill-multi{background:var(--warn-bg);color:var(--warn)}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:8px 14px}legend{font-weight:600;font-size:.88rem;padding:0 6px}
.cb{display:inline-flex;align-items:center;gap:6px;margin:3px 14px 3px 0;font-size:.93rem}.cbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.numin{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink);max-width:100%}
/* player */
.ptop{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.ptitle{font-weight:700;font-size:1.05rem}.psub{font-size:.85rem;color:var(--mut)}.pright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;background:var(--pri-soft);color:var(--pri);padding:5px 12px;border-radius:9px}.timer.low{background:var(--bad-bg);color:var(--bad)}
.progress{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.qtext{font-size:1.3rem;line-height:1.5;margin:.4em 0 .3em;font-weight:600}.hint{font-size:.85rem;color:var(--mut);margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit;color:var(--ink);cursor:pointer}
.opt:hover:not([data-locked]){border-color:var(--pri);background:var(--pri-soft)}.opt[data-locked]{cursor:default}
.opt .ltr{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mut)}.opt.chk .ltr{border-radius:6px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}.opt.sel .ltr{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .ltr{background:var(--bad);color:#fff;border-color:var(--bad)}
.otxt{flex:1}
.match{display:flex;flex-direction:column;gap:10px}.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.ml{font-weight:600}
.txt{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}textarea.txt{resize:vertical}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.explain{margin-top:16px;border-top:2px dashed var(--line);padding-top:12px;background:linear-gradient(var(--card),var(--card))}.explain .meta{margin-bottom:6px}.memo{background:var(--info-bg);padding:7px 11px;border-radius:8px}.note{font-size:.88rem;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:8px}.src{font-size:.82rem;color:var(--mut)}
.expect{background:var(--info-bg);padding:8px 12px;border-radius:8px}.why{background:var(--bad-bg);padding:8px 12px;border-radius:8px}
.rubric{margin-top:12px}.rub{list-style:none;padding:0}.rub li{padding:3px 0}
.side h3{margin-top:0}.side .pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin-bottom:6px}
.pb{display:inline-block;min-width:36px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer;text-align:center;padding:0}
.pb.ans{background:var(--pri-soft);border-color:var(--pri)}.pb.good{background:var(--ok-bg);border-color:var(--ok)}.pb.badd{background:var(--bad-bg);border-color:var(--bad)}.pb.mk{box-shadow:inset 0 -4px 0 var(--focus)}.pb.cur{outline:3px solid var(--pri);outline-offset:1px}
.legend{font-size:.8rem;color:var(--mut)}.legend .pb{min-width:14px;height:14px;vertical-align:middle;cursor:default;border-radius:4px}
/* results */
.scoreboard{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:10px 0}.big span{font-size:2.6rem;font-weight:800}.big small{font-size:1.2rem;color:var(--mut)}.big em{display:block;font-style:normal;font-size:1.3rem;color:var(--pri);font-weight:700}
.stats{display:flex;gap:22px;flex-wrap:wrap}.stats div{text-align:center;font-size:.85rem;color:var(--mut)}.stats b{display:block;font-size:1.6rem;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:.86rem}.tab.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
details.qrow{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}details.qrow>summary{cursor:pointer;padding:9px 12px;display:flex;gap:10px;align-items:center;list-style:none}.qrow .no{font-weight:700;min-width:28px}.qrow .qs{flex:1;font-size:.93rem}.qbody{padding:4px 16px 14px}.qfull{font-weight:600}
details.qrow.st-w{border-left:5px solid var(--bad)}details.qrow.st-c{border-left:5px solid var(--ok)}details.qrow.st-u{border-left:5px solid var(--line)}details.qrow.st-r,details.qrow.st-p{border-left:5px solid var(--warn)}
details.card>summary{cursor:pointer;list-style:none}.inl{display:inline;font-size:1.1rem}dl dt{font-weight:700;margin-top:6px}dl dd{margin:0 0 4px 14px}
.spark{width:100%;max-width:560px;height:110px}.spark .sb{fill:var(--pri)}.spark text{fill:var(--mut)}
.dlg{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:18px 22px;max-width:480px}.dlg::backdrop{background:rgba(10,14,24,.55)}
.danger-zone{border-color:var(--bad)}
.rv{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
@media (max-width:900px){.stages,.grid4,.tiles3{grid-template-columns:1fr}.pgrid{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}nav{margin-left:0}.qtext{font-size:1.08rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.burger{background:none;border:1px solid var(--line);color:var(--ink);font-size:1.4rem;line-height:1;padding:4px 12px;border-radius:9px;cursor:pointer}
.hwrap{padding:6px 16px}
#hdr nav{position:absolute;left:12px;top:100%;margin:4px 0 0;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:20}
#hdr nav .navb{text-align:left;padding:10px 14px}
#hdr{position:sticky}

.qimg{max-width:min(100%,380px);background:#fff;border-radius:8px;display:block;margin:6px 0}figure{margin:8px 0}

</style>

<script>
const DATA={"topics":[{"id":"intro","title":"Interactive Systems & Usability","week":"Week 1"},{"id":"reqs","title":"Usability Requirements","week":"Week 2"},{"id":"design","title":"Interface & Code Design Guidelines","week":"Week 3"},{"id":"norman","title":"Norman's Model & Prototyping","week":"Week 4"},{"id":"eval","title":"Rapid Usability Evaluation","week":"Week 5"},{"id":"sysdesign","title":"System Design (Cohesion, DFD, ER)","week":"Week 6"},{"id":"ood","title":"Object-Oriented Design & UML","week":"Week 7"},{"id":"coding","title":"Coding & Review-Based Testing","week":"Week 8"},{"id":"blackbox","title":"Black-Box Testing","week":"Week 9"},{"id":"whitebox","title":"White-Box & System Testing","week":"Week 10"},{"id":"empirical","title":"Empirical Usability Evaluation","week":"Week 10-11"},{"id":"stats","title":"Significance Tests","week":"Week 12"},{"id":"project","title":"Project Management & Agile","week":"Week 12"}],"weeks":[{"id":0,"label":"Week 0","title":"Prerequisite (Assignment 0)"},{"id":1,"label":"Week 1","title":"Introduction"},{"id":2,"label":"Week 2","title":"Usability Requirements"},{"id":3,"label":"Week 3","title":"Usability Requirements & Usable Interface Design"},{"id":4,"label":"Week 4","title":"Usable Interface Design"},{"id":5,"label":"Week 5","title":"Rapid Usability Evaluation"},{"id":6,"label":"Week 6","title":"Converting Design to System I"},{"id":7,"label":"Week 7","title":"Converting Design to System II"},{"id":8,"label":"Week 8","title":"System Implementation I"},{"id":9,"label":"Week 9","title":"System Implementation II"},{"id":10,"label":"Week 10","title":"System Implementation III"},{"id":11,"label":"Week 11","title":"Empirical Usability Evaluation"},{"id":12,"label":"Week 12","title":"Conclusion"}],"assign":[{"id":"W1G-1","week":1,"kind":"G","n":1,"q":"While we talk about the evaluation phases of the computer, ______ is called the modern age of computers.","opts":["1985 onwards","1998 onwards","2007 onwards","2011 onwards"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"history","diff":"E","exp":"The course describes the modern age of computing as 2011 onwards - the era of interconnected devices (ubiquitous computing, IoT, cyber-physical systems). 1985 falls in the early phase; the pre-modern phase is late 1990s to the first decade of the 2000s.","tip":"Modern = 2011 onwards.","flag":""},{"id":"W1G-2","week":1,"kind":"G","n":2,"q":"Which among the following is NOT a generic category of users?","opts":["Novice","Super knowledgeable","Intermittent","Expert"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"user-categories","diff":"E","exp":"The generic categories of users are novice, intermittent and expert. 'Super knowledgeable' is not a category.","tip":"Novice - Intermittent - Expert.","flag":""},{"id":"W1G-3","week":1,"kind":"G","n":3,"q":"In the Spiral Model, why is the second quadrant crucial for interactive software development?","opts":["It defines the UI layout","It finalizes the system architecture","It identifies and mitigates usability risks via prototyping","It handles testing and deployment"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"spiral-model","diff":"M","exp":"In the spiral model the second quadrant is risk assessment and mitigation; for interactive software, usability risks (e.g. a wrongly understood requirement) are mitigated by building a prototype. The UI layout, architecture and testing belong to other activities.","tip":"2nd quadrant = risks + prototype.","flag":""},{"id":"W1G-4","week":1,"kind":"G","n":4,"q":"What does the term 'utility' refer to in the context of usability?","opts":["Speed of task completion","Visual appeal of the design","Functional support for user needs","Frequency of feature updates"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"usability-def","diff":"E","exp":"Utility is the functionality the design is meant to serve: the extent to which it supports users' functional needs (features). Speed is efficiency; visual appeal and update frequency are not what utility means.","tip":"Utility = functional support.","flag":""},{"id":"W1G-5","week":1,"kind":"G","n":5,"q":"Which one of the following is NOT a computer?","opts":["Desktop","Digital Pedometer","Smartphone","None of the above"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"computer-def","diff":"M","exp":"By the Oxford definition anything that receives data, follows stored instructions and produces a result is a computer - desktops, smartphones and even a digital pedometer qualify. So none of the listed devices is a non-computer.","tip":"Pedometer is a computer too.","flag":""},{"id":"W1G-6","week":1,"kind":"G","n":6,"q":"Interactive software development is _______ in nature.","opts":["sporadic","iterative","variable","discrete"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"iterative-dev","diff":"E","exp":"Interactive software development is iterative: design-prototype-evaluate cycles repeat with user feedback until usability is acceptable.","tip":"Interactive = iterative.","flag":""},{"id":"W1G-7","week":1,"kind":"G","n":7,"q":"Which of the following is NOT one of the five quality components of usability proposed by Jacob Nielsen?","opts":["Learnability","Efficiency","Satisfaction","Memorization"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"nielsen-components","diff":"E","exp":"Nielsen's five usability components are learnability, efficiency, memorability, errors and satisfaction. 'Memorization' is not one of them (memorability is). Note: you answered this wrongly on the portal - watch the spelling trap.","tip":"Memorability, not memorization.","flag":"You answered this incorrectly on the portal; official key retained."},{"id":"W1G-8","week":1,"kind":"G","n":8,"q":"Which of the following is NOT a characteristic of the Waterfall model?","opts":["Feasibility study","Learnability study","System integration and testing","Maintenance"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"waterfall","diff":"M","exp":"The classical waterfall model has feasibility study, requirement gathering and specification, system design, coding and unit testing, integration and system testing, deployment and maintenance. A 'learnability study' is not a stage.","tip":"Waterfall: 7 stages, no learnability study.","flag":""},{"id":"W1G-9","week":1,"kind":"G","n":9,"q":"‘Identify objectives’ and ‘customer evaluation and planning’ is in the ______ and ______ quadrant of the spiral model respectively.","opts":["First, Fourth","Second, Third","Third, Fourth","Fourth, Second"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"spiral-model","diff":"M","exp":"Spiral quadrants: 1st identify objectives and risks; 2nd risk assessment and mitigation; 3rd development; 4th evaluation (with the customer) and planning of the next iteration. So 'identify objectives' = first and 'customer evaluation and planning' = fourth.","tip":"Quadrants: Objectives - Risks - Develop - Evaluate.","flag":""},{"id":"W1G-10","week":1,"kind":"G","n":10,"q":"Which design approach focuses on what a programmer finds interesting to build?","opts":["System-Centered Design","User-Centered Design","Utility-Based Design","Participatory Design"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"intro","concept":"scd-ucd","diff":"E","exp":"System-centred design asks what the programmer can easily build, what tools offer and what the programmer finds interesting. User-centred design is based on user abilities, context and goals.","tip":"SCD = programmer's convenience.","flag":""},{"id":"W2G-1","week":2,"kind":"G","n":1,"q":"Contextual inquiry is also known as _______.","opts":["Interview","Observation","Semi-structured interview"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"E","exp":"Contextual inquiry is often described as a semi-structured interview process: it combines interview and observation of users in their natural work setting.","tip":"CI = semi-structured interview.","flag":""},{"id":"W2G-2","week":2,"kind":"G","n":2,"q":"In SRS, functions are not represented as","opts":["Function name","Input","Output","Description","Motivation"],"keys":[4],"key":4,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"srs","diff":"M","exp":"In an SRS each function is represented by a name, input, output and an optional description. 'Motivation' is not part of the notation.","tip":"SRS function = name, input, output, description.","flag":""},{"id":"W2G-3","week":2,"kind":"G","n":3,"q":"Contextual inquiry can be done in _______ and passive mode.","opts":["active","semi-active","neutral"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"E","exp":"Contextual inquiry can be done in active mode (observer physically present) or passive mode (user activity recorded or videotaped and reviewed later).","tip":"CI modes: active / passive.","flag":""},{"id":"W2G-4","week":2,"kind":"G","n":4,"q":"There are _______ stages in contextual inquiry.","opts":["two","five","six","eight"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"E","exp":"Contextual inquiry has five stages: plan, initiate, execute, close and reflect.","tip":"CI = 5 stages.","flag":""},{"id":"W2G-5","week":2,"kind":"G","n":5,"q":"Which stage in the Contextual Inquiry process involves arranging for recording observations and scripting the procedure?","opts":["Plan Stage","Initiate Stage","Execute Stage","Reflect Stage"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"E","exp":"The Plan stage includes identifying goals, gathering domain knowledge, arranging for recording observations, identifying users, date, time and place, and scripting and rehearsing the procedure.","tip":"Plan = prepare and script.","flag":""},{"id":"W2G-6","week":2,"kind":"G","n":6,"q":"Affinity diagram method consists of _______ steps.","opts":["Three","Two","Six","Five"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"affinity-diagram","diff":"E","exp":"The affinity diagram method has five steps: generate ideas, display ideas, sort ideas into groups, create group headers, draw the finished diagram.","tip":"Affinity = 5 steps.","flag":""},{"id":"W2G-7","week":2,"kind":"G","n":7,"q":"Usability requirements is one type of ______.","opts":["Functional Requirement","Non-functional requirement"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"nfr","diff":"E","exp":"Usability is a non-functional requirement: a quality attribute that cannot be expressed as a function.","tip":"Usability = non-functional.","flag":""},{"id":"W2G-8","week":2,"kind":"G","n":8,"q":"What is the primary objective of Contextual Inquiry?","opts":["To watch and observe users perform tasks in their natural work setting","To conduct semi-structured interviews with users","To develop design recommendations","To study user behavior using physical note-taking"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"E","exp":"The primary objective of CI is to watch and observe users perform tasks in their natural work setting (the work context).","tip":"CI = observe in context.","flag":""},{"id":"W2G-9","week":2,"kind":"G","n":9,"q":"What is the purpose of the \"Reflect\" stage in the Contextual Inquiry process?","opts":["To contact the authorities for permission","To analyze the data collected and identify design goals","To script the procedure and rehearse for observations"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"E","exp":"The Reflect stage analyses the collected data to identify design goals, often with the help of tools like the affinity diagram method.","tip":"Reflect = analyse data.","flag":""},{"id":"W2G-10","week":2,"kind":"G","n":10,"q":"How long does the Contextual Inquiry process typically continue?","opts":["One to two weeks","One to two hours","One to two months"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"E","exp":"A contextual inquiry session usually continues for one to two hours.","tip":"CI lasts 1-2 hours.","flag":""},{"id":"W3G-1","week":3,"kind":"G","n":1,"q":"In SRS document the functions should describe HOW to get the output from the given input.","opts":["True","False"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"tf","topic":"design","concept":"srs-how","diff":"E","exp":"False. SRS functions are black boxes that say WHAT is needed (input, output, purpose), not HOW the output is obtained from the input.","tip":"SRS = what, not how.","flag":""},{"id":"W3G-2","week":3,"kind":"G","n":2,"q":"We can also add new functional requirements based on the observations made in contextual inquiry.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"design","concept":"fr-from-ci","diff":"E","exp":"True. The affinity diagram from contextual inquiry can be used to frame guidelines and to add new functional requirements (e.g. day-wise timetable, deadline and meeting views).","tip":"CI can add new FRs.","flag":""},{"id":"W3G-3","week":3,"kind":"G","n":3,"q":"In user-centered design, we have two concerns: Interface design and __________","opts":["Machine design","Hardware design","Code design","System design"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"design","concept":"ucd-concerns","diff":"E","exp":"In user-centred design there are two design concerns: interface design and code design.","tip":"Interface + Code design.","flag":""},{"id":"W3G-4","week":3,"kind":"G","n":4,"q":"The design-prototype-evaluate cycle primarily caters to ______ design.","opts":["Interface","Code","System"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"design","concept":"design-prototype-eval","diff":"E","exp":"The design-prototype-evaluate cycle primarily serves interface design; code design starts once the interface design has stabilised.","tip":"Cycle = interface design.","flag":""},{"id":"W3G-5","week":3,"kind":"G","n":5,"q":"Code design can be expressed in natural languages, semi-formal languages and _________.","opts":["Informal languages","Formal languages","Context sensitive languages"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"design","concept":"code-design-lang","diff":"E","exp":"Code design can be expressed in natural languages, semi-formal languages and formal languages.","tip":"Natural - semi-formal - formal.","flag":""},{"id":"W3G-6","week":3,"kind":"G","n":6,"q":"DFD is a _______ code design language.","opts":["Natural","Semi-formal","Informal","Context sensitive"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"design","concept":"code-design-lang","diff":"E","exp":"DFD (and UML) are semi-formal, graphical code design languages.","tip":"DFD = semi-formal.","flag":""},{"id":"W3G-7","week":3,"kind":"G","n":7,"q":"Shneiderman proposed ____ rules that covers broad aspects of interactive systems.","opts":["Five","Seven","Eight","Nine"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"design","concept":"golden-rules","diff":"E","exp":"Shneiderman's (1986) set has eight golden rules.","tip":"Shneiderman = 8 rules.","flag":""},{"id":"W3G-8","week":3,"kind":"G","n":8,"q":"“The interface should not force users to remember too many things” – this statement falls under “_______”, one of the golden rules proposed by Shneiderman.","opts":["Strive for consistency","Permit easy reversal of actions","Reduce short-term memory load","Keep users in control"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"design","concept":"golden-rules","diff":"E","exp":"Reducing short-term memory load (the 7+-2 rule of Miller) means not forcing users to remember too many things.","tip":"Eight rule: reduce memory load.","flag":""},{"id":"W3G-9","week":3,"kind":"G","n":9,"q":"Human interface guidelines for the apple systems are the ________ design guidelines.","opts":["Generic","Specific"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"design","concept":"guidelines-types","diff":"E","exp":"Human interface guidelines for Apple systems are detailed and product-specific, hence specific guidelines. Shneiderman's rules and Norman's principles are generic.","tip":"Apple HIG = specific.","flag":""},{"id":"W3G-10","week":3,"kind":"G","n":10,"q":"Identification of data structures and algorithms for different modules is done on the ____________ phase of code design.","opts":["Preliminary (high-level design)","Detailed design"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"design","concept":"code-design","diff":"E","exp":"Code design has two phases: preliminary (high-level) design - modules, control relationships, interfaces - and detailed design - data structures and algorithms for modules.","tip":"Detailed design = data structures + algorithms.","flag":""},{"id":"W4G-1","week":4,"kind":"G","n":1,"q":"Norman’s Model of Interaction represents behavior of a user of interactive systems in terms of a series of _________.","opts":["actions","selection","manipulation"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"norman","concept":"norman-model","diff":"E","exp":"Norman's model represents user behaviour as a series of actions (seven actions grouped into execution and evaluation).","tip":"Norman = 7 actions.","flag":""},{"id":"W4G-2","week":4,"kind":"G","n":2,"q":"There are broadly two stages of interaction execution stage and ________ stage.","opts":["design","evaluation","interaction"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"norman","concept":"norman-model","diff":"E","exp":"The two broad stages of interaction are the execution stage and the evaluation stage.","tip":"Execution + Evaluation.","flag":""},{"id":"W4G-3","week":4,"kind":"G","n":3,"q":"Perceive system state comes under the _______ stage of interaction.","opts":["execution","design","evaluation","interaction"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"norman","concept":"norman-model","diff":"E","exp":"Perceiving the system state is the first action of the evaluation stage (then interpret, then evaluate against the goal).","tip":"Perceive = evaluation stage.","flag":""},{"id":"W4G-4","week":4,"kind":"G","n":4,"q":"Actions we specify to translate intentions may not be supported by the interface leading to gap (gulf) between the first three and the last actions in the execution stage- It is called _______.","opts":["The gulf of execution","The gulf of evaluation","The gulf of Interaction"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"norman","concept":"gulfs","diff":"M","exp":"When the actions we can specify do not match what the interface supports, the gap is the gulf of execution. The gulf of evaluation is when our interpretation of the interface state does not match the actual state.","tip":"Execution gulf = cannot do; evaluation gulf = cannot tell.","flag":""},{"id":"W4G-5","week":4,"kind":"G","n":5,"q":"Particularly in the context of errors during interaction is explained in terms of slips and ______.","opts":["error","mistakes","human error"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"norman","concept":"slips-mistakes","diff":"E","exp":"Errors during interaction are explained as slips (right goal, wrong action) and mistakes (wrong goal or wrong understanding).","tip":"Slips and mistakes.","flag":""},{"id":"W4G-6","week":4,"kind":"G","n":6,"q":"In a vertical prototype, the entire interface is depicted at the surface level without any functionality.","opts":["True","False"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"tf","topic":"norman","concept":"prototype-types","diff":"M","exp":"False. The description (entire interface at surface level without functionality) fits a HORIZONTAL prototype; a vertical prototype implements a few features in depth.","tip":"Horizontal = wide and shallow.","flag":""},{"id":"W4G-7","week":4,"kind":"G","n":7,"q":"Paper mock-ups are the example of __________ prototype.","opts":["Low fidelity","High fidelity","Medium fidelity"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"norman","concept":"fidelity","diff":"E","exp":"Paper mock-ups need no technology and are quick and cheap: low-fidelity prototypes.","tip":"Paper = low fidelity.","flag":""},{"id":"W4G-8","week":4,"kind":"G","n":8,"q":"There is a requirement of 3-5 member team for the cognitive walkthrough.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"norman","concept":"cognitive-walkthrough","diff":"E","exp":"True. Expert evaluations such as the cognitive walkthrough use a team of at least 3-5 members.","tip":"Team = 3-5.","flag":""},{"id":"W4G-9","week":4,"kind":"G","n":9,"q":"In a cognitive walkthrough evaluation, evaluators re expected to answer the questions only in “yes” or “no”","opts":["True","False"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"tf","topic":"norman","concept":"cognitive-walkthrough","diff":"M","exp":"False. Evaluators are not expected to answer only yes or no; they should give a detailed report on what they felt about each question.","tip":"Walkthrough = detailed answers.","flag":""},{"id":"W4G-10","week":4,"kind":"G","n":10,"q":"In this technique, a human subject believes to interact with an autonomous computer. But, In reality, however, the computer is operated by an “unseen” human being. This technique is called________ approach.","opts":["Medium fidelity","Vertical","Wizard of Oz","Incremental"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"norman","concept":"wizard-of-oz","diff":"E","exp":"In the Wizard of Oz technique a subject believes they interact with an autonomous computer while an unseen human (the wizard) operates it (e.g. IBM's 1984 listening typewriter).","tip":"Oz = hidden human.","flag":""},{"id":"W5G-1","week":5,"kind":"G","n":1,"q":"How do we evaluate an interface?","opts":["by evaluating satisfaction","by evaluating memorability","by evaluating usability"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"eval","concept":"eval-usability","diff":"E","exp":"An interface is evaluated by evaluating its usability.","tip":"Evaluate = usability.","flag":""},{"id":"W5G-2","week":5,"kind":"G","n":2,"q":"We need to frame a set of questions (usability issues) for the evaluators before performing a cognitive walkthrough","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"eval","concept":"cw-questions","diff":"M","exp":"True. Before a cognitive walkthrough a set of questions (usability issues) must be framed; evaluators report on them while performing the tasks.","tip":"Questions first.","flag":""},{"id":"W5G-3","week":5,"kind":"G","n":3,"q":"In a heuristic evaluation, the items in the checklist are called __________","opts":["checkbox","heuristics","usability issues","problems"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"E","exp":"In heuristic evaluation the checklist items are called heuristics (Nielsen's 10 heuristics are popular).","tip":"Checklist items = heuristics.","flag":""},{"id":"W5G-4","week":5,"kind":"G","n":4,"q":"There are many ways of collecting user feedback in evaluation with self report methods: ______________ , can ask them to choose from a list of system attributes ask direct and open-ended questions.","opts":["Utter the option","Rating on a scale"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"eval","concept":"self-report","diff":"M","exp":"Self-report data can be collected by rating on a scale (e.g. Likert), choosing from a list of attributes, or asking open-ended questions.","tip":"Rating scale (Likert).","flag":""},{"id":"W5G-5","week":5,"kind":"G","n":5,"q":"ASQ is a ___________________.","opts":["Post-task questionnaire","Post-session questionnaire"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"eval","concept":"asq","diff":"M","exp":"ASQ (After-Scenario Questionnaire) is a post-task questionnaire with three statements rated on a 7-point scale.","tip":"ASQ = post-task, 3 items.","flag":""},{"id":"W5G-6","week":5,"kind":"G","n":6,"q":"It is generally assumed that an SUS score around _______ percent or higher is desirable","opts":["10","20","50","70"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"eval","concept":"sus","diff":"E","exp":"An SUS score of around 70 percent or higher is generally considered desirable; lower scores may signal usability problems.","tip":"SUS target = 70.","flag":""},{"id":"W5G-7","week":5,"kind":"G","n":7,"q":"In expert evaluation, the evaluation team should have at least _________ members.","opts":["3-5","4-7","5-7","7-9"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"eval","concept":"expert-eval","diff":"E","exp":"Expert evaluation needs an evaluation team of at least 3-5 members.","tip":"Team 3-5.","flag":""},{"id":"W5G-8","week":5,"kind":"G","n":8,"q":"In heuristic evaluation, a system is evaluated with a checklist are called ____","opts":["Heuristics","Actions","Statement"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"E","exp":"A system evaluated with a checklist is a heuristic evaluation; the checklist items are heuristics.","tip":"Checklist = heuristics.","flag":""},{"id":"W5G-9","week":5,"kind":"G","n":9,"q":"What is the full form of SUS","opts":["Software usability score","Software usability scale","System usability score","System usability scale"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"eval","concept":"sus","diff":"E","exp":"SUS = System Usability Scale: ten statements (alternately positive and negative) rated on a 5-point scale.","tip":"SUS = System Usability Scale.","flag":""},{"id":"W5G-10","week":5,"kind":"G","n":10,"q":"Which are from the following are the valid prototype evaluation methods","opts":["Cognitive walkthrough","Affinity diagram","Heuristic evaluation"],"keys":[0,2],"key":0,"official":true,"keySrc":"official","type":"msq","topic":"eval","concept":"valid-methods","diff":"M","exp":"Cognitive walkthrough and heuristic evaluation are prototype (expert) evaluation methods. The affinity diagram is a requirements-analysis tool.","tip":"CW + HE evaluate; affinity analyses requirements.","flag":""},{"id":"W6G-1","week":6,"kind":"G","n":1,"q":"Which of the following is NOT a charact eristic of Good design","opts":["Coverage","Correctness","Understandability","Colorful"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"good-design","diff":"E","exp":"A good design has coverage, correctness, understandability, efficiency and maintainability. 'Colorful' is not a design characteristic.","tip":"Good design: coverage, correctness, understandability.","flag":""},{"id":"W6G-2","week":6,"kind":"G","n":2,"q":"If all functions perform similar operations it falls under ________ cohesion.","opts":["Logical","Temporal","Procedural","Sequential"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"cohesion","diff":"M","exp":"Logical cohesion: all functions perform similar operations (e.g. error handling). Temporal = same time span, procedural = same procedure.","tip":"Logical = similar operations.","flag":""},{"id":"W6G-3","week":6,"kind":"G","n":3,"q":"If two modules share code, it falls under __________ coupling.","opts":["Data","Control","Content"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"coupling","diff":"M","exp":"Content coupling: two modules share code (e.g. branch from one into another). Data coupling passes a data item; control coupling passes a control flag.","tip":"Content = share code.","flag":""},{"id":"W6G-4","week":6,"kind":"G","n":4,"q":"There are two basic design approaches: function oriented and _______ oriented.","opts":["Logic","Folder","Object","Class"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"design-approaches","diff":"E","exp":"Two basic design approaches: function-oriented (abstractions are functions, DFD) and object-oriented (abstractions are objects, UML).","tip":"Function-oriented vs object-oriented.","flag":""},{"id":"W6G-5","week":6,"kind":"G","n":5,"q":"Basic components of ER diagram are: Entity, _____ and Relationship","opts":["Object","User","Attribute","Class"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"er-diagram","diff":"E","exp":"ER diagram components: entity, attribute and relationship.","tip":"ER = Entity, Attribute, Relationship.","flag":""},{"id":"W6G-6","week":6,"kind":"G","n":6,"q":"Null attributes are used when:","opts":["An entity does not have a value for an attribute","A value needs to be derived from other attributes or entities"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"er-diagram","diff":"M","exp":"A null attribute is used when an entity has no value for an attribute. A derived attribute is computed from other attributes (e.g. age from date of birth).","tip":"Null = no value.","flag":""},{"id":"W6G-7","week":6,"kind":"G","n":7,"q":"There are four types of relationships in ER diagram: one-to-one, one-to-many, many-to-one and _______.","opts":["Many-to-binary","Many-to-many","Binary-to-many","Binary-to-one"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"er-diagram","diff":"E","exp":"The four relationship types are one-to-one, one-to-many, many-to-one and many-to-many.","tip":"1:1, 1:N, N:1, N:M.","flag":""},{"id":"W6G-8","week":6,"kind":"G","n":8,"q":"Which of the following is/are the type of cohesion?","opts":["Temporal","Functional","Content","All of the above"],"keys":[0,1],"key":0,"official":true,"keySrc":"official","type":"msq","topic":"sysdesign","concept":"cohesion","diff":"M","exp":"Cohesion types include logical, temporal, procedural/functional, communication and sequential. Content is a type of COUPLING, not cohesion, and the 'all of the above' option is therefore wrong. Official key: temporal and functional.","tip":"Content = coupling, not cohesion.","flag":"Official key retained as given by the course solution."},{"id":"W6G-9","week":6,"kind":"G","n":9,"q":"Which one from the following are related with between modules?","opts":["Cohesion","Coupling","Both"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"coupling","diff":"E","exp":"Coupling is related to the relationship BETWEEN modules; cohesion is about the functions within a module.","tip":"Coupling = between; cohesion = within.","flag":""},{"id":"W6G-10","week":6,"kind":"G","n":10,"q":"What is the full form of the DFD","opts":["Data flow design","Data flow decision","Data flow development","Data flow diagram"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"sysdesign","concept":"dfd","diff":"E","exp":"DFD = Data Flow Diagram: it represents the flow of data through a process or system.","tip":"DFD = Data Flow Diagram.","flag":""},{"id":"W7G-1","week":7,"kind":"G","n":1,"q":"In functional design approach we think of the system as provider of a set of “services” represented as ________.","opts":["Data","Functions","Objects"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"ood","concept":"functional-vs-oo","diff":"E","exp":"In the functional design approach the system is a provider of services represented as functions.","tip":"Functional = functions.","flag":""},{"id":"W7G-2","week":7,"kind":"G","n":2,"q":"In “Object Oriented Design approach”, we do not consider “services” offered by system.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"ood","concept":"functional-vs-oo","diff":"M","exp":"True. In object-oriented design we stop thinking in terms of services and think of a collection of objects and their behaviour.","tip":"OOD = objects, not services.","flag":""},{"id":"W7G-3","week":7,"kind":"G","n":3,"q":"A class contains attributes and ___________.","opts":["Data","Operations","Objects"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"ood","concept":"class-attr-ops","diff":"E","exp":"A class contains attributes (data part) and operations (also called methods or member functions).","tip":"Class = attributes + operations.","flag":""},{"id":"W7G-4","week":7,"kind":"G","n":4,"q":"Attribute indicates nature of data that an object can contain.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"ood","concept":"class-attr-ops","diff":"E","exp":"True. An attribute is the data part of a class; it indicates the nature of data an object can hold.","tip":"Attribute = data.","flag":""},{"id":"W7G-5","week":7,"kind":"G","n":5,"q":"Full form of OOA is:","opts":["object oriented assignment","object oriented assistance","object oriented analysis","object oriented attributes"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"ood","concept":"ooa","diff":"E","exp":"OOA = object oriented analysis (SRS with objects instead of functions).","tip":"OOA = analysis.","flag":""},{"id":"W7G-6","week":7,"kind":"G","n":6,"q":"________ effectively denotes the behavior of class.","opts":["Data","Operations","Objects","Attributes"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"ood","concept":"class-attr-ops","diff":"E","exp":"Operations are the action part of a class and effectively denote its behaviour.","tip":"Operations = behaviour.","flag":""},{"id":"W7G-7","week":7,"kind":"G","n":7,"q":"UML is a language to represent","opts":["OOP","OOA","OOD"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"ood","concept":"uml","diff":"E","exp":"UML is a language to represent object-oriented DESIGN (OOD), not programming (OOP) or analysis.","tip":"UML represents OOD.","flag":""},{"id":"W7G-8","week":7,"kind":"G","n":8,"q":"UML is a design methodology","opts":["True","False"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"tf","topic":"ood","concept":"uml","diff":"M","exp":"False. UML is not a design methodology; it is only a language to express OOD obtained using some methodology.","tip":"UML = language, not method.","flag":""},{"id":"W7G-9","week":7,"kind":"G","n":9,"q":"Implementation view can be captured using ________.","opts":["Deployment diagram","Component diagram","Class diagram","Use case diagram"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"ood","concept":"uml-views","diff":"M","exp":"UML's five views: user (use case), behavioural (sequence, collaboration, state chart, activity), structural (class, object), implementation (component), environment (deployment). Implementation view = component diagram.","tip":"Implementation view = component diagram.","flag":""},{"id":"W7G-10","week":7,"kind":"G","n":10,"q":"________ objects normally hold information (e.g. book, book registers etc).","opts":["Boundary","Controller","Entity"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"ood","concept":"domain-objects","diff":"M","exp":"Domain objects: boundary (actors interact), controller (coordinate), entity (hold information, e.g. book, book register).","tip":"Entity objects hold information.","flag":""},{"id":"W8G-1","week":8,"kind":"G","n":1,"q":"Following standard coding guidelines helps to improve ______.","opts":["Readability only","Understandability only","Teamwork only","Readability, understandability, and teamwork"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"coding","concept":"coding-standards","diff":"E","exp":"Following coding standards improves readability, understandability and teamwork, not just one of them.","tip":"Standards help all three.","flag":""},{"id":"W8G-2","week":8,"kind":"G","n":2,"q":"A function should have no longer than _____ lines of code.","opts":["5","16","10","8"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"coding","concept":"coding-standards","diff":"E","exp":"A function should not exceed about 10 lines of code; longer functions are harder to understand and tend to have more bugs.","tip":"Function <= 10 lines.","flag":""},{"id":"W8G-3","week":8,"kind":"G","n":3,"q":"What are some things to avoid when writing code? (Choose all that apply)","opts":["Using lengthy functions","Using the same identifier for multiple purposes","Using ‘goto’ (branching) statements indiscriminately","Using proper indentation"],"keys":[0,1,2],"key":0,"official":true,"keySrc":"official","type":"msq","topic":"coding","concept":"coding-avoid","diff":"M","exp":"Avoid lengthy functions, using one identifier for several purposes, and indiscriminate goto statements. Proper indentation is good practice, not something to avoid.","tip":"Avoid long functions, reused identifiers, goto.","flag":""},{"id":"W8G-4","week":8,"kind":"G","n":4,"q":"Two broad categories of code testing methods are review-based method and __________ method.","opts":["Manual testing","Execution-based"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"coding","concept":"testing-categories","diff":"E","exp":"Code testing has two broad categories: review-based and execution-based.","tip":"Review-based + Execution-based.","flag":""},{"id":"W8G-5","week":8,"kind":"G","n":5,"q":"What are the two common methods for review-based testing? (Choose all that apply)","opts":["Code inspection","Code walkthrough","Unit testing"],"keys":[0,1],"key":0,"official":true,"keySrc":"official","type":"msq","topic":"coding","concept":"review-testing","diff":"E","exp":"The two review-based methods are code inspection and code walkthrough; unit testing is execution-based.","tip":"Inspection + Walkthrough.","flag":""},{"id":"W8G-6","week":8,"kind":"G","n":6,"q":"White-box testing refers to designing test cases using knowledge of internal structure of the software.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"coding","concept":"whitebox-def","diff":"E","exp":"True. White-box (structural) testing designs test cases using knowledge of the internal structure of the software.","tip":"White box = internal structure.","flag":""},{"id":"W8G-7","week":8,"kind":"G","n":7,"q":"How many members should be present in a code walkthrough team?","opts":["2–3 members","3–5 members","5–7 members","7–10 members"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"coding","concept":"walkthrough","diff":"E","exp":"A code walkthrough team should be neither too big nor too small: ideally 3-5 members.","tip":"Walkthrough team = 3-5.","flag":""},{"id":"W8G-8","week":8,"kind":"G","n":8,"q":"Which of the following code testing method requires simulation of code execution by hand?","opts":["Code walkthrough","Code inspection","Black box testing","White box testing"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"coding","concept":"walkthrough","diff":"M","exp":"In a code walkthrough members select test cases and simulate execution by hand to find logical errors. Inspection checks code against a list of common errors and standards.","tip":"Walkthrough = hand execution.","flag":""},{"id":"W8G-9","week":8,"kind":"G","n":9,"q":"Uninitialized variable is one of the common errors in programming that can be identified through code inspection.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"coding","concept":"inspection","diff":"E","exp":"True. Common inspection findings include uninitialised variables, jumps into loops, non-terminating loops and incompatible assignments.","tip":"Inspection finds uninitialised variables.","flag":""},{"id":"W8G-10","week":8,"kind":"G","n":10,"q":"Which of the following is not required to perform black box testing?","opts":["Equivalence class partitioning","Boundary value analysis","Test suite creation","Knowledge of the internal structure of the code"],"keys":[3],"key":3,"official":true,"keySrc":"official","type":"mcq","topic":"coding","concept":"blackbox-req","diff":"M","exp":"Black-box testing needs only inputs and outputs (equivalence classes, boundary values, a test suite), not knowledge of the internal structure of the code.","tip":"Black box = no code knowledge.","flag":""},{"id":"W9G-1","week":9,"kind":"G","n":1,"q":"Set of all test cases with which a given software is to be tested is known as ________.","opts":["Testcase","Test suite"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"blackbox","concept":"test-suite","diff":"E","exp":"The set of all test cases with which software is tested is the test suite.","tip":"Test suite = all test cases.","flag":""},{"id":"W9G-2","week":9,"kind":"G","n":2,"q":"Randomly selected test cases do not necessarily contribute to significance of test suite.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"blackbox","concept":"test-suite","diff":"M","exp":"True. Randomly chosen test cases do not necessarily make a significant suite; they may not detect any additional defect.","tip":"Random != significant.","flag":""},{"id":"W9G-3","week":9,"kind":"G","n":3,"q":"In black box testing the two main approaches to design test vases are: Equivalence class partitioning and _______________.","opts":["Structural analysis","Boundary value analysis","Equivalence class analysis","System analysis"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"blackbox","concept":"bbt-approaches","diff":"E","exp":"Black-box test design uses equivalence class partitioning and boundary value analysis.","tip":"ECP + BVA.","flag":""},{"id":"W9G-4","week":9,"kind":"G","n":4,"q":"Testing code with any _____ value(s) of an equivalence class is as good as testing with ALL input values belonging to that class.","opts":["One","Two","Five","Four"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"blackbox","concept":"equivalence-class","diff":"E","exp":"Testing with any ONE value of an equivalence class is as good as testing with all values of that class.","tip":"One value per class.","flag":""},{"id":"W9G-5","week":9,"kind":"G","n":5,"q":"In black box testing, domain of input values partitioned into sets, each sets are called _________.","opts":["Partition class","Equivalence class","Program class"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"blackbox","concept":"equivalence-class","diff":"E","exp":"The input domain is partitioned into sets called equivalence classes; the program behaves similarly for all members.","tip":"Classes = equivalence classes.","flag":""},{"id":"W9G-6","week":9,"kind":"G","n":6,"q":"Which is/are from the following are valid review based testing","opts":["Code walkthrough","Code inspection","Code analysis","Code assessment"],"keys":[0,1],"key":0,"official":true,"keySrc":"official","type":"msq","topic":"blackbox","concept":"review-methods","diff":"E","exp":"Review-based testing = code walkthrough and code inspection.","tip":"Walkthrough + Inspection.","flag":""},{"id":"W9G-7","week":9,"kind":"G","n":7,"q":"Set of all test cases with which a given software is to be tested is called test _____","opts":["Question","Questionnaire","Suite"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"blackbox","concept":"test-suite","diff":"E","exp":"The set of all test cases is a test suite.","tip":"Suite.","flag":""},{"id":"W9G-8","week":9,"kind":"G","n":8,"q":"In Black-box testing, the test cases are based on","opts":["input","knowledge of design","output","knowledge of code"],"keys":[0,2],"key":0,"official":true,"keySrc":"official","type":"msq","topic":"blackbox","concept":"bbt-approaches","diff":"M","exp":"Black-box test cases are based on inputs and outputs only - not on knowledge of design or code.","tip":"Input and output.","flag":""},{"id":"W9G-9","week":9,"kind":"G","n":9,"q":"Domain of input values partitioned into set is called equivalence class","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"blackbox","concept":"equivalence-class","diff":"E","exp":"True. A partition of the input domain into sets is called equivalence classes.","tip":"Partition = equivalence class.","flag":""},{"id":"W9G-10","week":9,"kind":"G","n":10,"q":"Functional testing is related to","opts":["Black-box testing","White-box testing"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"blackbox","concept":"functional-testing","diff":"E","exp":"Functional testing designs cases from the functional specification without internal knowledge, i.e. black-box testing.","tip":"Functional = black box.","flag":""},{"id":"W10G-1","week":10,"kind":"G","n":1,"q":"To do a white-box testing, knowledge of internal structure is required.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"whitebox","concept":"wbt-def","diff":"E","exp":"True. White-box testing tests the internal structure of the code and so needs knowledge of it.","tip":"White box needs internal knowledge.","flag":""},{"id":"W10G-2","week":10,"kind":"G","n":2,"q":"To understand white-box testing strategies, program (flow) visualization helps. To visualize the program we can take help of ________.","opts":["CFG","DFD","ERD","Class diagram"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"whitebox","concept":"cfg","diff":"E","exp":"Program flow is visualised with a Control Flow Graph (CFG). DFD is for data flow design, ERD for data stores, class diagram for OOD.","tip":"CFG visualises flow.","flag":""},{"id":"W10G-3","week":10,"kind":"G","n":3,"q":"To construct a CFG we assign numbers to all statements of the program, create a node in the CFG for each numbered statement and_____________.","opts":["Complement the CFG","Add edges","Sort the nodes"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"whitebox","concept":"cfg","diff":"M","exp":"To build a CFG number the statements, create a node per statement and add an edge from one node to another when control can transfer from the first to the second.","tip":"Nodes then edges.","flag":""},{"id":"W10G-4","week":10,"kind":"G","n":4,"q":"Branch coverage guarantees statement coverage.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"whitebox","concept":"branch-coverage","diff":"M","exp":"True. Branch coverage (edge testing) covers both true and false outcomes of every condition and therefore guarantees statement coverage.","tip":"Branch implies statement coverage.","flag":""},{"id":"W10G-5","week":10,"kind":"G","n":5,"q":"In path coverage, test cases should ensure all __________ in the code executed at least once","opts":["Linearly independent paths","Linearly dependent paths"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"whitebox","concept":"path-coverage","diff":"M","exp":"Path coverage requires test cases that execute every linearly independent path at least once.","tip":"Linearly independent paths.","flag":""},{"id":"W10G-6","week":10,"kind":"G","n":6,"q":"To compute cyclomatic complexity, we can use ___________, where E=number of edges, N=number of nodes","opts":["E-N+2","E-N+1","E+N-2","E+N-1"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"whitebox","concept":"cyclomatic","diff":"M","exp":"Cyclomatic complexity = E - N + 2 (or D + 1 where D is the number of decision statements).","tip":"CC = E - N + 2.","flag":""},{"id":"W10G-7","week":10,"kind":"G","n":7,"q":"Three main stages of system testing is alpha testing, beta testing and _________.","opts":["Gama testing","Sigma testing","Acceptance testing","Omega testing"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"whitebox","concept":"system-testing","diff":"E","exp":"System testing has three stages: alpha (in-house test team), beta (friendly customers) and acceptance testing (by the customer).","tip":"Alpha - Beta - Acceptance.","flag":""},{"id":"W10G-8","week":10,"kind":"G","n":8,"q":"Volume testing tests system performance for ______ input","opts":["Small","Large"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"whitebox","concept":"perf-testing","diff":"E","exp":"Volume testing checks system performance for large input; stress testing uses abnormal or illegal input.","tip":"Volume = large input.","flag":""},{"id":"W10G-9","week":10,"kind":"G","n":9,"q":"There are _____ stages of empirical research.","opts":["Three","Four","Five","Six"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"research-stages","diff":"E","exp":"Empirical research has four stages: research question, variables, experiment design, data analysis.","tip":"Four stages.","flag":""},{"id":"W10G-10","week":10,"kind":"G","n":10,"q":"Data we get from observation is ________ data","opts":["Reflective","Empirical","Authoritative","Experiential"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"empirical-research","diff":"E","exp":"Data obtained from observation is empirical data.","tip":"Observation = empirical.","flag":""},{"id":"W11G-1","week":11,"kind":"G","n":1,"q":"When we perform a controlled experiment to collect and analyze data on user behavior, the entire process is known as _______.","opts":["programmable research","hypothetical research","empirical research","theoretical research"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"empirical-research","diff":"E","exp":"A controlled experiment collecting and analysing data on user behaviour is empirical research.","tip":"Controlled experiment = empirical research.","flag":""},{"id":"W11G-2","week":11,"kind":"G","n":2,"q":"There are broadly _____ stages of empirical research?","opts":["Two","three","four","five"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"research-stages","diff":"E","exp":"There are four stages of empirical research.","tip":"Four.","flag":""},{"id":"W11G-3","week":11,"kind":"G","n":3,"q":"Suppose we formed two research questions: RQ1: Is the new technique good? RQ2: Is our text input interface better than the text input interface provided by, say, MS Word? RQ3: Does the new interface let me enter text “faster” than MS Word? We call RQ3 ______ and RQ1 as _______.","opts":["testable, non-testable","alternative hypothesis, null hypothesis"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"rq-testable","diff":"M","exp":"RQ3 (does the new interface let me enter text faster than MS Word) is testable because it is specific and measurable; RQ1 (is the new technique good) is vague and non-testable. Official key: testable, non-testable.","tip":"Specific = testable.","flag":""},{"id":"W11G-4","week":11,"kind":"G","n":4,"q":"When we form a hypothesis, essentially stating that the test condition is not going to affect the outcome (judgment). This hypothesis is called _______.","opts":["null hypothesis","alternative hypothesis"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"hypothesis","diff":"E","exp":"A hypothesis stating that the test condition will not affect the outcome is the null hypothesis; the alternative states that it does.","tip":"Null = no effect.","flag":""},{"id":"W11G-5","week":11,"kind":"G","n":5,"q":"In _______, we assign some (arbitrary) codes to attributes of observational data.","opts":["nominal","ordinal","interval","ratio"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"scales","diff":"M","exp":"Nominal scale assigns arbitrary codes (e.g. 1 = male, 2 = female) to attributes; also called categorical data.","tip":"Nominal = arbitrary codes.","flag":""},{"id":"W11G-6","week":11,"kind":"G","n":6,"q":"Recording data from a thermometer is an example of interval scaled data.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"empirical","concept":"scales","diff":"M","exp":"True. A thermometer records equally spaced values, so it is interval scaled data (ratio scales use ratios, e.g. characters per minute).","tip":"Thermometer = interval.","flag":""},{"id":"W11G-7","week":11,"kind":"G","n":7,"q":"_______ are variables that influence both the independent and dependent variables in a study, potentially leading to incorrect conclusions about the relationship between the two.","opts":["Dependant variables","Independent variables","Confounding variables","Control variables"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"variables","diff":"M","exp":"Confounding variables influence both the independent and dependent variables, possibly leading to wrong conclusions (e.g. the practice effect).","tip":"Confounders affect both.","flag":""},{"id":"W11G-8","week":11,"kind":"G","n":8,"q":"For any pilot study (or small-scale studies), 5 is probably a good number.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"empirical","concept":"participants","diff":"M","exp":"True. For pilot or small-scale studies five participants is probably a good number; conclusions are only indicative.","tip":"Pilot = 5.","flag":""},{"id":"W11G-9","week":11,"kind":"G","n":9,"q":"To draw reliable conclusions from empirical data, we should use between _____ and _____ participants.","opts":["1, 5","2, 5","12, 25","10, 12"],"keys":[2],"key":2,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"participants","diff":"M","exp":"For reliable conclusions use between 12 and 25 participants (the literature range is 5-25).","tip":"Reliable = 12-25.","flag":""},{"id":"W11G-10","week":11,"kind":"G","n":10,"q":"When we distribute the tasks to participants in the way explained above, we call the study as _______.","opts":["between-subject","within-subject","uni-subject","center-subject"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"empirical","concept":"study-design","diff":"M","exp":"When participants are divided into groups and each group performs tasks for only a subset of the test conditions, the study is between-subject. (The original question text is incomplete on the portal; the official key is shown.)","tip":"Subsets per group = between-subject.","flag":"The original question text is incomplete on the portal (\"in the way explained above\"); the official key is shown."},{"id":"W12G-1","week":12,"kind":"G","n":1,"q":"With the significance test, we try to _______ the null hypothesis.","opts":["Accept","Refute"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"stats","concept":"significance","diff":"E","exp":"With a significance test we try to refute (reject) the null hypothesis.","tip":"Refute null.","flag":""},{"id":"W12G-2","week":12,"kind":"G","n":2,"q":"Type I error is also known as _______.","opts":["False positive","False negative","True positive","True negative"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"stats","concept":"type-errors","diff":"M","exp":"Type I error (alpha error) is a false positive: rejecting a null hypothesis that is true. Type II error is a false negative.","tip":"Type I = false positive.","flag":""},{"id":"W12G-3","week":12,"kind":"G","n":3,"q":"t-statistic is the ONLY way to test for statistical significance","opts":["True","False"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"tf","topic":"stats","concept":"significance","diff":"E","exp":"False. The t-test is only one of many significance tests.","tip":"t is not the only test.","flag":""},{"id":"W12G-4","week":12,"kind":"G","n":4,"q":"There are broadly two categories of the techniques for significance test: _______ and _______.","opts":["Parametric and Non-parametric","t-test and non t-test"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"stats","concept":"parametric","diff":"M","exp":"Significance tests are of two categories: parametric (e.g. t-test) and non-parametric.","tip":"Parametric vs non-parametric.","flag":""},{"id":"W12G-5","week":12,"kind":"G","n":5,"q":"Project planning involves estimation of Project size, Cost, Duration and Effort.","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"project","concept":"project-planning","diff":"E","exp":"True. Project planning involves estimation of project size, cost, duration and effort.","tip":"Size, cost, duration, effort.","flag":""},{"id":"W12G-6","week":12,"kind":"G","n":6,"q":"COCOMO stands for _______.","opts":["Conducive Cost Estimation Model","Constructive Cost Estimation Model","Constructive Category Estimation Model","Conducive Category Estimation Model"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"project","concept":"cocomo","diff":"E","exp":"COCOMO = Constructive Cost Estimation Model, proposed by Boehm in 1981.","tip":"COCOMO = Constructive Cost Model.","flag":""},{"id":"W12G-7","week":12,"kind":"G","n":7,"q":"According to Boehm, software cost estimation should be done through _______ stages.","opts":["Two","Three","Four","Five"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"project","concept":"cocomo","diff":"M","exp":"According to Boehm, cost estimation is done through three stages: basic, intermediate and complete COCOMO.","tip":"3 stages.","flag":""},{"id":"W12G-8","week":12,"kind":"G","n":8,"q":"Agile development ensure quick turn-around of projects","opts":["True","False"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"tf","topic":"project","concept":"agile","diff":"E","exp":"True. Agile development ensures quick turn-around by eliminating unnecessary documentation and starting small.","tip":"Agile = fast.","flag":""},{"id":"W12G-9","week":12,"kind":"G","n":9,"q":"Scrum is a _______ method.","opts":["Traditional SDLC","Agile"],"keys":[1],"key":1,"official":true,"keySrc":"official","type":"mcq","topic":"project","concept":"agile","diff":"E","exp":"Scrum is an agile method (others: XP, DAD, DSDM).","tip":"Scrum = agile.","flag":""},{"id":"W12G-10","week":12,"kind":"G","n":10,"q":"In a Gantt chart the length is proportional to _______ for activity","opts":["Duration planned","Effort","Cost"],"keys":[0],"key":0,"official":true,"keySrc":"official","type":"mcq","topic":"project","concept":"gantt","diff":"E","exp":"In a Gantt chart each bar is an activity and its length is proportional to the planned duration.","tip":"Gantt bar = duration.","flag":""},{"id":"W0-1","week":0,"kind":"P","n":1,"q":"Which of the following models is not suitable for accommodating any change?","opts":["Build and Fix Model","Prototyping Model","RAD Model","Waterfall Model"],"keys":[3],"key":3,"official":false,"keySrc":"slides","type":"mcq","topic":"intro","concept":"sdlc-models","diff":"M","exp":"The classical Waterfall model is rigid: stages follow one another and going back to change requirements or design is costly, so it accommodates change poorly. Prototyping, RAD and similar models are built around feedback and change; build-and-fix has no fixed plan at all.","tip":"Waterfall = rigid.","flag":""},{"id":"W0-2","week":0,"kind":"P","n":2,"q":"Which of these is (/are) type(s) of prototype in Prototyping Model?","opts":["Horizontal Prototype","Vertical Prototype","Diagonal Prototype","Domain Prototype"],"keys":[0,1],"key":0,"official":false,"keySrc":"slides","type":"msq","topic":"norman","concept":"prototype-types","diff":"M","exp":"The course names two prototype categories: horizontal (whole interface at surface level, no functionality) and vertical (a few features implemented in depth). 'Diagonal' and 'domain' prototypes are not categories in the course.","tip":"Horizontal + Vertical.","flag":""},{"id":"W0-5","week":0,"kind":"P","n":5,"q":"SDLC stands for ____________________________________________.","opts":[],"keys":null,"key":null,"official":false,"keySrc":"slides","type":"fill","fills":["Software Development Life Cycle","Software Development Lifecycle"],"topic":"intro","concept":"sdlc-models","diff":"E","exp":"SDLC = Software Development Life Cycle: the staged process (feasibility, requirements, design, coding, testing, deployment, maintenance) used to build software.","tip":"SDLC = Software Development Life Cycle.","flag":""},{"id":"W0-6","week":0,"kind":"P","n":6,"q":"System models are abstract descriptions of systems whose requirements are being analyzed.","opts":["True","False"],"keys":[0],"key":0,"official":false,"keySrc":"slides","type":"tf","topic":"design","concept":"system-models","diff":"E","exp":"True. System models are abstract descriptions of the system whose requirements are being analysed (structural, behavioural, context and interaction models).","tip":"Model = abstract description.","flag":""},{"id":"W0-7","week":0,"kind":"P","n":7,"q":"UML is based on ______________________.","opts":["notation","transitions","states","keywords"],"keys":[0],"key":0,"official":false,"keySrc":"slides","type":"mcq","topic":"ood","concept":"uml","diff":"M","exp":"UML (Unified Modeling Language) is a graphical language based on a set of notations (rectangles, lines, ellipses, stick figures) with its own syntax and semantics. It is a language, not a methodology.","tip":"UML = notation.","flag":""}],"qs":[{"id":"n7388b8f5","sec":1,"type":"mcq","topic":"intro","concept":"computer-def","diff":"E","cat":"A","beyond":false,"q":"Why can a digital pedometer be called a computer according to the Oxford definition used in the course?","exp":"The definition needs only data input, a stored program (e.g. the step-to-distance formula) and an output; keyboards, networks or operating systems are not required.","tip":"Input + stored program + output = computer.","opts":["It receives data, follows stored instructions and produces a result","It runs a full operating system with a graphical interface","It is permanently connected to the internet or a smartphone","It has a large display and a keyboard like a desktop machine"],"ans":[0]},{"id":"n0d7fe415","sec":1,"type":"mcq","topic":"intro","concept":"history","diff":"M","cat":"A","beyond":false,"q":"Which development belongs to the pre-history phase of interactive systems (1940s to 1970s)?","exp":"Sketchpad (Sutherland, 1963) introduced GUI-style interaction in the pre-history phase. The Mac, Mosaic and Android belong to later phases.","tip":"Sketchpad = 1963 pre-history.","opts":["Android 1.0 (2008)","Sketchpad (1963)","Mosaic web browser (1993)","Apple Mac (1984)"],"ans":[1]},{"id":"n256a0b85","sec":1,"type":"mcq","topic":"intro","concept":"history","diff":"M","cat":"A","beyond":false,"q":"Who introduced the term 'ubiquitous computing' in 1991?","exp":"Mark Weiser introduced ubiquitous computing (1991); Kevin Ashton coined IoT (1999) and Helen Gill cyber-physical systems (2006); Engelbart's NLS introduced the mouse.","tip":"Weiser = ubiquitous.","opts":["Douglas Engelbart","Helen Gill","Kevin Ashton","Mark Weiser"],"ans":[3]},{"id":"ndb6942e0","sec":1,"type":"mcq","topic":"intro","concept":"usability-def","diff":"E","cat":"A","beyond":false,"q":"The ISO definition of usability mentions effectiveness, efficiency and:","exp":"ISO 9241-210 lists effectiveness, efficiency and satisfaction in a specified context of use.","tip":"ISO = E-E-S.","opts":["Learnability","Utility","Satisfaction","Memorability"],"ans":[2]},{"id":"n7ead0921","sec":1,"type":"mcq","topic":"intro","concept":"usability-def","diff":"M","cat":"A","beyond":false,"q":"According to the ISO definition, a usable product is one that can be used by:","exp":"Usability is relative to specified users, goals and context; a usable product need not be designed for everybody.","tip":"Specified users - goals - context.","opts":["all kinds of users in every possible situation of use","users who understand the underlying technology well","only expert users with technical training","specified users to achieve specified goals in a specified context of use"],"ans":[3]},{"id":"ne717296e","sec":1,"type":"mcq","topic":"intro","concept":"nielse
