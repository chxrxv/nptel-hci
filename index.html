n-components","diff":"M","cat":"A","beyond":false,"q":"Which Nielsen usability component is the ease with which an intermittent user re-establishes proficiency after a gap?","exp":"Memorability concerns returning users; learnability concerns first-time users performing basic tasks.","tip":"Memorability = coming back.","opts":["Satisfaction","Learnability","Memorability","Efficiency"],"ans":[2]},{"id":"n9df63c5e","sec":1,"type":"mcq","topic":"intro","concept":"nielsen-components","diff":"M","cat":"A","beyond":false,"q":"Learnability in Nielsen's framework is the ease with which:","exp":"Learnability is about first-time (novice) users; efficiency is speed; errors is error rate and recovery.","tip":"Learnability = first time.","opts":["a first-time user performs basic tasks","an expert completes tasks quickly","users recover from errors","an intermittent user returns to the system"],"ans":[0]},{"id":"n2b0a8950","sec":1,"type":"mcq","topic":"intro","concept":"usability-def","diff":"M","cat":"A","beyond":false,"q":"Nielsen argued that an acceptable product needs usability and:","exp":"Utility (functionality supporting users' functional needs) together with usability makes a product useful.","tip":"Usability + Utility.","opts":["aesthetics","utility","scalability","security"],"ans":[1]},{"id":"n9ed2793a","sec":1,"type":"mcq","topic":"intro","concept":"ucd","diff":"M","cat":"B","beyond":false,"q":"Who coined the term 'user-centered design' (1986)?","exp":"The course attributes the term to Shneiderman (1986); ISO prefers 'human-centered design'.","tip":"UCD = Shneiderman.","opts":["Nielsen","Boehm","Norman","Shneiderman"],"ans":[3]},{"id":"n5ae33c6c","sec":1,"type":"mcq","topic":"intro","concept":"user-categories","diff":"E","cat":"A","beyond":false,"q":"Using Ctrl+S instead of the menu to save a file is most typical of which generic user category?","exp":"Experts use shortcuts such as hotkeys; novices prefer menus. The generic categories are novice, intermittent and expert.","tip":"Hotkeys = expert.","opts":["Casual","Intermittent","Expert","Novice"],"ans":[2]},{"id":"nb562dd74","sec":1,"type":"mcq","topic":"intro","concept":"waterfall","diff":"M","cat":"A","beyond":false,"q":"How many major stages does the classical waterfall model have in the course?","exp":"Seven: feasibility, requirements, system design, coding and unit testing, integration and system testing, deployment, maintenance.","tip":"Waterfall = 7.","opts":["Seven","Five","Four","Six"],"ans":[0]},{"id":"n67d9640a","sec":1,"type":"mcq","topic":"intro","concept":"spiral-model","diff":"M","cat":"A","beyond":false,"q":"Which quadrant of the spiral model is devoted to development of the product (prototype) after risks have been resolved?","exp":"1st identify objectives and risks, 2nd risk assessment and mitigation, 3rd development, 4th evaluation and planning.","tip":"3rd = develop.","opts":["Fourth","Third","First","Second"],"ans":[1]},{"id":"n1d92f51d","sec":1,"type":"mcq","topic":"intro","concept":"spiral-model","diff":"M","cat":"A","beyond":false,"q":"The spiral model is described in the course as a:","exp":"The spiral model has multiple iterations (spirals) and can encompass other life cycle models.","tip":"Spiral = meta model.","opts":["model only for hardware projects","model without iterations","strictly linear model","meta model that encompasses other SDLCs"],"ans":[3]},{"id":"nc6963a88","sec":1,"type":"mcq","topic":"intro","concept":"ucd-lifecycle","diff":"M","cat":"B","beyond":false,"q":"Why is the classical waterfall model unsuitable for usable interactive systems?","exp":"UCD needs highly iterative life cycles; waterfall focuses on efficient system design and does not explicitly consider users.","tip":"UCD needs iteration.","opts":["It has no testing stage at all before deployment","It cannot produce working code before testing finishes","It does not allow the many iterations needed to account for user feedback","It produces too few documents for the maintenance team"],"ans":[2]},{"id":"nf8856bdf","sec":1,"type":"mcq","topic":"reqs","concept":"nfr","diff":"M","cat":"A","beyond":false,"q":"Which of the following is a non-functional requirement category listed in the course?","exp":"NFR categories: performance, operating constraints, economic considerations, life-cycle requirements, interface issues.","tip":"NFR = quality attributes.","opts":["Performance related requirements","Input/output formats","Module hierarchy","Function names"],"ans":[0]},{"id":"n0d581473","sec":1,"type":"mcq","topic":"reqs","concept":"nfr","diff":"M","cat":"A","beyond":false,"q":"Which of the following is a PERFORMANCE-related non-functional requirement?","exp":"Reliability, security and response time are performance related; maintainability and portability are life-cycle requirements; cost is economic.","tip":"Performance = reliability, security, response time.","opts":["Maintainability","Response time","Cost of design","Portability"],"ans":[1]},{"id":"na2c50550","sec":1,"type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"E","cat":"A","beyond":false,"q":"In contextual inquiry the observer acts like an:","exp":"The purpose is to learn user behaviour, not to teach them how to behave.","tip":"Apprentice and master.","opts":["customer who dictates requirements","examiner who tests users","apprentice who treats users as masters","interviewer who follows a fixed script only"],"ans":[2]},{"id":"n33ba6704","sec":1,"type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"M","cat":"A","beyond":false,"q":"During which stage of contextual inquiry are 'thank you' notes sent to users?","exp":"Close stage: end the process and thank users (you may need them again).","tip":"Close = thank you.","opts":["Close","Execute","Plan","Reflect"],"ans":[0]},{"id":"n715b370a","sec":1,"type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"M","cat":"A","beyond":false,"q":"Contacting the authorities for permission and removing the users' anxieties belongs to which CI stage?","exp":"The Initiate stage opens communication with the authorities and the end users.","tip":"Initiate = permission.","opts":["Execute","Plan","Close","Initiate"],"ans":[3]},{"id":"n433dafd0","sec":1,"type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"M","cat":"A","beyond":false,"q":"Which statement describes the passive mode of contextual inquiry?","exp":"Active mode: observer physically present. Passive mode: recording and later review.","tip":"Passive = recorded.","opts":["The user is interviewed by phone after the task","User activities are recorded or videotaped and reviewed later","The observer sits next to the user and takes notes","The observer performs the tasks instead of the user"],"ans":[1]},{"id":"n37e2565e","sec":1,"type":"mcq","topic":"reqs","concept":"affinity-diagram","diff":"M","cat":"A","beyond":false,"q":"What is the third step of the affinity diagram method?","exp":"Steps: generate, display, sort into groups, create group headers, draw the finished diagram.","tip":"G-D-S-H-D.","opts":["Generate ideas","Draw the finished diagram","Display ideas","Sort ideas into groups"],"ans":[3]},{"id":"n4ff9dddd","sec":1,"type":"mcq","topic":"reqs","concept":"affinity-diagram","diff":"M","cat":"A","beyond":false,"q":"In the affinity diagram method, ideas are usually generated and displayed using:","exp":"Observations from contextual inquiry are noted on sticky notes, displayed and grouped.","tip":"Sticky notes.","opts":["Gantt charts","flowcharts","sticky notes","UML class diagrams"],"ans":[2]},{"id":"n4fb58dab","sec":1,"type":"mcq","topic":"reqs","concept":"srs","diff":"M","cat":"A","beyond":false,"q":"A function in an SRS is described by its name, input, output and:","exp":"The SRS notation uses function name, input, output and an optional description.","tip":"SRS = name/input/output/description.","opts":["description","author","cost","priority"],"ans":[0]},{"id":"ncc891682","sec":1,"type":"mcq","topic":"reqs","concept":"srs","diff":"M","cat":"A","beyond":false,"q":"Which feature of functional requirement specification means that functions are described without saying how they work?","exp":"Functions are black boxes with clearly defined input and output; decomposition and hierarchy manage complexity.","tip":"Black box = abstraction.","opts":["Inheritance","Abstraction (black box)","Polymorphism","Normalisation"],"ans":[1]},{"id":"n0868c010","sec":1,"type":"mcq","topic":"reqs","concept":"srs","diff":"M","cat":"A","beyond":false,"q":"The hierarchical naming of requirements in an SRS typically looks like:","exp":"Requirements use a hierarchical naming convention such as R1, R1.1.","tip":"R1.1 hierarchy.","opts":["R1, R1.1, R1.2","Req-X, Req-Y","F-A, F-B","A, B, C"],"ans":[0]},{"id":"n2dcba8d3","sec":1,"type":"mcq","topic":"reqs","concept":"nfr","diff":"M","cat":"A","beyond":false,"q":"Which of the following is NOT a consequence of not specifying NFRs listed in the course?","exp":"Not specifying NFRs causes dissatisfaction, inconsistency and overruns, not faster development.","tip":"No NFR = trouble.","opts":["Inconsistent software","Time and cost overruns to fix software later","Unsatisfied users, clients and developers","Guaranteed faster development"],"ans":[3]},{"id":"n370d3259","sec":1,"type":"mcq","topic":"design","concept":"ucd-concerns","diff":"M","cat":"A","beyond":false,"q":"In user-centered design, which design concern relies mainly on creativity, experience and intuition at the start?","exp":"Interface design is the prime application of creativity, aided by guidelines and heuristics; code design aims at manageable code.","tip":"Interface = creative.","opts":["Code design","Database design","Interface design","Network design"],"ans":[2]},{"id":"n4c3757b0","sec":1,"type":"mcq","topic":"design","concept":"golden-rules","diff":"M","cat":"A","beyond":false,"q":"Who proposed the 'eight golden rules' of interface design?","exp":"Shneiderman (1986); Norman proposed seven principles; Miller gave the 7+-2 memory rule.","tip":"Shneiderman = 8.","opts":["Miller","Shneiderman","Nielsen","Norman"],"ans":[1]},{"id":"n4d56bc0a","sec":1,"type":"mcq","topic":"design","concept":"golden-rules","diff":"M","cat":"A","beyond":false,"q":"Providing menus and hotkeys for novice and expert users illustrates which golden rule?","exp":"Rule 2: design for universal usability (novice, intermittent, expert).","tip":"Universal usability = all users.","opts":["Permit easy reversal of actions","Design for universal usability","Strive for consistency","Offer informative feedback"],"ans":[1]},{"id":"n9a65eaea","sec":1,"type":"mcq","topic":"design","concept":"golden-rules","diff":"M","cat":"A","beyond":false,"q":"A progress bar during a file upload follows which golden rule?","exp":"Rule 3: offer informative feedback (e.g. progress bars, a changed icon after saving).","tip":"Progress bar = feedback.","opts":["Permit easy reversal of actions","Reduce short-term memory load","Design dialogues to yield closure","Offer informative feedback"],"ans":[3]},{"id":"n908893bd","sec":1,"type":"mcq","topic":"design","concept":"golden-rules","diff":"M","cat":"A","beyond":false,"q":"Providing undo and redo supports which golden rule?","exp":"Rule 6: permit easy reversal of actions (undo/redo).","tip":"Undo = reversal.","opts":["Keep users in control","Strive for consistency","Permit easy reversal of actions","Offer error prevention"],"ans":[2]},{"id":"n4a718a28","sec":1,"type":"mcq","topic":"design","concept":"golden-rules","diff":"M","cat":"A","beyond":false,"q":"Grouping an online shopping process into beginning, middle and end with feedback at the end of each group follows which rule?","exp":"Rule 4: organise activities into groups with feedback at the end of each group to yield closure.","tip":"Closure = groups with endings.","opts":["Design dialogues to yield closure","Keep users in control","Reduce short-term memory load","Offer informative feedback only"],"ans":[0]},{"id":"n29da6efd","sec":1,"type":"mcq","topic":"design","concept":"golden-rules","diff":"H","cat":"A","beyond":false,"q":"Miller's '7 +- 2' rule is most closely tied to which golden rule?","exp":"Miller (1956): short-term memory holds about seven plus or minus two items, so users should not be forced to remember too many things.","tip":"Miller = memory.","opts":["Strive for consistency","Offer error prevention","Keep users in control","Reduce short-term memory load"],"ans":[3]},{"id":"ne3303933","sec":1,"type":"mcq","topic":"design","concept":"norman-principles","diff":"M","cat":"B","beyond":false,"q":"How many design principles did Norman propose (1988)?","exp":"Norman's seven principles (e.g. use knowledge in the world and in the head; simplify tasks; get the mappings right; design for error; standardize).","tip":"Norman = 7; Shneiderman = 8.","opts":["Ten","Seven","Eight","Five"],"ans":[1]},{"id":"n9c77b19f","sec":1,"type":"mcq","topic":"design","concept":"norman-principles","diff":"H","cat":"B","beyond":false,"q":"Which Norman principle is 'when all else fails'?","exp":"The seventh principle: when all else fails, standardize.","tip":"Last resort = standardize.","opts":["Standardize","Make things visible","Get the mappings right","Design for error"],"ans":[0]},{"id":"n1e70087d","sec":1,"type":"mcq","topic":"design","concept":"code-design","diff":"M","cat":"A","beyond":false,"q":"Which of the following is part of high-level (preliminary) code design?","exp":"High-level design: modules, control relationships and interface definitions. Data structures and algorithms belong to detailed design.","tip":"High-level = modules.","opts":["Choosing variable names","Selecting data structures and algorithms","Identification of modules and control relationships","Writing unit tests"],"ans":[2]},{"id":"nc88040dd","sec":1,"type":"mcq","topic":"design","concept":"code-design-lang","diff":"M","cat":"A","beyond":false,"q":"The language used to express interface design ideas (as opposed to code design) is the:","exp":"Prototypes are considered the language of interface design.","tip":"Interface language = prototype.","opts":["UML","prototype","DFD","ER diagram"],"ans":[1]},{"id":"na41d40a9","sec":1,"type":"mcq","topic":"norman","concept":"norman-model","diff":"M","cat":"A","beyond":false,"q":"How many actions are defined in Norman's model of interaction?","exp":"Four in the execution stage and three in the evaluation stage: seven stages of action.","tip":"4 + 3 = 7.","opts":["Five","Nine","Seven","Four"],"ans":[2]},{"id":"nbc337bd2","sec":1,"type":"mcq","topic":"norman","concept":"norman-model","diff":"M","cat":"A","beyond":false,"q":"Which is the FIRST action in Norman's execution stage?","exp":"Goal -> intention -> sequence of actions -> execution; only the last involves motor action.","tip":"Goal first.","opts":["Establishing the goal","Executing the task","Intention formulation","Task specification"],"ans":[0]},{"id":"n20220595","sec":1,"type":"mcq","topic":"norman","concept":"norman-model","diff":"M","cat":"A","beyond":false,"q":"Which of these actions involves human motor activity?","exp":"The first three execution actions are mental; the last (execution) is motor. Perception uses the senses and the last two evaluation actions are mental.","tip":"Execution = motor.","opts":["Establishing the goal","Interpreting the system state","Formulating the intention","Executing the action sequence"],"ans":[3]},{"id":"nafcc617f","sec":1,"type":"mcq","topic":"norman","concept":"gulfs","diff":"M","cat":"A","beyond":false,"q":"A user's interpretation of the interface state not matching the actual state is the gulf of:","exp":"Gulf of execution: actions we can specify are not supported; gulf of evaluation: interpretation does not match the real state.","tip":"Evaluation = interpret mismatch.","opts":["execution","interaction","evaluation","intention"],"ans":[2]},{"id":"n0f9bb221","sec":1,"type":"mcq","topic":"norman","concept":"slips-mistakes","diff":"M","cat":"A","beyond":false,"q":"A user who understands the goal and system but performs an incorrect action has made a:","exp":"Slip: correct goal, incorrect action (fix by better interface design). Mistake: wrong goal or wrong understanding (fix by better understanding of the system).","tip":"Slip = right goal, wrong action.","opts":["delay","mistake","gulf","slip"],"ans":[3]},{"id":"n57c40c47","sec":1,"type":"mcq","topic":"norman","concept":"slips-mistakes","diff":"M","cat":"A","beyond":false,"q":"Mistakes are best reduced by:","exp":"Slips: better interface design; mistakes: better understanding of the system.","tip":"Mistake = understanding.","opts":["better understanding of the system","more colourful icons","better interface design only","longer help messages only"],"ans":[0]},{"id":"neb16a717","sec":1,"type":"mcq","topic":"norman","concept":"prototype-types","diff":"M","cat":"A","beyond":false,"q":"Which prototype represents interaction by implementing a few selected features in depth?","exp":"Vertical prototypes implement features from the first screen to the screen after the last action; horizontal prototypes show the surface of the whole interface.","tip":"Vertical = depth.","opts":["Low-fidelity only","Vertical","Throw-away only","Horizontal"],"ans":[1]},{"id":"na9ee5319","sec":1,"type":"mcq","topic":"norman","concept":"prototype-types","diff":"M","cat":"A","beyond":false,"q":"Horizontal prototypes are most suitable for:","exp":"Horizontal prototypes depict the whole interface without functionality.","tip":"Horizontal = look and feel.","opts":["performing real work with the system","discussing and eliciting feedback on look and feel","analysing detailed interaction sequences","measuring typing speed of users"],"ans":[1]},{"id":"n76a7ccb1","sec":1,"type":"mcq","topic":"norman","concept":"fidelity","diff":"M","cat":"A","beyond":false,"q":"Which tool use gives a medium-fidelity prototype?","exp":"Medium fidelity: computers used to create simple prototypes (slideshows, animations). Low = paper; high = real programming.","tip":"Medium = computer-made simple.","opts":["Cardboard mock-up","A full Java Swing application","A PowerPoint slideshow simulating interaction","A hand sketch"],"ans":[2]},{"id":"n03962390","sec":1,"type":"mcq","topic":"norman","concept":"fidelity","diff":"M","cat":"A","beyond":false,"q":"Java Swing and Tcl/Tk are examples of toolkits used for:","exp":"Hi-fidelity prototypes are built with programming and interface toolkits.","tip":"Toolkit = high fidelity.","opts":["low-fidelity prototypes","storyboards","medium-fidelity prototypes","high-fidelity prototypes"],"ans":[3]},{"id":"nd50dca79","sec":1,"type":"mcq","topic":"norman","concept":"prototype-use","diff":"M","cat":"B","beyond":false,"q":"In the 'evolutionary' approach to using prototypes, the:","exp":"Incremental: separate units; evolutionary: whole system refined into the product.","tip":"Evolutionary = refine the whole.","opts":["whole system is prototyped, tested and altered until it becomes the final product","each unit is prototyped and tested separately and then integrated","prototype is never tested with real users in this approach","prototype is always thrown away once the first feedback arrives"],"ans":[0]},{"id":"n406c7eba","sec":1,"type":"mcq","topic":"norman","concept":"storyboarding","diff":"M","cat":"B","beyond":false,"q":"A series of sketches showing how the interface changes during a task is called:","exp":"Storyboarding represents interaction with a sequence of sketches.","tip":"Story = sequence.","opts":["a DFD","storyboarding","a heuristic list","an affinity diagram"],"ans":[1]},{"id":"n8aa31d83","sec":1,"type":"mcq","topic":"eval","concept":"cognitive-walkthrough","diff":"M","cat":"A","beyond":false,"q":"A cognitive walkthrough requires at least which kind of prototype?","exp":"CW is scenario-based and needs a vertical prototype with several tasks, a task description and a set of questions.","tip":"CW = vertical.","opts":["No prototype, only a requirements document","Any horizontal prototype showing the surface only","A finished product with all features","A low-fidelity vertical prototype supporting several tasks"],"ans":[3]},{"id":"n02667bc3","sec":1,"type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"M","cat":"A","beyond":false,"q":"Which statement distinguishes heuristic evaluation from cognitive walkthrough?","exp":"Heuristic evaluation checks the system against a checklist; cognitive walkthrough is scenario-based.","tip":"Heuristic = checklist, no scenarios.","opts":["It needs no task scenarios and horizontal prototypes suffice","It needs a vertical prototype with scenarios","It uses a questionnaire after each task","It requires real end users only"],"ans":[0]},{"id":"n285abe8e","sec":1,"type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"M","cat":"A","beyond":false,"q":"Which set of heuristics is discussed in the course for heuristic evaluation?","exp":"The course uses Nielsen's (1994) ten heuristics.","tip":"Nielsen = 10 heuristics.","opts":["Boehm's 3 stages","Norman's 7 principles","Nielsen's 10 heuristics","Shneiderman's 8 rules"],"ans":[2]},{"id":"n4b884a84","sec":1,"type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"M","cat":"A","beyond":false,"q":"Which Nielsen heuristic says users should always be informed about what is going on through timely feedback?","exp":"Visibility of system status: keep users informed through appropriate feedback within a reasonable time.","tip":"Visibility = status.","opts":["Visibility of system status","Help and documentation","Consistency and standards","Error prevention"],"ans":[0]},{"id":"n9fb4794f","sec":1,"type":"mcq","topic":"eval","concept":"asq","diff":"M","cat":"A","beyond":false,"q":"How many statements does the After-Scenario Questionnaire (ASQ) have?","exp":"ASQ has three statements rated on a 7-point scale.","tip":"ASQ = 3 items.","opts":["Ten","Three","Five","Seven"],"ans":[1]},{"id":"n3e6119c9","sec":1,"type":"mcq","topic":"eval","concept":"sus","diff":"M","cat":"A","beyond":false,"q":"The SUS questionnaire consists of how many statements?","exp":"Ten statements: five positively worded and five negatively worded; 5-point scale.","tip":"SUS = 10.","opts":["Three","Seven","Ten","Five"],"ans":[2]},{"id":"n926a77b7","sec":1,"type":"mcq","topic":"eval","concept":"sus","diff":"H","cat":"A","beyond":false,"q":"In SUS scoring, the contribution of a positively worded statement is:","exp":"Positive statements: rating - 1; negative: 5 - rating; the sum is multiplied by 2.5 for a score out of 100.","tip":"Positive: minus 1.","opts":["the rating times 2.5","the rating plus 1","5 minus the rating","the rating minus 1"],"ans":[3]},{"id":"n08dbc936","sec":1,"type":"mcq","topic":"eval","concept":"self-report","diff":"M","cat":"A","beyond":false,"q":"Feedback on rating scales is generally considered:","exp":"The course notes that open-ended feedback may not be reliable.","tip":"Rating scales = reliable.","opts":["unreliable compared with open-ended questions","unsuitable for questionnaires","only useful for experts","more efficient and reliable than open-ended questions"],"ans":[3]},{"id":"n6dbd6602","sec":1,"type":"mcq","topic":"sysdesign","concept":"good-design","diff":"M","cat":"A","beyond":false,"q":"Which characteristic of a good design means that all SRS functionalities are implemented?","exp":"Coverage = implement ALL functionality of the SRS; correctness = implement it CORRECTLY.","tip":"Coverage = all.","opts":["Maintainability","Efficiency","Coverage","Correctness"],"ans":[2]},{"id":"n1ceaff87","sec":1,"type":"mcq","topic":"sysdesign","concept":"cohesion","diff":"M","cat":"A","beyond":false,"q":"A module whose functions are all performed in the same time span (e.g. initialisation) has which cohesion?","exp":"Temporal cohesion: all functions to be performed in the same time span.","tip":"Temporal = time.","opts":["Logical","Temporal","Sequential","Communication"],"ans":[1]},{"id":"n78122c25","sec":1,"type":"mcq","topic":"sysdesign","concept":"cohesion","diff":"M","cat":"A","beyond":false,"q":"Sequential cohesion means that:","exp":"Example: get-input, validate-input, sort-input.","tip":"Sequential = output feeds input.","opts":["output of one element is the input of the next","functions are performed at the same time","all functions refer to the same data structure","all functions perform similar operations"],"ans":[0]},{"id":"n130a2751","sec":1,"type":"mcq","topic":"sysdesign","concept":"coupling","diff":"M","cat":"A","beyond":false,"q":"Passing an integer between two modules is an example of which coupling?","exp":"Data coupling: modules communicate through a data item. Control: a flag controls the other module. Content: shared code.","tip":"Data = value passed.","opts":["Logical coupling","Control coupling","Data coupling","Content coupling"],"ans":[2]},{"id":"nd82f6228","sec":1,"type":"mcq","topic":"sysdesign","concept":"coupling","diff":"M","cat":"A","beyond":false,"q":"Functionally independent modules have:","exp":"Good modular design: high cohesion and low coupling.","tip":"High cohesion, low coupling.","opts":["high cohesion and high coupling","high cohesion and low coupling","low cohesion and low coupling","low cohesion and high coupling"],"ans":[1]},{"id":"n036dbe44","sec":1,"type":"mcq","topic":"sysdesign","concept":"dfd","diff":"M","cat":"A","beyond":false,"q":"Which DFD level contains only one process representing the entire system?","exp":"The context diagram shows the entire system as a single process with external entities; data stores first appear at level 1.","tip":"Level 0 = context.","opts":["Level 2","Level 3","Level 1","Level 0 (context diagram)"],"ans":[3]},{"id":"n3fa3f985","sec":1,"type":"mcq","topic":"sysdesign","concept":"dfd","diff":"M","cat":"A","beyond":false,"q":"Which statement about data stores in a DFD is correct?","exp":"Data stores cannot create new data; only previously stored data can be read. They first appear at level 1.","tip":"Stores store, not create.","opts":["Only previously stored data can be read from them","They are drawn as stick figures","They appear in the context diagram","They create new data"],"ans":[0]},{"id":"nb21e3061","sec":1,"type":"mcq","topic":"sysdesign","concept":"dfd","diff":"M","cat":"A","beyond":false,"q":"In a DFD, a process name should be a:","exp":"Process -> verb phrase; data flow label -> noun naming the data.","tip":"Process = verb.","opts":["number","noun","adjective","verb phrase"],"ans":[3]},{"id":"n96a3126a","sec":1,"type":"mcq","topic":"sysdesign","concept":"er-diagram","diff":"M","cat":"A","beyond":false,"q":"Who proposed the entity-relationship diagram (1976)?","exp":"ER diagrams were proposed by Peter Chen in 1976.","tip":"ER = Chen.","opts":["Boehm","Henry Gantt","Peter Chen","Rajib Mall"],"ans":[2]},{"id":"nad8ee842","sec":1,"type":"mcq","topic":"sysdesign","concept":"er-diagram","diff":"M","cat":"A","beyond":false,"q":"An attribute whose value is computed from other attributes (e.g. age from date of birth) is a:","exp":"Derived attributes are computed from other attributes or entities.","tip":"Derived = computed.","opts":["derived attribute","multi-valued attribute","null attribute","simple attribute"],"ans":[0]},{"id":"n9c9eb0ba","sec":1,"type":"mcq","topic":"ood","concept":"class-attr-ops","diff":"M","cat":"A","beyond":false,"q":"An object is best described as:","exp":"An object is an instantiation of a class: attribute values assigned and operations initialised.","tip":"Object = instance.","opts":["a database table","an instantiation of a class","a function with parameters","a UML diagram"],"ans":[1]},{"id":"n7e0d3e0f","sec":1,"type":"mcq","topic":"ood","concept":"uml-views","diff":"M","cat":"A","beyond":false,"q":"Use case diagrams belong to which UML view?","exp":"User view = use case diagrams; structural = class and object; implementation = component; environment = deployment.","tip":"Use case = user view.","opts":["Environment view","Structural view","Behavioural view","User view"],"ans":[3]},{"id":"n7e93fdf1","sec":1,"type":"mcq","topic":"ood","concept":"uml-views","diff":"M","cat":"A","beyond":false,"q":"Which diagram belongs to the environment view in UML?","exp":"Environment view = deployment diagram.","tip":"Deployment = environment.","opts":["Sequence diagram","Deployment diagram","Component diagram","Class diagram"],"ans":[1]},{"id":"n5bf762b1","sec":1,"type":"mcq","topic":"ood","concept":"domain-objects","diff":"M","cat":"A","beyond":false,"q":"Objects with which actors interact, such as screens and menus, are:","exp":"Boundary: actors interact (identified from use cases); controller: coordinate; entity: hold information.","tip":"Boundary = screens.","opts":["boundary objects","controller objects","entity objects","derived objects"],"ans":[0]},{"id":"nec4416dd","sec":1,"type":"mcq","topic":"ood","concept":"class-relationships","diff":"M","cat":"B","beyond":false,"q":"The relationship in which parts are existence-dependent on the whole is:","exp":"Composition is a stricter aggregation: parts are created and destroyed with the whole (filled diamond).","tip":"Composition = filled diamond.","opts":["inheritance","aggregation","composition","association"],"ans":[2]},{"id":"n95f833fb","sec":1,"type":"mcq","topic":"coding","concept":"coding-standards","diff":"M","cat":"A","beyond":false,"q":"A rule of thumb for comments is at least one concise comment line for every:","exp":"At least one concise explanatory comment per three source lines on average.","tip":"1 comment : 3 lines.","opts":["10 source lines","1 source line","2 source lines","3 source lines"],"ans":[3]},{"id":"ne47e4055","sec":1,"type":"mcq","topic":"coding","concept":"coding-avoid","diff":"M","cat":"A","beyond":false,"q":"A 'side effect' of a function call includes all EXCEPT:","exp":"Obscure side effects (parameters, globals, I/O) hamper understanding; returning a result is normal.","tip":"Side effects: params, globals, I/O.","opts":["modification of parameters","I/O operations","returning a value to the caller","modification of global variables"],"ans":[2]},{"id":"n9f2d77ac","sec":1,"type":"mcq","topic":"coding","concept":"review-testing","diff":"M","cat":"A","beyond":false,"q":"Code inspection is similar to which evaluation method for interfaces?","exp":"Inspection uses a checklist of common errors, like heuristic evaluation; code walkthrough resembles cognitive walkthrough.","tip":"Inspection = heuristic.","opts":["heuristic evaluation","wizard of oz","cognitive walkthrough","contextual inquiry"],"ans":[0]},{"id":"n9f26fa2e","sec":1,"type":"mcq","topic":"coding","concept":"review-testing","diff":"M","cat":"A","beyond":false,"q":"Code walkthrough is similar to:","exp":"Walkthrough: representative test cases executed by hand, like scenario-based cognitive walkthrough.","tip":"Walkthrough = walkthrough.","opts":["heuristic evaluation","cognitive walkthrough","expert interview","affinity diagram"],"ans":[1]},{"id":"nd8e59fed","sec":1,"type":"mcq","topic":"blackbox","concept":"equivalence-class","diff":"M","cat":"A","beyond":false,"q":"For a program that computes the square root of an integer in [0, 5000], how many equivalence classes does the course suggest?","exp":"Negative integers (invalid), integers 0-5000 (valid) and integers above 5000 (invalid).","tip":"3 classes.","opts":["Five","One","Three","Two"],"ans":[2]},{"id":"nf236f2da","sec":1,"type":"mcq","topic":"blackbox","concept":"boundary-value","diff":"M","cat":"B","beyond":false,"q":"Boundary value analysis for the range [0, 5000] adds test cases such as:","exp":"Programmers often err at class boundaries (< vs <=), so test the values at and just outside the boundaries.","tip":"Boundaries: -1, 0, 5000, 5001.","opts":["5000, 6000, 7000","100, 200, 300","1, 2500, 4999","-1, 0, 5000, 5001"],"ans":[3]},{"id":"nb388fc83","sec":1,"type":"mcq","topic":"whitebox","concept":"cfg","diff":"M","cat":"A","beyond":false,"q":"In a control flow graph each numbered statement is represented by a:","exp":"Nodes represent statements; an edge is added when control can transfer from one statement to another.","tip":"Node = statement.","opts":["loop","node","path","edge"],"ans":[1]},{"id":"nc4c39357","sec":1,"type":"mcq","topic":"whitebox","concept":"coverage","diff":"M","cat":"B","beyond":false,"q":"Which coverage strategy aims to execute every statement at least once?","exp":"Statement coverage is the weakest of the listed strategies; branch coverage is stronger.","tip":"Statement = each line.","opts":["Statement coverage","Branch coverage","Condition coverage","Path coverage"],"ans":[0]},{"id":"ncc5e127c","sec":1,"type":"mcq","topic":"whitebox","concept":"cyclomatic","diff":"M","cat":"A","beyond":false,"q":"For a CFG with 7 edges and 6 nodes, cyclomatic complexity E - N + 2 equals:","exp":"7 - 6 + 2 = 3 (also D + 1 with D = 2 decisions).","tip":"E - N + 2.","opts":["4","1","3","2"],"ans":[2]},{"id":"ndcddf6c6","sec":1,"type":"mcq","topic":"whitebox","concept":"system-testing","diff":"M","cat":"A","beyond":false,"q":"Alpha testing is carried out by:","exp":"Alpha: in-house test team; beta: friendly customers; acceptance: the customer.","tip":"Alpha = in-house.","opts":["a test team within the organisation","a select group of friendly customers","the customer","end users on the internet"],"ans":[0]},{"id":"n02f7ce32","sec":1,"type":"mcq","topic":"whitebox","concept":"integration-testing","diff":"M","cat":"B","beyond":false,"q":"In top-down integration testing, routines that simulate lower-level modules are called:","exp":"Stubs simulate lower-level routines called by routines under test; drivers simulate upper-level modules in bottom-up testing.","tip":"Stub = lower; driver = upper.","opts":["oracles","stubs","drivers","mocks of upper layers"],"ans":[1]},{"id":"na6515aae","sec":1,"type":"mcq","topic":"empirical","concept":"variables","diff":"M","cat":"A","beyond":false,"q":"In the study comparing text entry speed of two interfaces, the 'interface' is the:","exp":"Interface is controlled by the experimenter (independent); text entry speed depends on it (dependent).","tip":"Controlled = independent.","opts":["confounding variable","control variable","dependent variable","independent variable"],"ans":[3]},{"id":"n69463ca5","sec":1,"type":"mcq","topic":"empirical","concept":"variables","diff":"M","cat":"A","beyond":false,"q":"The values assigned to an independent variable (factor) are called:","exp":"Factors combined with levels give the test conditions.","tip":"Factor has levels.","opts":["scales","hypotheses","levels","samples"],"ans":[2]},{"id":"n9c73f658","sec":1,"type":"mcq","topic":"empirical","concept":"scales","diff":"M","cat":"A","beyond":false,"q":"Which measurement scale is used for ranking three phones as 1st, 2nd and 3rd?","exp":"Ordinal scales impose an order; Likert ratings are also ordinal.","tip":"Ordinal = order.","opts":["Interval","Ratio","Nominal","Ordinal"],"ans":[3]},{"id":"n2a052240","sec":1,"type":"mcq","topic":"empirical","concept":"scales","diff":"M","cat":"A","beyond":false,"q":"Characters per minute (CPM) is measured on which scale?","exp":"CPM is a ratio of characters typed to minutes spent: the most sophisticated scale.","tip":"CPM = ratio.","opts":["Interval","Ratio","Nominal","Ordinal"],"ans":[1]},{"id":"n83a2460d","sec":1,"type":"mcq","topic":"empirical","concept":"study-design","diff":"M","cat":"A","beyond":false,"q":"In a within-subject (repeated-measure) design:","exp":"Within-subject: all conditions for every participant (practice effect may occur); between-subject: subsets per group.","tip":"Within = everyone does all.","opts":["every participant performs tasks for all test conditions","only experts take part","no participant repeats tasks","each participant performs tasks for one condition only"],"ans":[0]},{"id":"nee15b1da","sec":1,"type":"mcq","topic":"empirical","concept":"study-design","diff":"M","cat":"A","beyond":false,"q":"The Latin Square method is used to:","exp":"Each condition appears once in each row and column to counter the practice effect.","tip":"Latin square = counterbalance.","opts":["compute the SUS score from ratings","choose the number of participants required","counterbalance the sequence of tasks across participants","select research questions for the study"],"ans":[2]},{"id":"ne01b707a","sec":1,"type":"mcq","topic":"stats","concept":"significance","diff":"M","cat":"A","beyond":false,"q":"The statistic usually compared in user-centric significance tests is the:","exp":"We test the significance of the difference between group means.","tip":"Compare means.","opts":["p-value of a prior study","mean of a group of data items","median only","sample size"],"ans":[1]},{"id":"n921becec","sec":1,"type":"mcq","topic":"stats","concept":"significance","diff":"M","cat":"A","beyond":false,"q":"A result reported as t(11) = 2.70, p < 0.05 means:","exp":"11 = degrees of freedom; p < 0.05 means the null hypothesis can be rejected.","tip":"p < 0.05 = significant.","opts":["the difference is significant; chance probability is about 5% or less","the sample had 2.70 participants on average per condition","there were 11 variables in the experiment","the data occurred by chance more than 5% of the time"],"ans":[0]},{"id":"n6bde71a8","sec":1,"type":"mcq","topic":"project","concept":"project-planning","diff":"M","cat":"A","beyond":false,"q":"Which is NOT one of the four project planning estimates in the course?","exp":"Project planning estimates project size, cost, duration and effort.","tip":"Size, cost, duration, effort.","opts":["Duration","Cost","Size","Colour scheme"],"ans":[3]},{"id":"n1c9d4079","sec":1,"type":"mcq","topic":"project","concept":"cocomo","diff":"M","cat":"A","beyond":false,"q":"Basic COCOMO estimates effort in:","exp":"Effort = a x (KLoC)^a1 person-months; Tdev in months.","tip":"Effort = person-months.","opts":["days","person-months","lines of code","function points"],"ans":[1]},{"id":"n69f16747","sec":1,"type":"mcq","topic":"project","concept":"agile","diff":"M","cat":"A","beyond":false,"q":"A typical agile iteration (sprint) lasts:","exp":"The course says agile iterations are typically 4-6 weeks.","tip":"Sprint 4-6 weeks.","opts":["6 months","1-2 days","4-6 weeks","2 years"],"ans":[2]},{"id":"n8be2d5c8","sec":2,"type":"mcq","topic":"intro","concept":"usability-def","diff":"H","cat":"A","beyond":false,"q":"A hospital app has every conceivable feature, yet nurses find it slow to learn and abandon it. Which ISO-based reasoning BEST explains why more features did not help?","exp":"The ISO definition ties usability to specified users, goals and context of use; putting every feature in a product need not make it usable.","tip":"Specified, not everything.","opts":["Features raise satisfaction automatically","Usability requires the product to serve all users in all contexts","Utility is irrelevant to usability","Usability is about specified users, goals and context, not about adding every feature"],"ans":[3]},{"id":"nc4214e8a","sec":2,"type":"mcq","topic":"intro","concept":"nielsen-components","diff":"H","cat":"A","beyond":false,"q":"A banking app lets a first-time user open an account easily but returning customers who visit only twice a year cannot remember how to transfer money. Which Nielsen component is weakest?","exp":"Intermittent users re-establishing proficiency after gaps = memorability; learnability concerns first-time basic tasks and works well here.","tip":"Gaps in use = memorability.","opts":["Memorability","Learnability","Satisfaction","Efficiency"],"ans":[0]},{"id":"n05677cf3","sec":2,"type":"mcq","topic":"intro","concept":"usability-def","diff":"H","cat":"A","beyond":false,"q":"A photo editor is pleasant, fast and easy to learn, but it lacks the crop tool most users need. Which quality attribute is deficient?","exp":"Utility is the functional support for user needs (features); the other components are fine here.","tip":"Missing feature = utility.","opts":["Utility","Learnability","Satisfaction","Efficiency"],"ans":[0]},{"id":"n1f301c10","sec":2,"type":"mcq","topic":"intro","concept":"usability-def","diff":"H","cat":"A","beyond":false,"q":"Mapping the ISO definition to Nielsen's framework, 'effectiveness' corresponds most closely to:","exp":"The course maps effectiveness to utility, leaving efficiency and satisfaction as the ISO usability measures.","tip":"Effectiveness = utility.","opts":["learnability","memorability","utility","errors"],"ans":[2]},{"id":"nfa3f77dc","sec":2,"type":"mcq","topic":"intro","concept":"spiral-model","diff":"H","cat":"A","beyond":false,"q":"A team fears the client has misunderstood a key requirement and builds a quick mock-up before coding. In spiral model terms they are in the:","exp":"Risk of inappropriate requirement specification is reduced by building a prototype in the second quadrant.","tip":"Risk -> prototype -> 2nd quadrant.","opts":["fourth quadrant (evaluation and planning)","first quadrant (identify objectives)","third quadrant (development)","second quadrant (risk assessment and mitigation)"],"ans":[3]},{"id":"nbfa7a6a7","sec":2,"type":"mcq","topic":"intro","concept":"spiral-model","diff":"H","cat":"A","beyond":false,"q":"At the end of an iteration the team reviews the result with the customer and plans the next iteration around the spiral. This is the:","exp":"The fourth quadrant is evaluation (with the customer) and planning.","tip":"4th = review and plan.","opts":["first quadrant","fourth quadrant","third quadrant","second quadrant"],"ans":[1]},{"id":"n505f74ae","sec":2,"type":"mcq","topic":"intro","concept":"ucd-lifecycle","diff":"H","cat":"B","beyond":false,"q":"A team that keeps going back from coding to requirements after every user complaint is doing which type of iteration the course warns about?","exp":"Loops outside the early design-prototype-evaluate loop raise development cost (manpower, time, resources); iterate early where it is cheap.","tip":"Iterate early, not late.","opts":["design-prototype-evaluate loops","contextual inquiry with end users at the start","heuristic evaluation of the early prototype","loops outside design-prototype-evaluate, which should be rare"],"ans":[3]},{"id":"n99f40425","sec":2,"type":"mcq","topic":"intro","concept":"scd-ucd","diff":"H","cat":"A","beyond":false,"q":"Which team statement shows system-centred (not user-centred) thinking?","exp":"System-centred design asks what is easy to build, what tools offer and what the programmer finds interesting.","tip":"SCD = programmer's convenience.","opts":["'What will our users find easy to do?'","'What are the goals of the people who will use this?'","'Let us pick the layout that is easiest to code with this toolkit.'","'Which context will the users work in?'"],"ans":[2]},{"id":"nce272501","sec":2,"type":"mcq","topic":"intro","concept":"user-categories","diff":"H","cat":"A","beyond":false,"q":"An app designer provides both a guided wizard and keyboard shortcuts. Which pair of generic user categories is mainly being served?","exp":"Wizard/menus serve novices; shortcuts serve experts (and intermittent users in between). 'Super knowledgeable' is not a category.","tip":"Wizard = novice; hotkey = expert.","opts":["intermittent and super-knowledgeable users","novice and expert users","expert and casual users","novice and super-knowledgeable users"],"ans":[1]},{"id":"nc3612b67","sec":2,"type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"H","cat":"A","beyond":false,"q":"A designer videotapes office staff at work and reviews the recordings later without being present. This is contextual inquiry in:","exp":"Passive mode: activities are recorded and reviewed later; active mode has the observer present.","tip":"Recorded = passive.","opts":["passive mode","active mode","reflect mode","semi-active mode"],"ans":[0]},{"id":"ne0e74692","sec":2,"type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"H","cat":"A","beyond":false,"q":"During an observation a user asks the researcher how to perform a task and the researcher starts teaching the correct method. What principle of CI is violated?","exp":"The purpose is to learn user behaviour; the observer treats users as masters.","tip":"Apprentice, not teacher.","opts":["The observer should never ask users any clarifying question","The observer is an apprentice learning behaviour, not a teacher of users","The observer should always stay absent and rely only on recordings","The observation must stop whenever a user asks a question"],"ans":[1]},{"id":"n11db4f25","sec":2,"type":"mcq","topic":"reqs","concept":"contextual-inquiry","diff":"H","cat":"A","beyond":false,"q":"Which task belongs to the PLAN stage of contextual inquiry rather than the Initiate stage?","exp":"Plan: goals, domain knowledge, recording arrangements, users and place, scripting and rehearsal. Initiate: permission and removing anxieties.","tip":"Plan = prepare + script.","opts":["Sending thank-you notes","Analysing the collected data","Scripting the procedure and rehearsing it","Contacting the authorities for permission"],"ans":[2]},{"id":"nb3e53ce8","sec":2,"type":"mcq","topic":"reqs","concept":"affinity-diagram","diff":"H","cat":"A","beyond":false,"q":"After writing observations on sticky notes and pinning them up, a team clusters similar notes. They are performing which step?","exp":"Step 3: sort ideas into groups; step 4 names each group with a header.","tip":"Cluster = step 3.","opts":["Create group headers","Display ideas","Generate ideas","Sort ideas into groups"],"ans":[3]},{"id":"n90932a00","sec":2,"type":"mcq","topic":"reqs","concept":"affinity-diagram","diff":"H","cat":"A","beyond":false,"q":"The same sticky-note observations are grouped in two different ways by two teams, giving different headers. What does the course conclude?","exp":"The lecture on the calendar case study notes that the same observations can be grouped in different ways.","tip":"Many groupings possible.","opts":["The same observations can be grouped in different ways","Affinity diagrams are unreliable and should not be used","Headers must be identical across teams","One team must be wrong"],"ans":[0]},{"id":"ncd4cd0c9","sec":2,"type":"mcq","topic":"reqs","concept":"srs","diff":"H","cat":"A","beyond":false,"q":"Which entry is a poor requirement for an SRS because it states a design/implementation choice rather than a function?","exp":"Choosing a database is a design decision (the calendar example); requirements state WHAT functions are needed, not how.","tip":"SRS = what, not how.","opts":["R2.1: Create Reminder - input: date, event, time","'Store the reminders using MySQL'","R3: Set Background - input: images","R1: Display Month - input: year, output: months of the year"],"ans":[1]},{"id":"n070441c0","sec":2,"type":"mcq","topic":"reqs","concept":"srs","diff":"H","cat":"A","beyond":false,"q":"A developer writes: 'We need to develop it for mobile platforms'. According to the course this is mainly a matter of:","exp":"Platform and language choices relate to feasibility (or design), not requirements per se.","tip":"Platform = feasibility.","opts":["feasibility","testing","functional requirement","usability requirement"],"ans":[0]},{"id":"naed581e2","sec":2,"type":"mcq","topic":"reqs","concept":"nfr","diff":"H","cat":"A","beyond":false,"q":"Which requirement is MOST clearly a non-functional (quality) requirement?","exp":"Response time is a performance-related NFR; the others are functions with inputs and outputs.","tip":"Time limit = NFR.","opts":["'The user can create an account'","'The user can delete a note'","'The user can search notes by date'","'Searching should return results within two seconds'"],"ans":[3]},{"id":"n0360ed77","sec":2,"type":"mcq","topic":"reqs","concept":"ci-to-fr","diff":"H","cat":"B","beyond":false,"q":"Observations from CI show that students check their lecture timetable, deadlines and meetings day-wise. What did the course do with these observations?","exp":"The affinity diagram was used to frame guidelines and to add new FRs (R5.1-R5.3).","tip":"CI observations -> new FRs.","opts":["Converted them directly into a DFD for the system","Used them only to select colours and fonts","Added new functional requirements (timetable, deadline and meeting views)","Dropped them because observations are not functional requirements"],"ans":[2]},{"id":"n30dbf474","sec":2,"type":"mcq","topic":"design","concept":"golden-rules","diff":"H","cat":"A","beyond":false,"q":"A form places 'Close' and 'Start' buttons next to each other so users often cancel their work by mistake. Which golden rule is violated?","exp":"Error prevention: keep error rates low (e.g. do not place close and start options close to each other).","tip":"Close next to start = error prevention.","opts":["Strive for consistency","Offer error prevention and simple error handling","Design dialogues to yield closure","Reduce short-term memory load"],"ans":[1]},{"id":"nebe614c2","sec":2,"type":"mcq","topic":"design","concept":"golden-rules","diff":"H","cat":"A","beyond":false,"q":"A railway site forces users to remember station codes and open another page to look them up. Which TWO golden rules does the course say this violates (besides universal usability)?","exp":"The case study cites rules 2 (universal usability), 7 (keep users in control) and 8 (reduce short-term memory load).","tip":"Station codes: rules 2, 7, 8.","opts":["Strive for consistency and permit easy reversal","Error prevention and informative feedback","Offer informative feedback and design dialogues to yield closure","Keep users in control and reduce short-term memory load"],"ans":[3]},{"id":"ne0963cbc","sec":2,"type":"mcq","topic":"design","concept":"golden-rules","diff":"H","cat":"A","beyond":false,"q":"Predictive text in the station-name field, showing station names and codes in a drop-down, mainly helps to:","exp":"The revised design lets the user select from predictions in the same interface instead of recalling codes or switching pages.","tip":"Predict = recognise, not recall.","opts":["add more hyperlinks to the station page","remove the need to enter a source station","reduce memory load and keep users in the same interface","enforce stricter validation of station codes"],"ans":[2]},{"id":"n36f33502","sec":2,"type":"mcq","topic":"design","concept":"golden-rules","diff":"H","cat":"A","beyond":false,"q":"Dragging and dropping a file so the user sees the change in system state immediately mainly supports which golden rule?","exp":"Rule 7: users should feel in control and perceive their interaction and the change in system state (e.g. drag and drop).","tip":"Drag-drop = control.","opts":["Keep users in control","Reduce short-term memory load","Offer error prevention","Strive for consistency"],"ans":[0]},{"id":"n8ca54847","sec":2,"type":"mcq","topic":"design","concept":"golden-rules","diff":"H","cat":"A","beyond":false,"q":"A software changes the colour of a floppy-disk icon after saving a file. This applies:","exp":"Rule 3 example: colour change of the storage metaphor icon after the save operation.","tip":"Icon change = feedback.","opts":["informative feedback","universal usability","easy reversal of actions","error prevention"],"ans":[0]},{"id":"n00e44feb","sec":2,"type":"mcq","topic":"design","concept":"guidelines-types","diff":"H","cat":"A","beyond":false,"q":"Which statement correctly contrasts generic and specific design guidelines?","exp":"Eight golden rules and seven principles are generic; human interface guidelines for Apple systems are specific.","tip":"Generic small; specific large.","opts":["Generic sets such as the golden rules are small and high-level; specific sets such as Apple HIG are large","Generic sets are large and detailed, written for one particular product","Specific sets are small and high-level, covering broad aspects only","Both are small, generic and not tied to any product"],"ans":[0]},{"id":"n37be6c96","sec":2,"type":"mcq","topic":"design","concept":"code-design","diff":"H","cat":"A","beyond":false,"q":"A design document lists, for each module, the data structures and algorithms to be used. This is the:","exp":"Detailed design identifies data structures and algorithms for modules.","tip":"Detailed = structures + algorithms.","opts":["interface prototype","detailed design (module-specification document)","high-level design","SRS"],"ans":[1]},{"id":"n8c7ca7e1","sec":2,"type":"mcq","topic":"norman","concept":"norman-model","diff":"H","cat":"A","beyond":false,"q":"A user sees the colour of a button change after selecting it and concludes 'the button is selected'. This corresponds to which action?","exp":"Perception is sensing the interface; interpretation makes sense of it (button changed colour = selected); evaluation compares with the goal.","tip":"Interpret = make sense.","opts":["Evaluating the outcome against the goal","Formulating the intention","Interpreting the system state","Perceiving the system state"],"ans":[2]},{"id":"n68df0a3e","sec":2,"type":"mcq","topic":"norman","concept":"norman-model","diff":"H","cat":"A","beyond":false,"q":"Comparing 'the button is selected' with the goal 'select the button' is which action of the evaluation stage?","exp":"The last evaluation action compares the interpreted state with the goal state.","tip":"Evaluate = compare with goal.","opts":["Interpretation","Perception","Execution","Evaluation"],"ans":[3]},{"id":"n0f06f82d","sec":2,"type":"mcq","topic":"norman","concept":"gulfs","diff":"H","cat":"A","beyond":false,"q":"A user wants to print two pages per sheet but cannot find any control that supports this. Which gulf is this?","exp":"The actions the user can specify do not match what the interface supports: gulf of execution.","tip":"Can't do it = execution.","opts":["Gulf of perception","Gulf of closure","Gulf of execution","Gulf of evaluation"],"ans":[2]},{"id":"nf56313c8","sec":2,"type":"mcq","topic":"norman","concept":"gulfs","diff":"H","cat":"A","beyond":false,"q":"After clicking 'Send', nothing on screen changes and the user cannot tell whether the message went. This is a gulf of:","exp":"The interface state is not perceivable or interpretable: gulf of evaluation; this is bridged by visibility (feedback).","tip":"Can't tell = evaluation.","opts":["interaction","evaluation","intention","execution"],"ans":[1]},{"id":"n4f1243c1","sec":2,"type":"mcq","topic":"norman","concept":"slips-mistakes","diff":"H","cat":"A","beyond":false,"q":"A user knows she wants to delete file A but accidentally clicks file B. This is a:","exp":"Correct goal, incorrect action = slip.","tip":"Wrong click = slip.","opts":["slip","misinterpretation of the goal","gulf of evaluation","mistake"],"ans":[0]},{"id":"nc1b0be2b","sec":2,"type":"mcq","topic":"norman","concept":"slips-mistakes","diff":"H","cat":"A","beyond":false,"q":"A user believes that dragging a file to the trash permanently archives it, and so does it to keep the file. This is a:","exp":"Wrong understanding of the system (and so a wrong goal-action plan) = mistake.","tip":"Wrong understanding = mistake.","opts":["gulf of execution only","perceptual error","slip","mistake"],"ans":[3]},{"id":"nd163dde3","sec":2,"type":"mcq","topic":"norman","concept":"prototype-types","diff":"H","cat":"A","beyond":false,"q":"A team draws all screens of a mobile app on paper but nothing works when users 'tap'. This is MOST likely a:","exp":"Paper sketches covering the whole surface without functionality = low-fidelity horizontal.","tip":"Paper + no function = low horizontal.","opts":["medium-fidelity vertical prototype","low-fidelity horizontal prototype","Wizard of Oz prototype","high-fidelity vertical prototype"],"ans":[1]},{"id":"n8fa64355","sec":2,"type":"mcq","topic":"norman","concept":"prototype-types","diff":"H","cat":"A","beyond":false,"q":"A designer wants to analyse a complete checkout interaction from first screen to the screen after payment. Which prototype is appropriate?","exp":"Vertical prototypes represent interaction by implementing selected features in depth.","tip":"Interaction = vertical.","opts":["Vertical prototype","Interface sketch only","Affinity diagram","Horizontal prototype"],"ans":[0]},{"id":"n790953b8","sec":2,"type":"mcq","topic":"norman","concept":"wizard-of-oz","diff":"H","cat":"A","beyond":false,"q":"A company wants to test whether people accept voice control but has no recogniser yet, so a hidden human types what the user says. This is:","exp":"The subject believes the computer is autonomous, but an unseen human operates it (IBM's listening typewriter, 1984).","tip":"Hidden human = Oz.","opts":["a heuristic evaluation","a vertical prototype using Tcl/Tk","a cognitive walkthrough","a Wizard of Oz experiment"],"ans":[3]},{"id":"n5b70981c","sec":2,"type":"mcq","topic":"norman","concept":"fidelity","diff":"H","cat":"A","beyond":false,"q":"Why are paper mock-ups good for early design?","exp":"Low-fidelity prototypes need no technology; rapid creation makes discarding affordable.","tip":"Paper = cheap, throwaway.","opts":["They can be evolved into the final product","They need programming expertise","They are quick and cheap to make and modify, and can be thrown away","They support real work with the system"],"ans":[2]},{"id":"n29f524ab","sec":2,"type":"mcq","topic":"eval","concept":"cognitive-walkthrough","diff":"H","cat":"A","beyond":false,"q":"Which question is typical of a cognitive walkthrough rather than a heuristic evaluation?","exp":"Cognitive walkthrough questions concern what the user will see, understand and select at each step of a task.","tip":"CW = step questions.","opts":["'Will a user see that the control produces the desired effect?'","'Are error messages in plain language?'","'Does the design follow Nielsen heuristic 4?'","'Does the system keep users informed about system status?'"],"ans":[0]},{"id":"n3c5a6ba1","sec":2,"type":"mcq","topic":"eval","concept":"cognitive-walkthrough","diff":"H","cat":"A","beyond":false,"q":"Why is a scenario-based method like cognitive walkthrough a problem for large, complex systems?","exp":"Heuristic evaluation was introduced for comprehensive evaluation of the whole system without scenarios.","tip":"Too many scenarios.","opts":["Evaluators cannot understand the written scenario descriptions","There may be too many usage scenarios to evaluate, or even to enumerate","Experts are not allowed to take part in scenario-based methods","It needs too many different prototypes to be built"],"ans":[1]},{"id":"n9a100066","sec":2,"type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"H","cat":"A","beyond":false,"q":"An evaluator notes that the app never shows 'saved successfully' or an error reason after adding an event. Which Nielsen heuristic is MOST directly violated?","exp":"The calendar case: evaluators noticed that no system state was visible when events were created or edited.","tip":"No feedback = visibility.","opts":["Match between system and the real world","Aesthetic and minimalist design","Help and documentation","Visibility of system status"],"ans":[3]},{"id":"nad4352b9","sec":2,"type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"H","cat":"A","beyond":false,"q":"A confirmation prompt appears before deleting an event. This helps with which heuristic?","exp":"The calendar design added prompts for confirmation to prevent errors.","tip":"Confirm = error prevention.","opts":["Flexibility and efficiency of use","Help and documentation","Error prevention","Consistency and standards"],"ans":[2]},{"id":"nc5a59cf0","sec":2,"type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"H","cat":"A","beyond":false,"q":"Red for delete and green for save follows which heuristic in the calendar case?","exp":"Using real-world colour conventions (red = caution, green = success) is match between system and the real world.","tip":"Colour convention = real world.","opts":["Match between system and the real world","Recognition rather than recall","Visibility of system status","Aesthetic and minimalist design"],"ans":[0]},{"id":"n411ac7d6","sec":2,"type":"mcq","topic":"eval","concept":"heuristic-eval","diff":"H","cat":"A","beyond":false,"q":"Which team arrangement is correct for an expert (cognitive walkthrough or heuristic) evaluation?","exp":"Each member produces a report of usability issues; reports are combined into a final list.","tip":"Individual reports, then merge.","opts":["Only end users, 20 or more of them, working as a group","A team of 3-5 members, each evaluating and reporting individually","One experienced evaluator is enough for any prototype","One designer plus the client reviewing together"],"ans":[1]},{"id":"nc610cd3e","sec":2,"type":"mcq","topic":"eval","concept":"sus","diff":"H","cat":"A","beyond":false,"q":"A product scores 55 on SUS. Based on the course guideline:","exp":"SUS can be read as a percentage; around 70 or higher is desirable, lower may indicate problems.","tip":"55 < 70.","opts":["It cannot be interpreted as a percentage","It is excellent because it is above the median","It is desirable because it is above 50 percent","It may indicate usability problems since 70 or above is desirable"],"ans":[3]},{"id":"n7b1175c0","sec":2,"type":"mcq","topic":"eval","concept":"sus","diff":"H","cat":"A","beyond":false,"q":"A user gives rating 4 to negatively worded statement 2 of the SUS. Its contribution is:","exp":"Negatively worded: 5 - rating = 1 (positive statements: rating - 1).","tip":"Negative: 5 - rating.","opts":["4","3","1","5"],"ans":[2]},{"id":"n9363b14f","sec":2,"type":"mcq","topic":"eval","concept":"sus","diff":"H","cat":"A","beyond":false,"q":"The sum of the ten SUS contributions is 30. The SUS score is:","exp":"Overall score = sum x 2.5 = 75.","tip":"Sum x 2.5.","opts":["75","120","60","30"],"ans":[0]},{"id":"n5ed78da8","sec":2,"type":"mcq","topic":"eval","concept":"asq","diff":"H","cat":"A","beyond":false,"q":"Why is ASQ suitable for collecting feedback after EVERY task?","exp":"Simplicity: collecting feedback multiple times needs a very short questionnaire; ASQ covers effectiveness, efficiency and satisfaction.","tip":"ASQ = short.","opts":["It has ten statements","It is short (three statements) and designed for quick feedback","It measures the whole product only","It requires an expert evaluator"],"ans":[1]},{"id":"nfb50a6c6","sec":2,"type":"mcq","topic":"eval","concept":"self-report","diff":"H","cat":"A","beyond":false,"q":"Which statement about post-task and post-session feedback is correct?","exp":"Post-session feedback shows overall perception but may not be tied to tasks or components; both points are desirable.","tip":"Task = specific; session = overall.","opts":["Only one of the two is ever useful and the other can be skipped","Post-task feedback gives the best overall perception of the system","Post-session feedback pinpoints problems for specific tasks","Post-task feedback pinpoints problems for specific tasks while users still remember them"],"ans":[3]},{"id":"n5c75f53b","sec":2,"type":"mcq","topic":"sysdesign","concept":"cohesion","diff":"H","cat":"A","beyond":false,"q":"A module contains get-input, validate-input and sort-input where each output feeds the next. Its cohesion is:","exp":"Sequential cohesion: output of one element is the input to the next.","tip":"Output -> input = sequential.","opts":["communication","temporal","sequential","logical"],"ans":[2]},{"id":"n6150ea78","sec":2,"type":"mcq","topic":"sysdesign","concept":"cohesion","diff":"H","cat":"A","beyond":false,"q":"A module groups error-handling routines for the whole program. Its cohesion is:","exp":"Logical cohesion: functions perform similar operations (e.g. error handling).","tip":"Same kind of job = logical.","opts":["logical","temporal","sequential","procedural"],"ans":[0]},{"id":"ne9df88b1","sec":2,"type":"mcq","topic":"sysdesign","concept":"cohesion","diff":"H","cat":"A","beyond":false,"q":"A set of functions all operating on one linked list belong to a module with which cohesion?","exp":"Communication cohesion: functions refer to or update the same data structure.","tip":"Same data = communication.","opts":["Temporal","Communication","Sequential","Logical"],"ans":[1]},{"id":"n317f5937","sec":2,"type":"mcq","topic":"sysdesign","concept":"coupling","diff":"H","cat":"A","beyond":false,"q":"Module A sets a flag that decides which branch module B executes. This is:","exp":"Control coupling: data from one module controls instruction flow in the other (flag setting).","tip":"Flag = control.","opts":["content coupling","data coupling","logical coupling","control coupling"],"ans":[3]},{"id":"n59cf642d","sec":2,"type":"mcq","topic":"sysdesign","concept":"coupling","diff":"H","cat":"A","beyond":false,"q":"Module A jumps into the middle of module B's code. The coupling is:","exp":"Content coupling: two modules share code (branching from one to another) - the worst form.","tip":"Shared code = content.","opts":["data","control","content","stamp"],"ans":[2]},{"id":"n762d6210","sec":2,"type":"mcq","topic":"sysdesign","concept":"dfd","diff":"H","cat":"A","beyond":false,"q":"Which DFD fragment is INCORRECT?","exp":"Data flows connect processes with entities and stores; a store cannot send data directly to an external entity (the course shows incorrect flows).","tip":"Store talks only to processes.","opts":["Data store -> process (read)","External entity -> process","Process -> data store (write)","Data store -> external entity directly"],"ans":[3]},{"id":"n05446ccd","sec":2,"type":"mcq","topic":"sysdesign","concept":"dfd","diff":"H","cat":"A","beyond":false,"q":"Why is a very large real-life system drawn as DFD levels instead of one diagram?","exp":"Decomposition: context diagram, level 1 overview, level 2 detail, etc.","tip":"Levels manage complexity.","opts":["DFD has too few symbols to show a large system","Level 0 must include every data store in the system","One diagram would be too complex to understand and modify","Levels are required by software engineering regulations"],"ans":[2]},{"id":"n3798b470","sec":2,"type":"mcq","topic":"sysdesign","concept":"er-diagram","diff":"H","cat":"A","beyond":false,"q":"In an ER diagram one customer can have several loans, but each loan belongs to at most one customer. The relationship type (customer to loan) is:","exp":"A customer is associated with several loans via borrower; a loan with at most one customer.","tip":"1 customer : N loans.","opts":["one-to-many","many-to-many","one-to-one","many-to-one"],"ans":[0]},{"id":"n3949b7f5","sec":2,"type":"mcq","topic":"sysdesign","concept":"design-approaches","diff":"H","cat":"A","beyond":false,"q":"A library system is designed as a set of services: register, issue book, check availability. This is which approach?","exp":"Functional approach: system as a provider of services represented by functions (DFD). OOD thinks of objects such as member and book register.","tip":"Services = functions.","opts":["Object-oriented","Function-oriented","User-centred only","Prototype-driven"],"ans":[1]},{"id":"n60e9d94c","sec":2,"type":"mcq","topic":"ood","concept":"class-attr-ops","diff":"H","cat":"A","beyond":false,"q":"A Circle class has radius and centre coordinates as private data and setRadius(), draw() as public members. Which are the operations?","exp":"Attributes are the data part; operations (member functions) denote behaviour and can be public or private.","tip":"Data = attributes; actions = operations.","opts":["radius and centre coordinates","setRadius() and draw()","All of them","None of them"],"ans":[1]},{"id":"n35a9fdd1","sec":2,"type":"mcq","topic":"ood","concept":"uml","diff":"H","cat":"A","beyond":false,"q":"Which statement about UML is TRUE?","exp":"UML provides notations and semantics but is not a methodology.","tip":"UML = language.","opts":["It is a language with syntax and semantics to express OO design","It is used only for function-oriented design with DFDs","It is a programming language compiled to executable code","It is a design methodology that prescribes the steps of OOD"],"ans":[0]},{"id":"nbad9db50","sec":2,"type":"mcq","topic":"ood","concept":"uml-views","diff":"H","cat":"A","beyond":false,"q":"A sequence diagram is a part of which UML view?","exp":"Behavioural: sequence, collaboration, state chart, activity. Structural: class, object.","tip":"Sequence = behaviour.","opts":["Implementation view","Behavioural view","Structural view","User view"],"ans":[1]},{"id":"nc562a08b","sec":2,"type":"mcq","topic":"ood","concept":"domain-objects","diff":"H","cat":"A","beyond":false,"q":"In a library system 'Book register' and 'Member record' are typical:","exp":"Entity objects hold information (book, book register).","tip":"Entity = information.","opts":["use cases","controller objects","entity objects","boundary objects"],"ans":[2]},{"id":"n66a3869a","sec":2,"type":"mcq","topic":"ood","concept":"ood-process","diff":"H","cat":"B","beyond":false,"q":"What is the sequence of the object-oriented design process in the course?","exp":"OOD sequence: use case analysis -> domain modelling -> sequence diagram -> structural description (classes).","tip":"UC -> domain -> sequence -> class.","opts":["Class diagram first, then use cases, then sequence diagrams","Domain modelling first, then coding, then use cases","Sequence diagrams first, then deployment, then requirements","Use case analysis, domain modelling, interaction (sequence) diagrams, class diagram"],"ans":[3]},{"id":"nea67ad9a","sec":2,"type":"mcq","topic":"ood","concept":"class-relationships","diff":"H","cat":"B","beyond":false,"q":"Ramesh borrowed the book 'Operating System'. 'Borrowed' is a:","exp":"A link is an instance of an association between two objects.","tip":"Link = instance of association.","opts":["composition","link (instance of an association)","aggregation","derived attribute"],"ans":[1]},{"id":"nf7f23399","sec":2,"type":"mcq","topic":"coding","concept":"coding-avoid","diff":"H","cat":"A","beyond":false,"q":"A programmer uses one variable 'temp' for a loop counter, then a sum, then the final answer to save memory. Which DO-NOT is violated?","exp":"Variables should have descriptive names indicating a single purpose.","tip":"One name, one purpose.","opts":["Use of lengthy functions","Missing module header","Using an identifier for multiple purposes","Using goto statements indiscriminately"],"ans":[2]},{"id":"n836deaa4","sec":2,"type":"mcq","topic":"coding","concept":"coding-avoid","diff":"H","cat":"A","beyond":false,"q":"A function called getTotal() silently writes to a file and changes a global variable. This is an example of:","exp":"Side effects: modification of parameters, global variables or I/O not obvious from the name and header.","tip":"Hidden effect = side effect.","opts":["an obscure side effect","a cohesive function","good modularity","high maintainability"],"ans":[0]},{"id":"n33f7456c","sec":2,"type":"mcq","topic":"coding","concept":"coding-standards","diff":"H","cat":"A","beyond":false,"q":"Which naming convention for variables is suggested in the course?","exp":"The module-level naming convention: globals capitalised, locals small, constants capital letters.","tip":"Global Cap; local small; CONSTANT.","opts":["Constants in lower case and locals in capitals","All names in capital letters regardless of scope","Global names in small letters only, local names in capitals","Global names start with a capital letter, locals are small letters, constants are capitals"],"ans":[3]},{"id":"ne2ba733a","sec":2,"type":"mcq","topic":"coding","concept":"review-testing","diff":"H","cat":"A","beyond":false,"q":"A team checks code against a list of commonly committed errors (uninitialised variables, non-terminating loops). This is:","exp":"Inspection checks for common errors and adherence to coding standards.","tip":"Checklist = inspection.","opts":["black-box testing","unit testing","code walkthrough","code inspection"],"ans":[3]},{"id":"n332e4824","sec":2,"type":"mcq","topic":"coding","concept":"review-testing","diff":"H","cat":"A","beyond":false,"q":"What should a code walkthrough meeting discuss?","exp":"Walkthrough guidelines: team of 3-5, representative test cases, discussion focused on discovering errors.","tip":"Find, don't fix.","opts":["Only syntax errors","Discovery of errors, not how to fix them","How to fix every error immediately","Only coding standards"],"ans":[1]},{"id":"n0580fc3a","sec":2,"type":"mcq","topic":"coding","concept":"testing-aim","diff":"H","cat":"B","beyond":false,"q":"Can testing guarantee that a software product is completely error free?","exp":"In practice it is not possible to guarantee error-free software after testing.","tip":"Testing != proof.","opts":["Yes, provided enough test cases are written for each input","Yes, if only white-box tests are used for every module","No; the input domain is too large to test exhaustively, but testing builds confidence","Yes, if the test cases are chosen at random"],"ans":[2]},{"id":"nd8fd3c18","sec":2,"type":"mcq","topic":"blackbox","concept":"test-suite","diff":"H","cat":"A","beyond":false,"q":"Consider 'if (x>y) max = x; else max = x;'. Which test suite can detect the error?","exp":"The faulty else-branch is exercised only when x <= y, so a larger suite of cases with x > y still misses it.","tip":"Cover the else branch.","opts":["(3,2) and (2,3)","(10,1),(20,2),(30,3)","(5,4),(9,1),(8,0)","(3,2),(4,3),(5,1)"],"ans":[0]},{"id":"n8af7195f","sec":2,"type":"mcq","topic":"blackbox","concept":"test-suite","diff":"H","cat":"A","beyond":false,"q":"A tester proudly runs 5000 randomly generated test cases. What does the course say about this?","exp":"Randomly selected cases need not detect additional defects.","tip":"Quality over quantity.","opts":["Random cases are best for black-box testing","Number of test cases is not an indication of testing effectiveness","It proves the software is correct","Many cases guarantee all errors are found"],"ans":[1]},{"id":"na0a8b72c","sec":2,"type":"mcq","topic":"blackbox","concept":"equivalence-class","diff":"H","cat":"A","beyond":false,"q":"For the user-authentication example (5-character alphanumeric ID), which is a sensible set of equivalence classes?","exp":"The course proposes six classes and at least six test cases.","tip":"Six classes.","opts":["Six classes: alphabetic, numeric and alphanumeric 5-char strings, longer, shorter, and special characters","One class containing every possible input string","Only the valid 5-character alphanumeric IDs, as one class","Only the longest strings accepted by the system, as one class"],"ans":[0]},{"id":"n3a3f2c1d","sec":2,"type":"mcq","topic":"blackbox","concept":"equivalence-class","diff":"H","cat":"A","beyond":false,"q":"For a program that computes the intersection of two lines (m1,c1),(m2,c2), which classes are appropriate?","exp":"Parallel (m1 = m2, c1 != c2), intersecting (m1 != m2) and coincident (m1 = m2, c1 = c2).","tip":"Parallel, intersect, coincide.","opts":["Integer and non-integer slopes","Horizontal and vertical lines","Positive and negative slopes","Parallel, intersecting and coincident lines"],"ans":[3]},{"id":"nd8b55418","sec":2,"type":"mcq","topic":"blackbox","concept":"boundary-value","diff":"H","cat":"B","beyond":false,"q":"Why do programmers often make errors at equivalence class boundaries?","exp":"Boundary value analysis selects test cases at class boundaries.","tip":"< vs <=.","opts":["Boundary values do not belong to any equivalence class at all","Boundaries are never tested because they have no values","They may use < instead of <= (or the reverse), overlooking special processing at boundaries","Boundaries need special hardware to be processed"],"ans":[2]},{"id":"nc6470da0","sec":2,"type":"mcq","topic":"blackbox","concept":"equivalence-class","diff":"H","cat":"A","beyond":false,"q":"Defining just ONE equivalence class [0, 5000] for the square-root program is poor because:","exp":"One obvious class misses invalid inputs; three classes (negative, valid, above 5000) are better.","tip":"Include invalid classes.","opts":["the class has too many values","5000 is not an integer","square roots are always real","it ignores invalid inputs such as negative numbers and numbers above 5000"],"ans":[3]},{"id":"n6cfc4ddc","sec":2,"type":"mcq","topic":"whitebox","concept":"coverage","diff":"H","cat":"B","beyond":false,"q":"Which statement is TRUE?","exp":"Branch coverage is stronger and guarantees statement coverage; condition coverage guarantees branch and statement coverage.","tip":"Branch implies statement.","opts":["Path coverage is weaker than statement coverage","Branch coverage guarantees statement coverage","Condition coverage ignores branches","Statement coverage guarantees branch coverage"],"ans":[1]},{"id":"n2af6c101","sec":2,"type":"mcq","topic":"whitebox","concept":"coverage","diff":"H","cat":"B","beyond":false,"q":"A condition ((c1 AND c2) OR c3) must be tested for condition coverage. Which is the course's rule for the number of test cases for n components?","exp":"Each component assumes both true and false values; with n components up to 2^n test cases.","tip":"2^n.","opts":["n^2","n","2^n","2n"],"ans":[2]},{"id":"n63c42fa3","sec":2,"type":"mcq","topic":"whitebox","concept":"cfg","diff":"H","cat":"A","beyond":false,"q":"A code with 2 decision statements has cyclomatic complexity (D + 1) of:","exp":"Cyclomatic complexity = D + 1 = 3 (also E - N + 2).","tip":"D + 1.","opts":["3","2","4","5"],"ans":[0]},{"id":"n466c47e7","sec":2,"type":"mcq","topic":"whitebox","concept":"cyclomatic","diff":"H","cat":"A","beyond":false,"q":"Cyclomatic complexity gives:","exp":"It is a measure of the upper bound of linearly independent paths of a CFG.","tip":"Upper bound of paths.","opts":["the execution time","an upper bound on the number of linearly independent paths","the exact number of test cases required","the number of statements"],"ans":[1]},{"id":"n2a549b20","sec":2,"type":"mcq","topic":"whitebox","concept":"system-testing","diff":"H","cat":"A","beyond":false,"q":"A group of 'friendly customers' specially recruited tests the product before release. This is:","exp":"Beta testing is done by a select group of friendly customers.","tip":"Beta = friendly customers.","opts":["beta testing","regression testing","acceptance testing","alpha testing"],"ans":[0]},{"id":"n55d12418","sec":2,"type":"mcq","topic":"whitebox","concept":"perf-testing","diff":"H","cat":"A","beyond":false,"q":"Which test evaluates system response to faults such as loss of power or services?","exp":"Recovery testing checks the response to power, device, service or data loss.","tip":"Recovery = faults.","opts":["Stress testing","Compatibility testing","Recovery testing","Volume testing"],"ans":[2]},{"id":"n5b854afb","sec":2,"type":"mcq","topic":"whitebox","concept":"integration-testing","diff":"H","cat":"B","beyond":false,"q":"Which integration approach tests each subsystem separately and then tests the full system, mainly to test interfaces?","exp":"Bottom-up testing tests subsystems first; its primary purpose is to test the interfaces. It uses driver routines.","tip":"Bottom-up = drivers.","opts":["Top-down testing","Alpha testing","Volume testing","Bottom-up testing"],"ans":[3]},{"id":"n2d787a6e","sec":2,"type":"mcq","topic":"empirical","concept":"rq-testable","diff":"H","cat":"A","beyond":false,"q":"Which research question is TESTABLE?","exp":"Testable questions are specific and measurable; vague questions have no clear observation.","tip":"Specific = testable.","opts":["Is the new technique better in some way?","Do users like the new technique?","Does the new interface let users enter text faster than MS Word?","Is our new interface good?"],"ans":[2]},{"id":"nc3068e9d","sec":2,"type":"mcq","topic":"empirical","concept":"hypothesis","diff":"H","cat":"A","beyond":false,"q":"For RQ 'Does the new interface let me enter text faster than
