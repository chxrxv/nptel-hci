Project planning estimates project size, cost, duration and effort.","ans":3},{"id":"N93","part":"B","week":0,"topic":"Project Management & Agile","stem":"Basic COCOMO estimates effort in:","opts":["days","person-months","lines of code","function points"],"x":"Effort = a x (KLoC)^a1 person-months; Tdev in months.","ans":1},{"id":"N94","part":"B","week":0,"topic":"Project Management & Agile","stem":"A typical agile iteration (sprint) lasts:","opts":["6 months","1-2 days","4-6 weeks","2 years"],"x":"The course says agile iterations are typically 4-6 weeks.","ans":2},{"id":"N95","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"A hospital app has every conceivable feature, yet nurses find it slow to learn and abandon it. Which ISO-based reasoning BEST explains why more features did not help?","opts":["Features raise satisfaction automatically","Usability requires the product to serve all users in all contexts","Utility is irrelevant to usability","Usability is about specified users, goals and context, not about adding every feature"],"x":"The ISO definition ties usability to specified users, goals and context of use; putting every feature in a product need not make it usable.","ans":3},{"id":"N96","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"A banking app lets a first-time user open an account easily but returning customers who visit only twice a year cannot remember how to transfer money. Which Nielsen component is weakest?","opts":["Memorability","Learnability","Satisfaction","Efficiency"],"x":"Intermittent users re-establishing proficiency after gaps = memorability; learnability concerns first-time basic tasks and works well here.","ans":0},{"id":"N97","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"A photo editor is pleasant, fast and easy to learn, but it lacks the crop tool most users need. Which quality attribute is deficient?","opts":["Utility","Learnability","Satisfaction","Efficiency"],"x":"Utility is the functional support for user needs (features); the other components are fine here.","ans":0},{"id":"N98","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Mapping the ISO definition to Nielsen's framework, 'effectiveness' corresponds most closely to:","opts":["learnability","memorability","utility","errors"],"x":"The course maps effectiveness to utility, leaving efficiency and satisfaction as the ISO usability measures.","ans":2},{"id":"N99","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"A team fears the client has misunderstood a key requirement and builds a quick mock-up before coding. In spiral model terms they are in the:","opts":["fourth quadrant (evaluation and planning)","first quadrant (identify objectives)","third quadrant (development)","second quadrant (risk assessment and mitigation)"],"x":"Risk of inappropriate requirement specification is reduced by building a prototype in the second quadrant.","ans":3},{"id":"N100","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"At the end of an iteration the team reviews the result with the customer and plans the next iteration around the spiral. This is the:","opts":["first quadrant","fourth quadrant","third quadrant","second quadrant"],"x":"The fourth quadrant is evaluation (with the customer) and planning.","ans":1},{"id":"N101","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"A team that keeps going back from coding to requirements after every user complaint is doing which type of iteration the course warns about?","opts":["design-prototype-evaluate loops","contextual inquiry with end users at the start","heuristic evaluation of the early prototype","loops outside design-prototype-evaluate, which should be rare"],"x":"Loops outside the early design-prototype-evaluate loop raise development cost (manpower, time, resources); iterate early where it is cheap.","ans":3},{"id":"N102","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Which team statement shows system-centred (not user-centred) thinking?","opts":["'What will our users find easy to do?'","'What are the goals of the people who will use this?'","'Let us pick the layout that is easiest to code with this toolkit.'","'Which context will the users work in?'"],"x":"System-centred design asks what is easy to build, what tools offer and what the programmer finds interesting.","ans":2},{"id":"N103","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"An app designer provides both a guided wizard and keyboard shortcuts. Which pair of generic user categories is mainly being served?","opts":["intermittent and super-knowledgeable users","novice and expert users","expert and casual users","novice and super-knowledgeable users"],"x":"Wizard/menus serve novices; shortcuts serve experts (and intermittent users in between). 'Super knowledgeable' is not a category.","ans":1},{"id":"N104","part":"B","week":0,"topic":"Usability Requirements","stem":"A designer videotapes office staff at work and reviews the recordings later without being present. This is contextual inquiry in:","opts":["passive mode","active mode","reflect mode","semi-active mode"],"x":"Passive mode: activities are recorded and reviewed later; active mode has the observer present.","ans":0},{"id":"N105","part":"B","week":0,"topic":"Usability Requirements","stem":"During an observation a user asks the researcher how to perform a task and the researcher starts teaching the correct method. What principle of CI is violated?","opts":["The observer should never ask users any clarifying question","The observer is an apprentice learning behaviour, not a teacher of users","The observer should always stay absent and rely only on recordings","The observation must stop whenever a user asks a question"],"x":"The purpose is to learn user behaviour; the observer treats users as masters.","ans":1},{"id":"N106","part":"B","week":0,"topic":"Usability Requirements","stem":"Which task belongs to the PLAN stage of contextual inquiry rather than the Initiate stage?","opts":["Sending thank-you notes","Analysing the collected data","Scripting the procedure and rehearsing it","Contacting the authorities for permission"],"x":"Plan: goals, domain knowledge, recording arrangements, users and place, scripting and rehearsal. Initiate: permission and removing anxieties.","ans":2},{"id":"N107","part":"B","week":0,"topic":"Usability Requirements","stem":"After writing observations on sticky notes and pinning them up, a team clusters similar notes. They are performing which step?","opts":["Create group headers","Display ideas","Generate ideas","Sort ideas into groups"],"x":"Step 3: sort ideas into groups; step 4 names each group with a header.","ans":3},{"id":"N108","part":"B","week":0,"topic":"Usability Requirements","stem":"The same sticky-note observations are grouped in two different ways by two teams, giving different headers. What does the course conclude?","opts":["The same observations can be grouped in different ways","Affinity diagrams are unreliable and should not be used","Headers must be identical across teams","One team must be wrong"],"x":"The lecture on the calendar case study notes that the same observations can be grouped in different ways.","ans":0},{"id":"N109","part":"B","week":0,"topic":"Usability Requirements","stem":"Which entry is a poor requirement for an SRS because it states a design/implementation choice rather than a function?","opts":["R2.1: Create Reminder - input: date, event, time","'Store the reminders using MySQL'","R3: Set Background - input: images","R1: Display Month - input: year, output: months of the year"],"x":"Choosing a database is a design decision (the calendar example); requirements state WHAT functions are needed, not how.","ans":1},{"id":"N110","part":"B","week":0,"topic":"Usability Requirements","stem":"A developer writes: 'We need to develop it for mobile platforms'. According to the course this is mainly a matter of:","opts":["feasibility","testing","functional requirement","usability requirement"],"x":"Platform and language choices relate to feasibility (or design), not requirements per se.","ans":0},{"id":"N111","part":"B","week":0,"topic":"Usability Requirements","stem":"Which requirement is MOST clearly a non-functional (quality) requirement?","opts":["'The user can create an account'","'The user can delete a note'","'The user can search notes by date'","'Searching should return results within two seconds'"],"x":"Response time is a performance-related NFR; the others are functions with inputs and outputs.","ans":3},{"id":"N112","part":"B","week":0,"topic":"Usability Requirements","stem":"Observations from CI show that students check their lecture timetable, deadlines and meetings day-wise. What did the course do with these observations?","opts":["Converted them directly into a DFD for the system","Used them only to select colours and fonts","Added new functional requirements (timetable, deadline and meeting views)","Dropped them because observations are not functional requirements"],"x":"The affinity diagram was used to frame guidelines and to add new FRs (R5.1-R5.3).","ans":2},{"id":"N113","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"A form places 'Close' and 'Start' buttons next to each other so users often cancel their work by mistake. Which golden rule is violated?","opts":["Strive for consistency","Offer error prevention and simple error handling","Design dialogues to yield closure","Reduce short-term memory load"],"x":"Error prevention: keep error rates low (e.g. do not place close and start options close to each other).","ans":1},{"id":"N114","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"A railway site forces users to remember station codes and open another page to look them up. Which TWO golden rules does the course say this violates (besides universal usability)?","opts":["Strive for consistency and permit easy reversal","Error prevention and informative feedback","Offer informative feedback and design dialogues to yield closure","Keep users in control and reduce short-term memory load"],"x":"The case study cites rules 2 (universal usability), 7 (keep users in control) and 8 (reduce short-term memory load).","ans":3},{"id":"N115","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Predictive text in the station-name field, showing station names and codes in a drop-down, mainly helps to:","opts":["add more hyperlinks to the station page","remove the need to enter a source station","reduce memory load and keep users in the same interface","enforce stricter validation of station codes"],"x":"The revised design lets the user select from predictions in the same interface instead of recalling codes or switching pages.","ans":2},{"id":"N116","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Dragging and dropping a file so the user sees the change in system state immediately mainly supports which golden rule?","opts":["Keep users in control","Reduce short-term memory load","Offer error prevention","Strive for consistency"],"x":"Rule 7: users should feel in control and perceive their interaction and the change in system state (e.g. drag and drop).","ans":0},{"id":"N117","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"A software changes the colour of a floppy-disk icon after saving a file. This applies:","opts":["informative feedback","universal usability","easy reversal of actions","error prevention"],"x":"Rule 3 example: colour change of the storage metaphor icon after the save operation.","ans":0},{"id":"N118","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Which statement correctly contrasts generic and specific design guidelines?","opts":["Generic sets such as the golden rules are small and high-level; specific sets such as Apple HIG are large","Generic sets are large and detailed, written for one particular product","Specific sets are small and high-level, covering broad aspects only","Both are small, generic and not tied to any product"],"x":"Eight golden rules and seven principles are generic; human interface guidelines for Apple systems are specific.","ans":0},{"id":"N119","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"A design document lists, for each module, the data structures and algorithms to be used. This is the:","opts":["interface prototype","detailed design (module-specification document)","high-level design","SRS"],"x":"Detailed design identifies data structures and algorithms for modules.","ans":1},{"id":"N120","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A user sees the colour of a button change after selecting it and concludes 'the button is selected'. This corresponds to which action?","opts":["Evaluating the outcome against the goal","Formulating the intention","Interpreting the system state","Perceiving the system state"],"x":"Perception is sensing the interface; interpretation makes sense of it (button changed colour = selected); evaluation compares with the goal.","ans":2},{"id":"N121","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Comparing 'the button is selected' with the goal 'select the button' is which action of the evaluation stage?","opts":["Interpretation","Perception","Execution","Evaluation"],"x":"The last evaluation action compares the interpreted state with the goal state.","ans":3},{"id":"N122","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A user wants to print two pages per sheet but cannot find any control that supports this. Which gulf is this?","opts":["Gulf of perception","Gulf of closure","Gulf of execution","Gulf of evaluation"],"x":"The actions the user can specify do not match what the interface supports: gulf of execution.","ans":2},{"id":"N123","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"After clicking 'Send', nothing on screen changes and the user cannot tell whether the message went. This is a gulf of:","opts":["interaction","evaluation","intention","execution"],"x":"The interface state is not perceivable or interpretable: gulf of evaluation; this is bridged by visibility (feedback).","ans":1},{"id":"N124","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A user knows she wants to delete file A but accidentally clicks file B. This is a:","opts":["slip","misinterpretation of the goal","gulf of evaluation","mistake"],"x":"Correct goal, incorrect action = slip.","ans":0},{"id":"N125","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A user believes that dragging a file to the trash permanently archives it, and so does it to keep the file. This is a:","opts":["gulf of execution only","perceptual error","slip","mistake"],"x":"Wrong understanding of the system (and so a wrong goal-action plan) = mistake.","ans":3},{"id":"N126","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A team draws all screens of a mobile app on paper but nothing works when users 'tap'. This is MOST likely a:","opts":["medium-fidelity vertical prototype","low-fidelity horizontal prototype","Wizard of Oz prototype","high-fidelity vertical prototype"],"x":"Paper sketches covering the whole surface without functionality = low-fidelity horizontal.","ans":1},{"id":"N127","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A designer wants to analyse a complete checkout interaction from first screen to the screen after payment. Which prototype is appropriate?","opts":["Vertical prototype","Interface sketch only","Affinity diagram","Horizontal prototype"],"x":"Vertical prototypes represent interaction by implementing selected features in depth.","ans":0},{"id":"N128","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A company wants to test whether people accept voice control but has no recogniser yet, so a hidden human types what the user says. This is:","opts":["a heuristic evaluation","a vertical prototype using Tcl/Tk","a cognitive walkthrough","a Wizard of Oz experiment"],"x":"The subject believes the computer is autonomous, but an unseen human operates it (IBM's listening typewriter, 1984).","ans":3},{"id":"N129","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Why are paper mock-ups good for early design?","opts":["They can be evolved into the final product","They need programming expertise","They are quick and cheap to make and modify, and can be thrown away","They support real work with the system"],"x":"Low-fidelity prototypes need no technology; rapid creation makes discarding affordable.","ans":2},{"id":"N130","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Which question is typical of a cognitive walkthrough rather than a heuristic evaluation?","opts":["'Will a user see that the control produces the desired effect?'","'Are error messages in plain language?'","'Does the design follow Nielsen heuristic 4?'","'Does the system keep users informed about system status?'"],"x":"Cognitive walkthrough questions concern what the user will see, understand and select at each step of a task.","ans":0},{"id":"N131","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Why is a scenario-based method like cognitive walkthrough a problem for large, complex systems?","opts":["Evaluators cannot understand the written scenario descriptions","There may be too many usage scenarios to evaluate, or even to enumerate","Experts are not allowed to take part in scenario-based methods","It needs too many different prototypes to be built"],"x":"Heuristic evaluation was introduced for comprehensive evaluation of the whole system without scenarios.","ans":1},{"id":"N132","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"An evaluator notes that the app never shows 'saved successfully' or an error reason after adding an event. Which Nielsen heuristic is MOST directly violated?","opts":["Match between system and the real world","Aesthetic and minimalist design","Help and documentation","Visibility of system status"],"x":"The calendar case: evaluators noticed that no system state was visible when events were created or edited.","ans":3},{"id":"N133","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"A confirmation prompt appears before deleting an event. This helps with which heuristic?","opts":["Flexibility and efficiency of use","Help and documentation","Error prevention","Consistency and standards"],"x":"The calendar design added prompts for confirmation to prevent errors.","ans":2},{"id":"N134","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Red for delete and green for save follows which heuristic in the calendar case?","opts":["Match between system and the real world","Recognition rather than recall","Visibility of system status","Aesthetic and minimalist design"],"x":"Using real-world colour conventions (red = caution, green = success) is match between system and the real world.","ans":0},{"id":"N135","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Which team arrangement is correct for an expert (cognitive walkthrough or heuristic) evaluation?","opts":["Only end users, 20 or more of them, working as a group","A team of 3-5 members, each evaluating and reporting individually","One experienced evaluator is enough for any prototype","One designer plus the client reviewing together"],"x":"Each member produces a report of usability issues; reports are combined into a final list.","ans":1},{"id":"N136","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"A product scores 55 on SUS. Based on the course guideline:","opts":["It cannot be interpreted as a percentage","It is excellent because it is above the median","It is desirable because it is above 50 percent","It may indicate usability problems since 70 or above is desirable"],"x":"SUS can be read as a percentage; around 70 or higher is desirable, lower may indicate problems.","ans":3},{"id":"N137","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"A user gives rating 4 to negatively worded statement 2 of the SUS. Its contribution is:","opts":["4","3","1","5"],"x":"Negatively worded: 5 - rating = 1 (positive statements: rating - 1).","ans":2},{"id":"N138","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"The sum of the ten SUS contributions is 30. The SUS score is:","opts":["75","120","60","30"],"x":"Overall score = sum x 2.5 = 75.","ans":0},{"id":"N139","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Why is ASQ suitable for collecting feedback after EVERY task?","opts":["It has ten statements","It is short (three statements) and designed for quick feedback","It measures the whole product only","It requires an expert evaluator"],"x":"Simplicity: collecting feedback multiple times needs a very short questionnaire; ASQ covers effectiveness, efficiency and satisfaction.","ans":1},{"id":"N140","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Which statement about post-task and post-session feedback is correct?","opts":["Only one of the two is ever useful and the other can be skipped","Post-task feedback gives the best overall perception of the system","Post-session feedback pinpoints problems for specific tasks","Post-task feedback pinpoints problems for specific tasks while users still remember them"],"x":"Post-session feedback shows overall perception but may not be tied to tasks or components; both points are desirable.","ans":3},{"id":"N141","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"A module contains get-input, validate-input and sort-input where each output feeds the next. Its cohesion is:","opts":["communication","temporal","sequential","logical"],"x":"Sequential cohesion: output of one element is the input to the next.","ans":2},{"id":"N142","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"A module groups error-handling routines for the whole program. Its cohesion is:","opts":["logical","temporal","sequential","procedural"],"x":"Logical cohesion: functions perform similar operations (e.g. error handling).","ans":0},{"id":"N143","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"A set of functions all operating on one linked list belong to a module with which cohesion?","opts":["Temporal","Communication","Sequential","Logical"],"x":"Communication cohesion: functions refer to or update the same data structure.","ans":1},{"id":"N144","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Module A sets a flag that decides which branch module B executes. This is:","opts":["content coupling","data coupling","logical coupling","control coupling"],"x":"Control coupling: data from one module controls instruction flow in the other (flag setting).","ans":3},{"id":"N145","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Module A jumps into the middle of module B's code. The coupling is:","opts":["data","control","content","stamp"],"x":"Content coupling: two modules share code (branching from one to another) - the worst form.","ans":2},{"id":"N146","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Which DFD fragment is INCORRECT?","opts":["Data store -> process (read)","External entity -> process","Process -> data store (write)","Data store -> external entity directly"],"x":"Data flows connect processes with entities and stores; a store cannot send data directly to an external entity (the course shows incorrect flows).","ans":3},{"id":"N147","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Why is a very large real-life system drawn as DFD levels instead of one diagram?","opts":["DFD has too few symbols to show a large system","Level 0 must include every data store in the system","One diagram would be too complex to understand and modify","Levels are required by software engineering regulations"],"x":"Decomposition: context diagram, level 1 overview, level 2 detail, etc.","ans":2},{"id":"N148","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"In an ER diagram one customer can have several loans, but each loan belongs to at most one customer. The relationship type (customer to loan) is:","opts":["one-to-many","many-to-many","one-to-one","many-to-one"],"x":"A customer is associated with several loans via borrower; a loan with at most one customer.","ans":0},{"id":"N149","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"A library system is designed as a set of services: register, issue book, check availability. This is which approach?","opts":["Object-oriented","Function-oriented","User-centred only","Prototype-driven"],"x":"Functional approach: system as a provider of services represented by functions (DFD). OOD thinks of objects such as member and book register.","ans":1},{"id":"N150","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"A Circle class has radius and centre coordinates as private data and setRadius(), draw() as public members. Which are the operations?","opts":["radius and centre coordinates","setRadius() and draw()","All of them","None of them"],"x":"Attributes are the data part; operations (member functions) denote behaviour and can be public or private.","ans":1},{"id":"N151","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"Which statement about UML is TRUE?","opts":["It is a language with syntax and semantics to express OO design","It is used only for function-oriented design with DFDs","It is a programming language compiled to executable code","It is a design methodology that prescribes the steps of OOD"],"x":"UML provides notations and semantics but is not a methodology.","ans":0},{"id":"N152","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"A sequence diagram is a part of which UML view?","opts":["Implementation view","Behavioural view","Structural view","User view"],"x":"Behavioural: sequence, collaboration, state chart, activity. Structural: class, object.","ans":1},{"id":"N153","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"In a library system 'Book register' and 'Member record' are typical:","opts":["use cases","controller objects","entity objects","boundary objects"],"x":"Entity objects hold information (book, book register).","ans":2},{"id":"N154","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"What is the sequence of the object-oriented design process in the course?","opts":["Class diagram first, then use cases, then sequence diagrams","Domain modelling first, then coding, then use cases","Sequence diagrams first, then deployment, then requirements","Use case analysis, domain modelling, interaction (sequence) diagrams, class diagram"],"x":"OOD sequence: use case analysis -> domain modelling -> sequence diagram -> structural description (classes).","ans":3},{"id":"N155","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"Ramesh borrowed the book 'Operating System'. 'Borrowed' is a:","opts":["composition","link (instance of an association)","aggregation","derived attribute"],"x":"A link is an instance of an association between two objects.","ans":1},{"id":"N156","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"A programmer uses one variable 'temp' for a loop counter, then a sum, then the final answer to save memory. Which DO-NOT is violated?","opts":["Use of lengthy functions","Missing module header","Using an identifier for multiple purposes","Using goto statements indiscriminately"],"x":"Variables should have descriptive names indicating a single purpose.","ans":2},{"id":"N157","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"A function called getTotal() silently writes to a file and changes a global variable. This is an example of:","opts":["an obscure side effect","a cohesive function","good modularity","high maintainability"],"x":"Side effects: modification of parameters, global variables or I/O not obvious from the name and header.","ans":0},{"id":"N158","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Which naming convention for variables is suggested in the course?","opts":["Constants in lower case and locals in capitals","All names in capital letters regardless of scope","Global names in small letters only, local names in capitals","Global names start with a capital letter, locals are small letters, constants are capitals"],"x":"The module-level naming convention: globals capitalised, locals small, constants capital letters.","ans":3},{"id":"N159","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"A team checks code against a list of commonly committed errors (uninitialised variables, non-terminating loops). This is:","opts":["black-box testing","unit testing","code walkthrough","code inspection"],"x":"Inspection checks for common errors and adherence to coding standards.","ans":3},{"id":"N160","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"What should a code walkthrough meeting discuss?","opts":["Only syntax errors","Discovery of errors, not how to fix them","How to fix every error immediately","Only coding standards"],"x":"Walkthrough guidelines: team of 3-5, representative test cases, discussion focused on discovering errors.","ans":1},{"id":"N161","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Can testing guarantee that a software product is completely error free?","opts":["Yes, provided enough test cases are written for each input","Yes, if only white-box tests are used for every module","No; the input domain is too large to test exhaustively, but testing builds confidence","Yes, if the test cases are chosen at random"],"x":"In practice it is not possible to guarantee error-free software after testing.","ans":2},{"id":"N162","part":"B","week":0,"topic":"Black-Box Testing","stem":"Consider 'if (x>y) max = x; else max = x;'. Which test suite can detect the error?","opts":["(3,2) and (2,3)","(10,1),(20,2),(30,3)","(5,4),(9,1),(8,0)","(3,2),(4,3),(5,1)"],"x":"The faulty else-branch is exercised only when x <= y, so a larger suite of cases with x > y still misses it.","ans":0},{"id":"N163","part":"B","week":0,"topic":"Black-Box Testing","stem":"A tester proudly runs 5000 randomly generated test cases. What does the course say about this?","opts":["Random cases are best for black-box testing","Number of test cases is not an indication of testing effectiveness","It proves the software is correct","Many cases guarantee all errors are found"],"x":"Randomly selected cases need not detect additional defects.","ans":1},{"id":"N164","part":"B","week":0,"topic":"Black-Box Testing","stem":"For the user-authentication example (5-character alphanumeric ID), which is a sensible set of equivalence classes?","opts":["Six classes: alphabetic, numeric and alphanumeric 5-char strings, longer, shorter, and special characters","One class containing every possible input string","Only the valid 5-character alphanumeric IDs, as one class","Only the longest strings accepted by the system, as one class"],"x":"The course proposes six classes and at least six test cases.","ans":0},{"id":"N165","part":"B","week":0,"topic":"Black-Box Testing","stem":"For a program that computes the intersection of two lines (m1,c1),(m2,c2), which classes are appropriate?","opts":["Integer and non-integer slopes","Horizontal and vertical lines","Positive and negative slopes","Parallel, intersecting and coincident lines"],"x":"Parallel (m1 = m2, c1 != c2), intersecting (m1 != m2) and coincident (m1 = m2, c1 = c2).","ans":3},{"id":"N166","part":"B","week":0,"topic":"Black-Box Testing","stem":"Why do programmers often make errors at equivalence class boundaries?","opts":["Boundary values do not belong to any equivalence class at all","Boundaries are never tested because they have no values","They may use < instead of <= (or the reverse), overlooking special processing at boundaries","Boundaries need special hardware to be processed"],"x":"Boundary value analysis selects test cases at class boundaries.","ans":2},{"id":"N167","part":"B","week":0,"topic":"Black-Box Testing","stem":"Defining just ONE equivalence class [0, 5000] for the square-root program is poor because:","opts":["the class has too many values","5000 is not an integer","square roots are always real","it ignores invalid inputs such as negative numbers and numbers above 5000"],"x":"One obvious class misses invalid inputs; three classes (negative, valid, above 5000) are better.","ans":3},{"id":"N168","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Which statement is TRUE?","opts":["Path coverage is weaker than statement coverage","Branch coverage guarantees statement coverage","Condition coverage ignores branches","Statement coverage guarantees branch coverage"],"x":"Branch coverage is stronger and guarantees statement coverage; condition coverage guarantees branch and statement coverage.","ans":1},{"id":"N169","part":"B","week":0,"topic":"White-Box & System Testing","stem":"A condition ((c1 AND c2) OR c3) must be tested for condition coverage. Which is the course's rule for the number of test cases for n components?","opts":["n^2","n","2^n","2n"],"x":"Each component assumes both true and false values; with n components up to 2^n test cases.","ans":2},{"id":"N170","part":"B","week":0,"topic":"White-Box & System Testing","stem":"A code with 2 decision statements has cyclomatic complexity (D + 1) of:","opts":["3","2","4","5"],"x":"Cyclomatic complexity = D + 1 = 3 (also E - N + 2).","ans":0},{"id":"N171","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Cyclomatic complexity gives:","opts":["the execution time","an upper bound on the number of linearly independent paths","the exact number of test cases required","the number of statements"],"x":"It is a measure of the upper bound of linearly independent paths of a CFG.","ans":1},{"id":"N172","part":"B","week":0,"topic":"White-Box & System Testing","stem":"A group of 'friendly customers' specially recruited tests the product before release. This is:","opts":["beta testing","regression testing","acceptance testing","alpha testing"],"x":"Beta testing is done by a select group of friendly customers.","ans":0},{"id":"N173","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Which test evaluates system response to faults such as loss of power or services?","opts":["Stress testing","Compatibility testing","Recovery testing","Volume testing"],"x":"Recovery testing checks the response to power, device, service or data loss.","ans":2},{"id":"N174","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Which integration approach tests each subsystem separately and then tests the full system, mainly to test interfaces?","opts":["Top-down testing","Alpha testing","Volume testing","Bottom-up testing"],"x":"Bottom-up testing tests subsystems first; its primary purpose is to test the interfaces. It uses driver routines.","ans":3},{"id":"N175","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Which research question is TESTABLE?","opts":["Is the new technique better in some way?","Do users like the new technique?","Does the new interface let users enter text faster than MS Word?","Is our new interface good?"],"x":"Testable questions are specific and measurable; vague questions have no clear observation.","ans":2},{"id":"N176","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"For RQ 'Does the new interface let me enter text faster than MS Word?', the null hypothesis is:","opts":["Our design is not faster than MS Word","MS Word is faster than our design","Our design is faster than MS Word","Participants like our design"],"x":"H0: no effect; H1: our design is faster. Significance testing tries to refute H0.","ans":0},{"id":"N177","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Participants type first with interface A and then with interface B, and their B typing improves because of the experience. This is an example of a:","opts":["nominal variable","dependent variable","control variable","confounding variable (practice effect)"],"x":"The practice effect varies with the test conditions systematically though we do not account for it.","ans":3},{"id":"N178","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Only male participants are used in an experiment because gender might affect speed. Gender is now a:","opts":["independent variable","control variable","dependent variable","confounding variable"],"x":"A control variable is fixed (here to male); the conclusion applies only to that group.","ans":1},{"id":"N179","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"20 participants are split into 4 groups of 5 and each group tries only 5 of the 20 interfaces. This is a:","opts":["within-subject design","pilot study","Latin square design","between-subject design"],"x":"When participants perform tasks for only a subset of test conditions, it is between-subject.","ans":3},{"id":"N180","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Why would you choose a between-subject design?","opts":["It needs fewer participants than a within-subject design","Participants may refuse or be unable to perform tasks for too many test conditions","It removes the need for tasks because groups differ","It is always easier to manage than a within-subject design"],"x":"Within-subject designs need longer involvement (and risk practice effects); between-subject needs more participants.","ans":1},{"id":"N181","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Using only a few friends of the same age and background as participants mainly affects the study by:","opts":["turning the dependent variable into a nominal variable","making the study within-subject","limiting the user profile so conclusions cannot be claimed for any user","eliminating the practice effect"],"x":"Homogeneous participants make the user profile a control variable; the conclusion applies only to similar users.","ans":2},{"id":"N182","part":"B","week":0,"topic":"Significance Tests","stem":"A researcher rejects a null hypothesis that is actually true. She has made a:","opts":["Type I error (false positive)","Gulf of evaluation","Sampling effect","Type II error (false negative)"],"x":"Type I = alpha error; type II = failing to reject a false null hypothesis (avoided by larger samples).","ans":0},{"id":"N183","part":"B","week":0,"topic":"Significance Tests","stem":"Which is NOT a condition for using a parametric test?","opts":["Data from a normally distributed population","A within-subject design","Approximately equal variance in the groups","At least an interval scale for the dependent variable"],"x":"The three conditions are normality, interval/ratio scale and equal variance; otherwise use non-parametric tests.","ans":1},{"id":"N184","part":"B","week":0,"topic":"Significance Tests","stem":"Which tests help check whether sample data come from a normally distributed population?","opts":["SUS and ASQ","Latin square and Gantt","t-test and ANOVA","Shapiro-Wilk and Kolmogorov-Smirnov"],"x":"The course names Shapiro-Wilk and Kolmogorov-Smirnov.","ans":3},{"id":"N185","part":"B","week":0,"topic":"Project Management & Agile","stem":"A project deals with a well-understood application with a small, experienced team. In basic COCOMO it is:","opts":["organic","agile","embedded","semidetached"],"x":"Organic: understood application, small experienced team (a = 2.4). Semidetached: mixed team; embedded: strongly coupled to hardware or regulations.","ans":0},{"id":"N186","part":"B","week":0,"topic":"Project Management & Agile","stem":"Software strongly coupled to complex hardware under stringent regulations is classed in basic COCOMO as:","opts":["organic","iterative","embedded","semidetached"],"x":"Embedded projects use a = 3.6, a1 = 1.2.","ans":2},{"id":"N187","part":"B","week":0,"topic":"Project Management & Agile","stem":"Which is a core reason traditional SDLCs can be problematic, as described in the course?","opts":["They cannot be made iterative in any form at all","They have no testing stage before the product is deployed","Strict requirements and heavy documentation at each stage lead to rigidity and overruns","They eliminate documentation to save time and cost"],"x":"All requirements are identified first, everything is implemented before deployment and each stage produces detailed documents.","ans":2},{"id":"N188","part":"B","week":0,"topic":"Project Management & Agile","stem":"Which practice helps agile development stay agile?","opts":["Daily meetings, live demos after each iteration and regular feedback","Avoiding stakeholder feedback until the final release","Delivering the product only at the end of the project","Freezing all the requirements at the start of the project"],"x":"Daily meetings, live demos, regular feedback sharing and openness to change.","ans":0},{"id":"N189","part":"B","week":0,"topic":"Project Management & Agile","stem":"Which chart uses boxes and arrows annotated with pessimistic, likely and optimistic estimates?","opts":["Gantt chart","PERT chart","DFD","Affinity diagram"],"x":"PERT charts: network of activities (boxes) and dependencies (arrows) with time estimates; Gantt bar length is planned duration.","ans":1},{"id":"N190","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"A usable product has to be designed for all users in all usage situations.","opts":["True","False"],"x":"Usability is defined for specified users, goals and context of use.","ans":1,"ns":true},{"id":"N191","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"In the spiral model, the third quadrant is where objectives and risks are first identified.","opts":["True","False"],"x":"The first quadrant identifies objectives and risks; the third is development.","ans":1,"ns":true},{"id":"N192","part":"B","week":0,"topic":"Usability Requirements","stem":"Usability requirements are generally treated as functional requirements that can be written as SRS functions directly.","opts":["True","False"],"x":"Usability requirements are non-functional and are difficult to specify formally; they are later converted into guidelines or functional requirements.","ans":1,"ns":true},{"id":"N193","part":"B","week":0,"topic":"Usability Requirements","stem":"During contextual inquiry the observer should teach users the correct way to perform tasks.","opts":["True","False"],"x":"The observer is an apprentice; the purpose is to learn user behaviour.","ans":1,"ns":true},{"id":"N194","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"The design-prototype-evaluate cycle primarily serves code design.","opts":["True","False"],"x":"It primarily serves interface design.","ans":1,"ns":true},{"id":"N195","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Placing 'start' and 'close' options close together is a good way to reduce errors.","opts":["True","False"],"x":"Error prevention advises keeping them apart.","ans":1,"ns":true},{"id":"N196","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"In Norman's model the first three execution actions are purely mental while the last involves motor action.","opts":["True","False"],"x":"Goal, intention and action specification are mental; execution is motor.","ans":0,"ns":true},{"id":"N197","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Cognitive walkthrough evaluators should answer each question only with 'yes' or 'no'.","opts":["True","False"],"x":"They should give detailed reports on what they felt about each question.","ans":1,"ns":true},{"id":"N198","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"A horizontal low-fidelity prototype is sufficient for heuristic evaluation.","opts":["True","False"],"x":"Unlike the walkthrough, heuristic evaluation does not need a vertical prototype.","ans":0,"ns":true},{"id":"N199","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"An SUS score of 55 percent would generally be considered desirable.","opts":["True","False"],"x":"Around 70 percent or higher is desirable.","ans":1,"ns":true},{"id":"N200","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Good modular design aims for low cohesion and high coupling.","opts":["True","False"],"x":"Aim for high cohesion and low coupling.","ans":1,"ns":true},{"id":"N201","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Data stores can create new data in a DFD.","opts":["True","False"],"x":"Only previously stored data can be read; stores cannot create data.","ans":1,"ns":true},{"id":"N202","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"UML can be used to visualise, specify, construct and document the artifacts of a software system.","opts":["True","False"],"x":"That is the course's description of UML.","ans":0,"ns":true},{"id":"N203","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"A code walkthrough team of two members is ideal.","opts":["True","False"],"x":"Ideally 3-5 members: neither too big nor too small.","ans":1,"ns":true},{"id":"N204","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Cyclomatic complexity can also be computed as D + 1 where D is the number of decision statements.","opts":["True","False"],"x":"The two methods E - N + 2 and D + 1 gave 3 in the example.","ans":0,"ns":true},{"id":"N205","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Recording typing speed in characters per minute uses a ratio scale.","opts":["True","False"],"x":"CPM is the ratio of characters typed to minutes spent.","ans":0,"ns":true},{"id":"N206","part":"B","week":0,"topic":"Significance Tests","stem":"Passing a significance test proves the null hypothesis is true.","opts":["True","False"],"x":"We try to refute (reject) the null hypothesis.","ans":1,"ns":true},{"id":"N207","part":"B","week":0,"topic":"Project Management & Agile","stem":"In a PERT chart bar length is proportional to planned duration.","opts":["True","False"],"x":"That describes a Gantt chart; PERT is a network of boxes and arrows.","ans":1,"ns":true},{"id":"N208","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Assertion (A): A calendar app with all features can still be unusable. Reason (R): Usability is defined for specified users, goals and context, not for every feature.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"x":"Adding every conceivable feature does not necessarily make a product usable.","ans":0,"ns":true},{"id":"N209","part":"B","week":0,"topic":"Usability Requirements","stem":"Assertion (A): SRS functions describe how the output is computed from the input. Reason (R): SRS functions are black boxes with defined input and output.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"x":"SRS says what is needed, not how.","ans":3,"ns":true},{"id":"N210","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Assertion (A): A user who cannot find a control to print on both sides faces a gulf of execution. Reason (R): The actions the user specifies are not supported by the interface.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"x":"Gulf of execution = mismatch between intended actions and what the interface supports.","ans":0,"ns":true},{"id":"N211","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Assertion (A): Heuristic evaluation is preferred for large systems with many usage scenarios. Reason (R): It does not need task scenarios; evaluators check the whole system against a checklist.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"x":"Scenario-based walkthroughs cannot cover all usage scenarios.","ans":0,"ns":true},{"id":"N212","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Assertion (A): The context diagram of a DFD shows all data stores. Reason (R): Data stores are shown first at level 1.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"x":"Level 0 has one process and no stores shown.","ans":3,"ns":true},{"id":"N213","part":"B","week":0,"topic":"Black-Box Testing","stem":"Assertion (A): Testing with one value of an equivalence class is as good as testing with all its values. Reason (R): The program is assumed to behave similarly for every member of the class.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"x":"Equivalence class definition.","ans":0,"ns":true},{"id":"N214","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Assertion (A): Branch coverage guarantees statement coverage. Reason (R): Covering both outcomes of every branch condition executes every statement.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"x":"Branch coverage is a stronger strategy than statement coverage.","ans":0,"ns":true},{"id":"N215","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Assertion (A): The practice effect is a confounding variable in a within-subject design. Reason (R): Participants' experience with the first interface may affect their performance with the second.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"x":"Counterbalancing (e.g. Latin Square) deals with it.","ans":0,"ns":true},{"id":"N216","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Which review-based method resembles a heuristic evaluation?","opts":["Integration testing","Black-box testing","Code walkthrough","Code inspection"],"x":"Inspection uses a checklist of common errors.","ans":3},{"id":"N217","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A user presses the wrong key although she knows exactly what she wants to do. Which concept applies?","opts":["Gulf of evaluation","Slip","Mistake","Heuristic violation"],"x":"Right goal, wrong action = slip.","ans":1},{"id":"N218","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Which information is enough to design black-box test cases?","opts":["The source code listing","The internal data structures","The control flow graph","The input domain and expected outputs"],"x":"Black-box tests use only input/output values; no knowledge of design or code is needed.","ans":3},{"id":"N219","part":"B","week":0,"topic":"White-Box & System Testing","stem":"A test suite executes every statement of a program but no test ever makes an 'if' condition false. Which stronger coverage is NOT satisfied?","opts":["Statement coverage","Branch coverage","Neither statement nor branch coverage","Both are satisfied"],"x":"Branch coverage needs both true and false outcomes for each condition; statement coverage is the weaker strategy.","ans":1},{"id":"N220","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Which question would typically be framed for a cognitive walkthrough?","opts":["Will a user see the control for a particular action?","Does the product have documentation?","Is the error message in plain language?","Is the system status always visible?"],"x":"Walkthrough questions follow the user's steps through a task (see the control, see the effect, select another control, understand feedback, error handling).","ans":0},{"id":"N221","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"The design-prototype-evaluate loop should be performed:","opts":["slowly with few iterations","only once","quickly with many iterations","only at the end of coding"],"x":"Loop refines early designs from feedback; many fast iterations are needed.","ans":2},{"id":"N222","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Data obtained by observing user behaviour in a controlled experiment is called:","opts":["reflective data","authoritative data","theoretical data","empirical data"],"x":"Observation-based data are empirical data.","ans":3},{"id":"N223","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Expert evaluation is typically used at early design stages mainly because it is:","opts":["done only by end users","quick and cheap","impossible with prototypes","slow but thorough"],"x":"Expert evaluation provides quick, cheap evaluation using at least a low-fidelity prototype.","ans":1},{"id":"N224","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Who may be on an expert evaluation team?","opts":["Only end users, because experts are not involved","A single programmer reviewing their own code","The design team or other skilled designers, optionally a few end users","Only the client who ordered the system"],"x":"The team of at least 3-5 members may be the design team or other skilled designers, optionally a few users.","ans":2},{"id":"N225","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Functional testing designs test cases using only the:","opts":["functional specification of the software","internal structure of the code","coding standards","control flow graph"],"x":"Functional (black-box) testing uses no knowledge of internal structure.","ans":0},{"id":"N226","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"In an object-oriented design of a library management system, which is a natural 'object'?","opts":["Member","Check availability","Issue book","Register"],"x":"Issue book, register and check availability are services (functions) in the functional approach; member and book register are objects.","ans":0},{"id":"N227","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Which finding is typical of a code inspection?","opts":["A request for a new feature","A user cannot find the print button","A slow network response","An uninitialised variable used in a loop"],"x":"Inspection finds common oversights (uninitialised variables, jumps into loops, non-terminating loops).","ans":3},{"id":"N228","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Why is interactive software development described as iterative?","opts":["Developers dislike documentation and want to rewrite it","User feedback must be accounted for repeatedly across stages","Code can never be compiled in a single step","Requirements never exist until the system is released"],"x":"UCD needs iteration between stages to account for user feedback.","ans":1},{"id":"N229","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"Which activity produces an SRS written in terms of objects rather than functions?","opts":["OOP","DFD","OOA","OOD"],"x":"OOA = object oriented analysis; OOD = design; OOP = programming.","ans":2},{"id":"N230","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Path coverage requires test cases that execute every:","opts":["statement once","linearly independent path at least once","boundary value","equivalence class"],"x":"A linearly independent path has at least one new edge or node not in other such paths.","ans":1},{"id":"N231","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Which life cycle model is described as a meta model that can encompass other SDLCs?","opts":["Build and fix","Waterfall","Evolutionary","Spiral"],"x":"The spiral model, with multiple iterations of four quadrants.","ans":3},{"id":"N232","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"System models are best described as:","opts":["executable code generated from the SRS","test suites used for system testing","abstract descriptions of the system being analysed","user manuals written for end users"],"x":"System models abstract the system whose requirements are being analysed.","ans":2},{"id":"N233","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Which is a prototype evaluation method rather than a requirements analysis tool?","opts":["Heuristic evaluation","Affinity diagram","SRS","Contextual inquiry"],"x":"Cognitive walkthrough and heuristic evaluation evaluate prototypes; CI and affinity diagrams belong to requirements.","ans":0},{"id":"N234","part":"B","week":0,"topic":"White-Box & System Testing","stem":"White-box testing is also known as:","opts":["usability testing","functional testing","structural testing","acceptance testing"],"x":"Structural testing designs cases using knowledge of the internal structure.","ans":2},{"id":"N235","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Why is white-box testing harder than black-box testing?","opts":["It cannot measure coverage of the code at all","It needs no test cases because the code is visible","It tests only the user interface of the product","It requires knowledge of the internal structure of the code"],"x":"White-box needs internal knowledge, program visualisation (CFG) and coverage design.","ans":3},{"id":"N236","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Black-box testing requires knowledge of the internal structure of the code.","opts":["True","False"],"x":"That is required for white-box testing.","ans":1,"ns":true}];
const L = "ABCDEF";
const app = document.getElementById("app");
Q.forEach(q => { if (!q.topic) q.topic = "General"; });

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(x => { if (x == null) return; e.append(x.nodeType ? x : document.createTextNode(String(x))); });
  return e;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function draw(...nodes) { app.replaceChildren(...nodes); window.scrollTo(0, 0); }
const ansList = q => (q.multi ? q.ans : [q.ans]);
const ansText = q => ansList(q).map(a => L[a] + ") " + q.opts[a]).join("; ");

let hist = {};
try { hist = JSON.parse(localStorage.getItem("hci_quiz_hist") || "{}"); } catch (e) {}
let sessions = [];
try { sessions = JSON.parse(localStorage.getItem("hci_quiz_sessions") || "[]"); } catch (e) {}
function saveSessions() { try { localStorage.setItem("hci_quiz_sessions", JSON.stringify(sessions)); } catch (e) {} }
function saveHist() { try { localStorage.setItem("hci_quiz_hist", JSON.stringify(hist)); } catch (e) {} }

let S = null;

/* ---------- Home ---------- */
function home() {
  if (S) clearTimeout(S.timer);
  S = null;
  const weeks = [...new Set(Q.filter(q => q.part === "A").map(q => q.week))].sort((a, b) => a - b);
  const mode = h("select", { id: "mode" },
    h("option", { value: "all" }, "Mixed mock exam - everything (" + Q.length + ")"),
    h("option", { value: "A" }, "Assignment revision - original NPTEL questions (" + Q.filter(q => q.part === "A").length + ")"),
    h("option", { value: "B" }, "Practice questions only (" + Q.filter(q => q.part === "B").length + ")"),
    h("option", { value: "weak" }, "My weak spots (questions I have missed so far)"),
    weeks.map(w => h("option", { value: "w" + w }, "Weekly practice - Week " + w + " assignment")));
  const kw = h("input", { id: "kw", placeholder: "e.g. prototype, cohesion, SUS (optional)" });
  const cnt = h("input", { id: "cnt", type: "number", min: "1", placeholder: "Leave empty for all in the selection" });
  const shuf = h("select", { id: "qorder" }, h("option", { value: "1" }, "Shuffle questions"), h("option", { value: "0" }, "Keep original order"));
  const shufO = h("select", { id: "oorder" }, h("option", { value: "1" }, "Shuffle the options for each question"), h("option", { value: "0" }, "Keep the original option order"));
  const msg = h("div", { class: "fb bad" });
  const seen = Object.keys(hist).length;
  draw(
    h("h1", {}, "HCI Quiz"),
    h("div", { class: "mute" }, "Design & Implementation of Human-Computer Interfaces. One question at a time. Right answers move on by themselves; wrong answers show the answer for 5 seconds. A checkpoint every 10 questions lets you re-ask your mistakes, and everything wrong is asked again at the end until you clear it."),
    h("div", { class: "card" },
      h("label", { for: "mode" }, "Mode"), mode,
      h("label", { for: "kw" }, "Topic keyword filter"), kw,
      h("label", { for: "cnt" }, "Number of questions"), cnt,
      h("label", { for: "qorder" }, "Question order"), shuf,
      h("label", { for: "oorder" }, "Option order"), shufO,
      h("button", { class: "main", onclick: () => {
        let pool = Q;
        const m = mode.value;
        if (m === "A" || m === "B") pool = Q.filter(q => q.part === m);
        else if (m === "weak") {
          const wk = Q.filter(q => hist[q.id] && hist[q.id].wrong > 0);
          pool = wk.sort((a, b) => ((hist[b.id] || {}).wrong || 0) - ((hist[a.id] || {}).wrong || 0));
        } else if (m[0] === "w") pool = Q.filter(q => q.part === "A" && q.week === +m.slice(1));
        const k = kw.value.trim().toLowerCase();
        if (k) pool = pool.filter(q => (q.stem + " " + q.topic + " " + q.opts.join(" ")).toLowerCase().includes(k));
        if (!pool.length) { msg.textContent = "No questions match. Change the mode or keyword."; return; }
        if (shuf.value === "1") pool = shuffle(pool);
        const n = parseInt(cnt.value, 10);
        if (n > 0) pool = pool.slice(0, n);
        start(pool, mode.selectedOptions[0].text, shufO.value === "1");
      } }, "Start quiz"),
      msg),
    mistakesCard(),
    h("div", { class: "mute" }, seen ? "Saved on this device: " + seen + " questions attempted so far." : "Progress is saved on this device only."),
    seen ? h("button", { class: "main alt", onclick: ev => { const b = ev.currentTarget; if (b.dataset.arm) { hist = {}; sessions = []; saveHist(); saveSessions(); home(); } else { b.dataset.arm = "1"; b.textContent = "Tap again to clear all history"; } } }, "Clear history") : null
  );
}

/* ---------- My mistakes ---------- */
function mistakesCard() {
  const ever = Q.filter(q => hist[q.id] && hist[q.id].wrong > 0);
  const byId = Object.fromEntries(Q.map(q => [q.id, q]));
  return h("div", { class: "card" },
    h("h2", {}, "My mistakes"),
    h("div", { class: "mute" }, ever.length ? "Every question you have ever got wrong is saved here, even after you clear it in a retry round." : "Nothing yet. Questions you get wrong will be saved here."),
    ever.length ? h("button", { class: "main", onclick: () => viewMistakes(ever, "All questions I have missed") }, "View all my mistakes (" + ever.length + ")") : null,
    ever.some(q => q.part === "A") ? h("button", { class: "main alt", onclick: () => viewMistakes(ever.filter(q => q.part === "A"), "NPTEL questions I have missed") }, "NPTEL mistakes (" + ever.filter(q => q.part === "A").length + ")") : null,
    ever.some(q => q.part === "B") ? h("button", { class: "main alt", onclick: () => viewMistakes(ever.filter(q => q.part === "B"), "Practice questions I have missed") }, "Practice mistakes (" + ever.filter(q => q.part === "B").length + ")") : null,
    ever.length ? h("button", { class: "main alt", onclick: () => start(shuffle(ever), "My mistakes") }, "Practice my mistakes") : null,
    sessions.length ? h("h2", {}, "Past attempts") : null,
    sessions.slice(0, 10).map(x => h("div", { class: "wrongitem" },
      h("div", {}, new Date(x.t).toLocaleString() + " - " + x.mode),
      h("div", { class: "tag" }, "First attempt " + x.score + "/" + x.total + " - " + x.missed.length + " wrong"),
      x.missed.length ? h("button", { class: "main alt", onclick: () => viewMistakes(x.missed.map(id => byId[id]).filter(Boolean), "Mistakes from " + new Date(x.t).toLocaleString()) }, "View these mistakes") : null))
  );
}
function viewMistakes(list, title) {
  draw(
    h("h1", {}, title),
    h("div", { class: "mute" }, list.length + " question" + (list.length === 1 ? "" : "s")),
    h("div", {},
      h("button", { class: "main", onclick: () => start(shuffle(list), "Practice mistakes") }, "Practice these"),
      h("button", { class: "main alt", onclick: () => window.print() }, "Print / save as PDF"),
      h("button", { class: "main alt", onclick: home }, "Back")),
    h("div", { class: "card" }, listWrong(list, true))
  );
}

/* ---------- Quiz flow ---------- */
function start(pool, label, shufOpts) {
  S = { label: label || "Quiz", shufOpts: shufOpts !== false, queue: pool.slice(), i: 0, score: 0, wrong: [], round: 1, answered: false,
        first: null, missCount: {}, firstWrongIds: [], chkScore: 0, chkCount: 0, blockWrong: [], chkWrongTopics: {}, sel: new Set() };
  showQ();
}
const realCount = () => S.queue.filter(q => !q.redo).length;
function showQ() {
  const q = S.queue[S.i]; S.answered = false; S.sel = new Set();
  const n = S.queue.length;
  const fb = h("div", {});
  const nextBox = h("div", {});
  const idx = q.opts.map((_, i) => i);
  S.order = (S.shufOpts && !q.ns) ? shuffle(idx) : idx;
  const opts = S.order.map((oi, k) => h("button", { class: "opt", onclick: () => (q.multi ? toggle(k) : pick(k)) }, h("b", {}, L[k] + ")"), h("span", {}, q.opts[oi])));
  S.ui = { opts, fb, nextBox };
  if (q.multi) {
    nextBox.append(h("div", { class: "note" }, "Multiple answers: select ALL that are correct, then press Check answer."),
      h("button", { class: "main", onclick: checkMulti }, "Check answer"));
  }
  const done = S.queue.slice(0, S.i).filter(x => !x.redo).length;
  draw(
    h("div", { class: "top" }, h("span", {}, (S.round === 1 ? "Round 1" : "Retry round " + (S.round - 1)) + " - Question " + (S.i + 1) + " of " + n), h("span", {}, "Score " + S.score + "/" + done)),
    h("div", { class: "bar" }, h("i", { style: "width:" + (S.i / n * 100) + "%" })),
    h("div", { class: "card" },
      h("span", { class: "chip" }, q.redo ? "Re-asking" : (q.part === "A" ? "NPTEL" : "Practice")), h("span", { class: "chip" }, q.id), h("span", { class: "chip" }, q.topic), q.multi ? h("span", { class: "chip" }, "Select all that apply") : null,
      h("div", { class: "stem" }, q.stem),
      q.img ? h("img", { src: "data:image/png;base64," + q.img, style: "max-width:100%;background:#fff;border-radius:8px;margin:0 0 10px" }) : null,
      opts, fb, nextBox),
    h("button", { class: "main alt", onclick: () => { if (confirm("Quit this quiz?")) home(); } }, "Quit")
  );
}
function toggle(k) {
  if (S.answered) return;
  const b = S.ui.opts[k];
  if (S.sel.has(k)) { S.sel.delete(k); b.classList.remove("sel"); } else { S.sel.add(k); b.classList.add("sel"); }
}
function checkMulti() {
  if (S.answered || !S.sel.size) return;
  const q = S.queue[S.i];
  const right = q.ans.map(a => S.order.indexOf(a)).sort((a, b) => a - b);
  const picked = [...S.sel].sort((a, b) => a - b);
  finishAnswer(right.length === picked.length && right.every((v, i) => v === picked[i]), right, picked);
}
function pick(k) {
  if (S.answered) return;
  const q = S.queue[S.i], right = S.order.indexOf(q.ans);
  finishAnswer(S.order[k] === q.ans, [right], [k]);
}
function finishAnswer(ok, right, picked) {
  S.answered = true;
  const q = S.queue[S.i];
  S.ui.opts.forEach((b, j) => { b.disabled = true; b.classList.remove("sel"); if (right.includes(j)) b.classList.add("ok"); else if (picked.includes(j)) b.classList.add("bad"); });
  S.ui.nextBox.replaceChildren();
  if (!q.redo) {
    hist[q.id] = hist[q.id] || { seen: 0, wrong: 0 };
    hist[q.id].seen++;
    S.chkCount++;
    if (ok) { S.score++; S.chkScore++; }
    else {
      S.wrong.push(q); hist[q.id].wrong++; S.blockWrong.push(q);
      S.missCount[q.id] = (S.missCount[q.id] || 0) + 1;
      S.chkWrongTopics[q.topic] = (S.chkWrongTopics[q.topic] || 0) + 1;
    }
    saveHist();
  } else if (!ok) {
    S.queue.splice(Math.min(S.queue.length, S.i + 3), 0, Object.assign({}, q));
  }
  const gotRight = picked.filter(j => right.includes(j)).length;
  if (ok) { S.ui.fb.className = "fb ok"; S.ui.fb.textContent = "Correct"; }
  else if (q.multi && gotRight > 0) { S.ui.fb.className = "fb part"; S.ui.fb.textContent = "Partially right - you chose " + gotRight + " of " + right.length + " correct option" + (right.length > 1 ? "s" : "") + (picked.length > gotRight ? " and " + (picked.length - gotRight) + " incorrect one" + (picked.length - gotRight > 1 ? "s" : "") : "") + ". Correct answer: " + right.map(j => L[j] + ") " + q.opts[S.order[j]]).join("; ") + "  (Enter to skip ahead)"; }
  else { S.ui.fb.className = "fb bad"; S.ui.fb.textContent = "Wrong. Correct answer: " + right.map(j => L[j] + ") " + q.opts[S.order[j]]).join("; ") + "  (Enter to skip ahead)"; }
  if (q.x) S.ui.fb.append(h("div", { class: "exp" }, q.x));
  if (q.inf) S.ui.fb.append(h("div", { class: "tag" }, "(Answer inferred by me - the portal showed no accepted answer for this one.)"));
  S.timer = setTimeout(next, ok ? 300 : 5000);
}
function next() {
  clearTimeout(S.timer);
  advance();
}
function advance() {
  const q = S.queue[S.i];
  const last = S.i === S.queue.length - 1;
  if (!last && S.chkCount >= 10 && !q.redo) return checkpoint();
  if (last) return endRound();
  S.i++; showQ();
}
function checkpoint() {
  const weak = Object.entries(S.chkWrongTopics).sort((a, b) => b[1] - a[1]).slice(0, 4).map(e => e[0] + " (" + e[1] + ")");
  const bad = S.blockWrong.slice();
  const cont = () => { S.chkScore = 0; S.chkCount = 0; S.blockWrong = []; S.chkWrongTopics = {}; S.i++; showQ(); };
  draw(
    h("h1", {}, "Checkpoint"),
    h("div", { class: "card" },
      h("div", { class: "big" }, S.chkScore + "/10"),
      h("div", {}, "Last 10 questions. Overall " + S.score + "/" + S.queue.slice(0, S.i + 1).filter(x => !x.redo).length + "."),
      h("div", { class: "mute" }, weak.length ? "Weak areas in this block: " + weak.join(", ") : "No mistakes in this block."),
      bad.length ? h("button", { class: "main", onclick: () => {
        // re-ask this block's mistakes right now, repeating until each is answered correctly
        const redo = shuffle(bad).map(q => Object.assign({}, q, { redo: true }));
        S.queue.splice(S.i + 1, 0, ...redo);
        cont();
      } }, "Re-ask my " + bad.length + " mistake" + (bad.length > 1 ? "s" : "") + " now") : null,
      h("button", { class: bad.length ? "main alt" : "main", onclick: cont }, "Continue")),
    bad.length ? h("div", { class: "card" }, h("h2", {}, "Mistakes in this block"), listWrong(bad)) : null
  );
}
function listWrong(arr, counts) {
  return arr.map(q => h("div", { class: "wrongitem" },
    h("div", { class: "tag" }, (q.part === "A" ? "NPTEL " : "Practice ") + q.id + " - " + q.topic + (counts && hist[q.id] ? " - missed " + hist[q.id].wrong + "x" : "")),
    h("div", {}, q.stem),
    h("div", {}, ...(q.opts.map((o, k) => h("div", { class: "tag" }, L[k] + ") " + o)))),
    h("div", { class: "ans" }, "Answer: " + ansText(q)),
    q.x ? h("div", { class: "exp" }, q.x) : null));
}
function endRound() {
  const n = realCount();
  if (S.round === 1) {
    S.first = { score: S.score, total: n }; S.firstWrongIds = S.wrong.map(q => q.id);
    sessions.unshift({ t: Date.now(), mode: S.label, score: S.score, total: n, missed: S.firstWrongIds });
    sessions = sessions.slice(0, 40); saveSessions();
  }
  if (!S.wrong.length) return finish();
  const wrongNow = S.wrong;
  draw(
    h("h1", {}, S.round === 1 ? "Round complete" : "Retry round complete"),
    h("div", { class: "card" },
      h("div", { class: "big" }, S.score + "/" + n),
      h("div", {}, wrongNow.length + " wrong. Review them, then I will ask only these again."),
      h("button", { class: "main", onclick: () => {
        S.queue = shuffle(wrongNow); S.wrong = []; S.i = 0; S.score = 0; S.round++; S.chkScore = 0; S.chkCount = 0; S.blockWrong = []; S.chkWrongTopics = {};
        showQ();
      } }, "Re-ask the " + wrongNow.length + " wrong ones")),
    h("div", { class: "card" }, h("h2", {}, "Questions you got wrong"), listWrong(wrongNow))
  );
}
function finish() {
  const byId = Object.fromEntries(Q.map(q => [q.id, q]));
  const missed = Object.entries(S.missCount).sort((a, b) => b[1] - a[1]).map(e => ({ q: byId[e[0]], c: e[1] }));
  const topics = {};
  missed.forEach(m => topics[m.q.topic] = (topics[m.q.topic] || 0) + m.c);
  const topicList = Object.entries(topics).sort((a, b) => b[1] - a[1]);
  const pct = Math.round(S.first.score / S.first.total * 100);
  draw(
    h("h1", {}, "Quiz finished"),
    h("div", { class: "card" },
      h("div", { class: "big" }, S.first.score + "/" + S.first.total + " (" + pct + "%)"),
      h("div", {}, "First-attempt score. " + (S.round > 1 ? "You cleared every mistake after " + (S.round - 1) + " retry round" + (S.round > 2 ? "s" : "") + "." : "No mistakes this time.")),
      h("button", { class: "main", onclick: home }, "Back to start"),
      h("button", { class: "main alt", onclick: () => window.print() }, "Print / save as PDF"),
      missed.length ? h("button", { class: "main alt", onclick: () => start(shuffle(missed.map(m => m.q)), "Drill my mistakes") }, "Drill all my mistakes again") : null),
    topicList.length ? h("div", { class: "card" }, h("h2", {}, "Revision list - topics to revisit"),
      topicList.map(t => h("div", {}, t[0] + " - missed " + t[1] + " time" + (t[1] > 1 ? "s" : "")))) : null,
    missed.length ? h("div", { class: "card" }, h("h2", {}, "Every question you missed"),
      listWrong(missed.map(m => m.q))) : null
  );
}

document.addEventListener("keydown", e => {
  if (!S || !S.ui || !document.body.contains(S.ui.nextBox)) return;
  const k = e.key.toLowerCase();
  const q = S.queue[S.i];
  if (!S.answered) {
    const idx = "abcdef".indexOf(k) >= 0 ? "abcdef".indexOf(k) : "123456".indexOf(k);
    if (idx >= 0 && idx < q.opts.length) { if (q.multi) toggle(idx); else pick(idx); }
    else if (q.multi && k === "enter") checkMulti();
  } else if (k === "enter" || k === " ") { e.preventDefault(); next(); }
});

home();

</script>
</body>
