<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCI Quiz</title>
<style>

:root{--bg:#f4f5f8;--card:#fff;--ink:#16181d;--mute:#5d6572;--line:#d8dce3;--acc:#2f5fd0;--accbg:#e8eefc;--ok:#146c43;--okbg:#e1f4e9;--bad:#b3261e;--badbg:#fbe6e4}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1c1f25;--ink:#eceef2;--mute:#9aa2ae;--line:#343a45;--acc:#8aabff;--accbg:#232c45;--ok:#62d69c;--okbg:#14382a;--bad:#ff8f86;--badbg:#44211f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}h2{font-size:1.15rem;margin:18px 0 8px}
.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--acc)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--mute)}
.chip{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);margin:0 6px 8px 0}
.stem{font-size:1.1rem;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt b{min-width:1.4em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
button.main{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;margin:6px 8px 6px 0}
@media (prefers-color-scheme:dark){button.main{color:#10131a}}
button.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
select,input{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px;width:100%;margin:4px 0 12px}
label{font-size:.9rem;color:var(--mute)}
.fb{margin-top:10px;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.big{font-size:2.4rem;font-weight:700;margin:4px 0}
.wrongitem{border-top:1px solid var(--line);padding:10px 0}
.wrongitem:first-child{border-top:0}
.wrongitem .ans{color:var(--ok);font-weight:600}
.tag{font-size:.8rem;color:var(--mute)}
@media print{button,.top,.bar{display:none!important}body{background:#fff;color:#000}.card{border:0}}
.opt.sel{border-color:var(--acc);background:var(--accbg)}.note{font-size:.85rem;color:var(--mute);margin:6px 0}.fb.part{color:#c98a00}.exp{margin-top:8px;font-size:.92rem;color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q = [{"id":"W1Q1","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"While we talk about the evaluation phases of the computer, ______ is called the modern age of computers.","opts":["1985 onwards","1998 onwards","2007 onwards","2011 onwards"],"x":"The course describes the modern age of computing as 2011 onwards - the era of interconnected devices (ubiquitous computing, IoT, cyber-physical systems). 1985 falls in the early phase; the pre-modern phase is late 1990s to the first decade of the 2000s.","ans":3},{"id":"W1Q2","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"Which among the following is NOT a generic category of users?","opts":["Novice","Super knowledgeable","Intermittent","Expert"],"x":"The generic categories of users are novice, intermittent and expert. 'Super knowledgeable' is not a category.","ans":1},{"id":"W1Q3","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"In the Spiral Model, why is the second quadrant crucial for interactive software development?","opts":["It defines the UI layout","It finalizes the system architecture","It identifies and mitigates usability risks via prototyping","It handles testing and deployment"],"x":"In the spiral model the second quadrant is risk assessment and mitigation; for interactive software, usability risks (e.g. a wrongly understood requirement) are mitigated by building a prototype. The UI layout, architecture and testing belong to other activities.","ans":2},{"id":"W1Q4","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"What does the term 'utility' refer to in the context of usability?","opts":["Speed of task completion","Visual appeal of the design","Functional support for user needs","Frequency of feature updates"],"x":"Utility is the functionality the design is meant to serve: the extent to which it supports users' functional needs (features). Speed is efficiency; visual appeal and update frequency are not what utility means.","ans":2},{"id":"W1Q5","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"Which one of the following is NOT a computer?","opts":["Desktop","Digital Pedometer","Smartphone","None of the above"],"x":"By the Oxford definition anything that receives data, follows stored instructions and produces a result is a computer - desktops, smartphones and even a digital pedometer qualify. So none of the listed devices is a non-computer.","ans":3},{"id":"W1Q6","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"Interactive software development is _______ in nature.","opts":["sporadic","iterative","variable","discrete"],"x":"Interactive software development is iterative: design-prototype-evaluate cycles repeat with user feedback until usability is acceptable.","ans":1},{"id":"W1Q7","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"Which of the following is NOT one of the five quality components of usability proposed by Jacob Nielsen?","opts":["Learnability","Efficiency","Satisfaction","Memorization"],"x":"Nielsen's five usability components are learnability, efficiency, memorability, errors and satisfaction. 'Memorization' is not one of them (memorability is). Note: you answered this wrongly on the portal - watch the spelling trap.","ans":3},{"id":"W1Q8","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"Which of the following is NOT a characteristic of the Waterfall model?","opts":["Feasibility study","Learnability study","System integration and testing","Maintenance"],"x":"The classical waterfall model has feasibility study, requirement gathering and specification, system design, coding and unit testing, integration and system testing, deployment and maintenance. A 'learnability study' is not a stage.","ans":1},{"id":"W1Q9","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"‘Identify objectives’ and ‘customer evaluation and planning’ is in the ______ and ______ quadrant of the spiral model respectively.","opts":["First, Fourth","Second, Third","Third, Fourth","Fourth, Second"],"x":"Spiral quadrants: 1st identify objectives and risks; 2nd risk assessment and mitigation; 3rd development; 4th evaluation (with the customer) and planning of the next iteration. So 'identify objectives' = first and 'customer evaluation and planning' = fourth.","ans":0},{"id":"W1Q10","part":"A","week":1,"topic":"Interactive Systems & Usability","stem":"Which design approach focuses on what a programmer finds interesting to build?","opts":["System-Centered Design","User-Centered Design","Utility-Based Design","Participatory Design"],"x":"System-centred design asks what the programmer can easily build, what tools offer and what the programmer finds interesting. User-centred design is based on user abilities, context and goals.","ans":0},{"id":"W2Q1","part":"A","week":2,"topic":"Usability Requirements","stem":"Contextual inquiry is also known as _______.","opts":["Interview","Observation","Semi-structured interview"],"x":"Contextual inquiry is often described as a semi-structured interview process: it combines interview and observation of users in their natural work setting.","ans":2},{"id":"W2Q2","part":"A","week":2,"topic":"Usability Requirements","stem":"In SRS, functions are not represented as","opts":["Function name","Input","Output","Description","Motivation"],"x":"In an SRS each function is represented by a name, input, output and an optional description. 'Motivation' is not part of the notation.","ans":4},{"id":"W2Q3","part":"A","week":2,"topic":"Usability Requirements","stem":"Contextual inquiry can be done in _______ and passive mode.","opts":["active","semi-active","neutral"],"x":"Contextual inquiry can be done in active mode (observer physically present) or passive mode (user activity recorded or videotaped and reviewed later).","ans":0},{"id":"W2Q4","part":"A","week":2,"topic":"Usability Requirements","stem":"There are _______ stages in contextual inquiry.","opts":["two","five","six","eight"],"x":"Contextual inquiry has five stages: plan, initiate, execute, close and reflect.","ans":1},{"id":"W2Q5","part":"A","week":2,"topic":"Usability Requirements","stem":"Which stage in the Contextual Inquiry process involves arranging for recording observations and scripting the procedure?","opts":["Plan Stage","Initiate Stage","Execute Stage","Reflect Stage"],"x":"The Plan stage includes identifying goals, gathering domain knowledge, arranging for recording observations, identifying users, date, time and place, and scripting and rehearsing the procedure.","ans":0},{"id":"W2Q6","part":"A","week":2,"topic":"Usability Requirements","stem":"Affinity diagram method consists of _______ steps.","opts":["Three","Two","Six","Five"],"x":"The affinity diagram method has five steps: generate ideas, display ideas, sort ideas into groups, create group headers, draw the finished diagram.","ans":3},{"id":"W2Q7","part":"A","week":2,"topic":"Usability Requirements","stem":"Usability requirements is one type of ______.","opts":["Functional Requirement","Non-functional requirement"],"x":"Usability is a non-functional requirement: a quality attribute that cannot be expressed as a function.","ans":1},{"id":"W2Q8","part":"A","week":2,"topic":"Usability Requirements","stem":"What is the primary objective of Contextual Inquiry?","opts":["To watch and observe users perform tasks in their natural work setting","To conduct semi-structured interviews with users","To develop design recommendations","To study user behavior using physical note-taking"],"x":"The primary objective of CI is to watch and observe users perform tasks in their natural work setting (the work context).","ans":0},{"id":"W2Q9","part":"A","week":2,"topic":"Usability Requirements","stem":"What is the purpose of the \"Reflect\" stage in the Contextual Inquiry process?","opts":["To contact the authorities for permission","To analyze the data collected and identify design goals","To script the procedure and rehearse for observations"],"x":"The Reflect stage analyses the collected data to identify design goals, often with the help of tools like the affinity diagram method.","ans":1},{"id":"W2Q10","part":"A","week":2,"topic":"Usability Requirements","stem":"How long does the Contextual Inquiry process typically continue?","opts":["One to two weeks","One to two hours","One to two months"],"x":"A contextual inquiry session usually continues for one to two hours.","ans":1},{"id":"W3Q1","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"In SRS document the functions should describe HOW to get the output from the given input.","opts":["True","False"],"x":"False. SRS functions are black boxes that say WHAT is needed (input, output, purpose), not HOW the output is obtained from the input.","ans":1,"ns":true},{"id":"W3Q2","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"We can also add new functional requirements based on the observations made in contextual inquiry.","opts":["True","False"],"x":"True. The affinity diagram from contextual inquiry can be used to frame guidelines and to add new functional requirements (e.g. day-wise timetable, deadline and meeting views).","ans":0,"ns":true},{"id":"W3Q3","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"In user-centered design, we have two concerns: Interface design and __________","opts":["Machine design","Hardware design","Code design","System design"],"x":"In user-centred design there are two design concerns: interface design and code design.","ans":2},{"id":"W3Q4","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"The design-prototype-evaluate cycle primarily caters to ______ design.","opts":["Interface","Code","System"],"x":"The design-prototype-evaluate cycle primarily serves interface design; code design starts once the interface design has stabilised.","ans":0},{"id":"W3Q5","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"Code design can be expressed in natural languages, semi-formal languages and _________.","opts":["Informal languages","Formal languages","Context sensitive languages"],"x":"Code design can be expressed in natural languages, semi-formal languages and formal languages.","ans":1},{"id":"W3Q6","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"DFD is a _______ code design language.","opts":["Natural","Semi-formal","Informal","Context sensitive"],"x":"DFD (and UML) are semi-formal, graphical code design languages.","ans":1},{"id":"W3Q7","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"Shneiderman proposed ____ rules that covers broad aspects of interactive systems.","opts":["Five","Seven","Eight","Nine"],"x":"Shneiderman's (1986) set has eight golden rules.","ans":2},{"id":"W3Q8","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"“The interface should not force users to remember too many things” – this statement falls under “_______”, one of the golden rules proposed by Shneiderman.","opts":["Strive for consistency","Permit easy reversal of actions","Reduce short-term memory load","Keep users in control"],"x":"Reducing short-term memory load (the 7+-2 rule of Miller) means not forcing users to remember too many things.","ans":2},{"id":"W3Q9","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"Human interface guidelines for the apple systems are the ________ design guidelines.","opts":["Generic","Specific"],"x":"Human interface guidelines for Apple systems are detailed and product-specific, hence specific guidelines. Shneiderman's rules and Norman's principles are generic.","ans":1},{"id":"W3Q10","part":"A","week":3,"topic":"Interface & Code Design Guidelines","stem":"Identification of data structures and algorithms for different modules is done on the ____________ phase of code design.","opts":["Preliminary (high-level design)","Detailed design"],"x":"Code design has two phases: preliminary (high-level) design - modules, control relationships, interfaces - and detailed design - data structures and algorithms for modules.","ans":1},{"id":"W4Q1","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"Norman’s Model of Interaction represents behavior of a user of interactive systems in terms of a series of _________.","opts":["actions","selection","manipulation"],"x":"Norman's model represents user behaviour as a series of actions (seven actions grouped into execution and evaluation).","ans":0},{"id":"W4Q2","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"There are broadly two stages of interaction execution stage and ________ stage.","opts":["design","evaluation","interaction"],"x":"The two broad stages of interaction are the execution stage and the evaluation stage.","ans":1},{"id":"W4Q3","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"Perceive system state comes under the _______ stage of interaction.","opts":["execution","design","evaluation","interaction"],"x":"Perceiving the system state is the first action of the evaluation stage (then interpret, then evaluate against the goal).","ans":2},{"id":"W4Q4","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"Actions we specify to translate intentions may not be supported by the interface leading to gap (gulf) between the first three and the last actions in the execution stage- It is called _______.","opts":["The gulf of execution","The gulf of evaluation","The gulf of Interaction"],"x":"When the actions we can specify do not match what the interface supports, the gap is the gulf of execution. The gulf of evaluation is when our interpretation of the interface state does not match the actual state.","ans":0},{"id":"W4Q5","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"Particularly in the context of errors during interaction is explained in terms of slips and ______.","opts":["error","mistakes","human error"],"x":"Errors during interaction are explained as slips (right goal, wrong action) and mistakes (wrong goal or wrong understanding).","ans":1},{"id":"W4Q6","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"In a vertical prototype, the entire interface is depicted at the surface level without any functionality.","opts":["True","False"],"x":"False. The description (entire interface at surface level without functionality) fits a HORIZONTAL prototype; a vertical prototype implements a few features in depth.","ans":1,"ns":true},{"id":"W4Q7","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"Paper mock-ups are the example of __________ prototype.","opts":["Low fidelity","High fidelity","Medium fidelity"],"x":"Paper mock-ups need no technology and are quick and cheap: low-fidelity prototypes.","ans":0},{"id":"W4Q8","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"There is a requirement of 3-5 member team for the cognitive walkthrough.","opts":["True","False"],"x":"True. Expert evaluations such as the cognitive walkthrough use a team of at least 3-5 members.","ans":0,"ns":true},{"id":"W4Q9","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"In a cognitive walkthrough evaluation, evaluators re expected to answer the questions only in “yes” or “no”","opts":["True","False"],"x":"False. Evaluators are not expected to answer only yes or no; they should give a detailed report on what they felt about each question.","ans":1,"ns":true},{"id":"W4Q10","part":"A","week":4,"topic":"Norman's Model & Prototyping","stem":"In this technique, a human subject believes to interact with an autonomous computer. But, In reality, however, the computer is operated by an “unseen” human being. This technique is called________ approach.","opts":["Medium fidelity","Vertical","Wizard of Oz","Incremental"],"x":"In the Wizard of Oz technique a subject believes they interact with an autonomous computer while an unseen human (the wizard) operates it (e.g. IBM's 1984 listening typewriter).","ans":3},{"id":"W5Q1","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"How do we evaluate an interface?","opts":["by evaluating satisfaction","by evaluating memorability","by evaluating usability"],"x":"An interface is evaluated by evaluating its usability.","ans":2},{"id":"W5Q2","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"We need to frame a set of questions (usability issues) for the evaluators before performing a cognitive walkthrough","opts":["True","False"],"x":"True. Before a cognitive walkthrough a set of questions (usability issues) must be framed; evaluators report on them while performing the tasks.","ans":0,"ns":true},{"id":"W5Q3","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"In a heuristic evaluation, the items in the checklist are called __________","opts":["checkbox","heuristics","usability issues","problems"],"x":"In heuristic evaluation the checklist items are called heuristics (Nielsen's 10 heuristics are popular).","ans":1},{"id":"W5Q4","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"There are many ways of collecting user feedback in evaluation with self report methods: ______________ , can ask them to choose from a list of system attributes ask direct and open-ended questions.","opts":["Utter the option","Rating on a scale"],"x":"Self-report data can be collected by rating on a scale (e.g. Likert), choosing from a list of attributes, or asking open-ended questions.","ans":1},{"id":"W5Q5","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"ASQ is a ___________________.","opts":["Post-task questionnaire","Post-session questionnaire"],"x":"ASQ (After-Scenario Questionnaire) is a post-task questionnaire with three statements rated on a 7-point scale.","ans":0},{"id":"W5Q6","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"It is generally assumed that an SUS score around _______ percent or higher is desirable","opts":["10","20","50","70"],"x":"An SUS score of around 70 percent or higher is generally considered desirable; lower scores may signal usability problems.","ans":3},{"id":"W5Q7","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"In expert evaluation, the evaluation team should have at least _________ members.","opts":["3-5","4-7","5-7","7-9"],"x":"Expert evaluation needs an evaluation team of at least 3-5 members.","ans":0},{"id":"W5Q8","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"In heuristic evaluation, a system is evaluated with a checklist are called ____","opts":["Heuristics","Actions","Statement"],"x":"A system evaluated with a checklist is a heuristic evaluation; the checklist items are heuristics.","ans":0},{"id":"W5Q9","part":"A","week":5,"topic":"Rapid Usability Evaluation","stem":"What is the full form of SUS","opts":["Software usability score","Software usability scale","System usability score","System usability scale"],"x":"SUS = System Usability Scale: ten statements (alternately positive and negative) rated on a 5-point scale.","ans":3},{"id":"W6Q1","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"Which of the following is NOT a charact eristic of Good design","opts":["Coverage","Correctness","Understandability","Colorful"],"x":"A good design has coverage, correctness, understandability, efficiency and maintainability. 'Colorful' is not a design characteristic.","ans":3},{"id":"W6Q2","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"If all functions perform similar operations it falls under ________ cohesion.","opts":["Logical","Temporal","Procedural","Sequential"],"x":"Logical cohesion: all functions perform similar operations (e.g. error handling). Temporal = same time span, procedural = same procedure.","ans":0},{"id":"W6Q3","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"If two modules share code, it falls under __________ coupling.","opts":["Data","Control","Content"],"x":"Content coupling: two modules share code (e.g. branch from one into another). Data coupling passes a data item; control coupling passes a control flag.","ans":2},{"id":"W6Q4","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"There are two basic design approaches: function oriented and _______ oriented.","opts":["Logic","Folder","Object","Class"],"x":"Two basic design approaches: function-oriented (abstractions are functions, DFD) and object-oriented (abstractions are objects, UML).","ans":2},{"id":"W6Q5","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"Basic components of ER diagram are: Entity, _____ and Relationship","opts":["Object","User","Attribute","Class"],"x":"ER diagram components: entity, attribute and relationship.","ans":2},{"id":"W6Q6","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"Null attributes are used when:","opts":["An entity does not have a value for an attribute","A value needs to be derived from other attributes or entities"],"x":"A null attribute is used when an entity has no value for an attribute. A derived attribute is computed from other attributes (e.g. age from date of birth).","ans":0},{"id":"W6Q7","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"There are four types of relationships in ER diagram: one-to-one, one-to-many, many-to-one and _______.","opts":["Many-to-binary","Many-to-many","Binary-to-many","Binary-to-one"],"x":"The four relationship types are one-to-one, one-to-many, many-to-one and many-to-many.","ans":1},{"id":"W6Q9","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"Which one from the following are related with between modules?","opts":["Cohesion","Coupling","Both"],"x":"Coupling is related to the relationship BETWEEN modules; cohesion is about the functions within a module.","ans":1},{"id":"W6Q10","part":"A","week":6,"topic":"System Design (Cohesion, DFD, ER)","stem":"What is the full form of the DFD","opts":["Data flow design","Data flow decision","Data flow development","Data flow diagram"],"x":"DFD = Data Flow Diagram: it represents the flow of data through a process or system.","ans":3},{"id":"W7Q1","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"In functional design approach we think of the system as provider of a set of “services” represented as ________.","opts":["Data","Functions","Objects"],"x":"In the functional design approach the system is a provider of services represented as functions.","ans":1},{"id":"W7Q2","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"In “Object Oriented Design approach”, we do not consider “services” offered by system.","opts":["True","False"],"x":"True. In object-oriented design we stop thinking in terms of services and think of a collection of objects and their behaviour.","ans":0,"ns":true},{"id":"W7Q3","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"A class contains attributes and ___________.","opts":["Data","Operations","Objects"],"x":"A class contains attributes (data part) and operations (also called methods or member functions).","ans":1},{"id":"W7Q4","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"Attribute indicates nature of data that an object can contain.","opts":["True","False"],"x":"True. An attribute is the data part of a class; it indicates the nature of data an object can hold.","ans":0,"ns":true},{"id":"W7Q5","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"Full form of OOA is:","opts":["object oriented assignment","object oriented assistance","object oriented analysis","object oriented attributes"],"x":"OOA = object oriented analysis (SRS with objects instead of functions).","ans":2},{"id":"W7Q6","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"________ effectively denotes the behavior of class.","opts":["Data","Operations","Objects","Attributes"],"x":"Operations are the action part of a class and effectively denote its behaviour.","ans":1},{"id":"W7Q7","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"UML is a language to represent","opts":["OOP","OOA","OOD"],"x":"UML is a language to represent object-oriented DESIGN (OOD), not programming (OOP) or analysis.","ans":2},{"id":"W7Q8","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"UML is a design methodology","opts":["True","False"],"x":"False. UML is not a design methodology; it is only a language to express OOD obtained using some methodology.","ans":1,"ns":true},{"id":"W7Q9","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"Implementation view can be captured using ________.","opts":["Deployment diagram","Component diagram","Class diagram","Use case diagram"],"x":"UML's five views: user (use case), behavioural (sequence, collaboration, state chart, activity), structural (class, object), implementation (component), environment (deployment). Implementation view = component diagram.","ans":1},{"id":"W7Q10","part":"A","week":7,"topic":"Object-Oriented Design & UML","stem":"________ objects normally hold information (e.g. book, book registers etc).","opts":["Boundary","Controller","Entity"],"x":"Domain objects: boundary (actors interact), controller (coordinate), entity (hold information, e.g. book, book register).","ans":2},{"id":"W8Q1","part":"A","week":8,"topic":"Coding & Review-Based Testing","stem":"Following standard coding guidelines helps to improve ______.","opts":["Readability only","Understandability only","Teamwork only","Readability, understandability, and teamwork"],"x":"Following coding standards improves readability, understandability and teamwork, not just one of them.","ans":3},{"id":"W8Q2","part":"A","week":8,"topic":"Coding & Review-Based Testing","stem":"A function should have no longer than _____ lines of code.","opts":["5","16","10","8"],"x":"A function should not exceed about 10 lines of code; longer functions are harder to understand and tend to have more bugs.","ans":2},{"id":"W8Q4","part":"A","week":8,"topic":"Coding & Review-Based Testing","stem":"Two broad categories of code testing methods are review-based method and __________ method.","opts":["Manual testing","Execution-based"],"x":"Code testing has two broad categories: review-based and execution-based.","ans":1},{"id":"W8Q6","part":"A","week":8,"topic":"Coding & Review-Based Testing","stem":"White-box testing refers to designing test cases using knowledge of internal structure of the software.","opts":["True","False"],"x":"True. White-box (structural) testing designs test cases using knowledge of the internal structure of the software.","ans":0,"ns":true},{"id":"W8Q7","part":"A","week":8,"topic":"Coding & Review-Based Testing","stem":"How many members should be present in a code walkthrough team?","opts":["2–3 members","3–5 members","5–7 members","7–10 members"],"x":"A code walkthrough team should be neither too big nor too small: ideally 3-5 members.","ans":1},{"id":"W8Q8","part":"A","week":8,"topic":"Coding & Review-Based Testing","stem":"Which of the following code testing method requires simulation of code execution by hand?","opts":["Code walkthrough","Code inspection","Black box testing","White box testing"],"x":"In a code walkthrough members select test cases and simulate execution by hand to find logical errors. Inspection checks code against a list of common errors and standards.","ans":0},{"id":"W8Q9","part":"A","week":8,"topic":"Coding & Review-Based Testing","stem":"Uninitialized variable is one of the common errors in programming that can be identified through code inspection.","opts":["True","False"],"x":"True. Common inspection findings include uninitialised variables, jumps into loops, non-terminating loops and incompatible assignments.","ans":0,"ns":true},{"id":"W8Q10","part":"A","week":8,"topic":"Coding & Review-Based Testing","stem":"Which of the following is not required to perform black box testing?","opts":["Equivalence class partitioning","Boundary value analysis","Test suite creation","Knowledge of the internal structure of the code"],"x":"Black-box testing needs only inputs and outputs (equivalence classes, boundary values, a test suite), not knowledge of the internal structure of the code.","ans":3},{"id":"W9Q1","part":"A","week":9,"topic":"Black-Box Testing","stem":"Set of all test cases with which a given software is to be tested is known as ________.","opts":["Testcase","Test suite"],"x":"The set of all test cases with which software is tested is the test suite.","ans":1},{"id":"W9Q2","part":"A","week":9,"topic":"Black-Box Testing","stem":"Randomly selected test cases do not necessarily contribute to significance of test suite.","opts":["True","False"],"x":"True. Randomly chosen test cases do not necessarily make a significant suite; they may not detect any additional defect.","ans":0,"ns":true},{"id":"W9Q3","part":"A","week":9,"topic":"Black-Box Testing","stem":"In black box testing the two main approaches to design test vases are: Equivalence class partitioning and _______________.","opts":["Structural analysis","Boundary value analysis","Equivalence class analysis","System analysis"],"x":"Black-box test design uses equivalence class partitioning and boundary value analysis.","ans":1},{"id":"W9Q4","part":"A","week":9,"topic":"Black-Box Testing","stem":"Testing code with any _____ value(s) of an equivalence class is as good as testing with ALL input values belonging to that class.","opts":["One","Two","Five","Four"],"x":"Testing with any ONE value of an equivalence class is as good as testing with all values of that class.","ans":0},{"id":"W9Q5","part":"A","week":9,"topic":"Black-Box Testing","stem":"In black box testing, domain of input values partitioned into sets, each sets are called _________.","opts":["Partition class","Equivalence class","Program class"],"x":"The input domain is partitioned into sets called equivalence classes; the program behaves similarly for all members.","ans":1},{"id":"W9Q7","part":"A","week":9,"topic":"Black-Box Testing","stem":"Set of all test cases with which a given software is to be tested is called test _____","opts":["Question","Questionnaire","Suite"],"x":"The set of all test cases is a test suite.","ans":2},{"id":"W9Q9","part":"A","week":9,"topic":"Black-Box Testing","stem":"Domain of input values partitioned into set is called equivalence class","opts":["True","False"],"x":"True. A partition of the input domain into sets is called equivalence classes.","ans":0,"ns":true},{"id":"W9Q10","part":"A","week":9,"topic":"Black-Box Testing","stem":"Functional testing is related to","opts":["Black-box testing","White-box testing"],"x":"Functional testing designs cases from the functional specification without internal knowledge, i.e. black-box testing.","ans":0},{"id":"W10Q1","part":"A","week":10,"topic":"White-Box & System Testing","stem":"To do a white-box testing, knowledge of internal structure is required.","opts":["True","False"],"x":"True. White-box testing tests the internal structure of the code and so needs knowledge of it.","ans":0,"ns":true},{"id":"W10Q2","part":"A","week":10,"topic":"White-Box & System Testing","stem":"To understand white-box testing strategies, program (flow) visualization helps. To visualize the program we can take help of ________.","opts":["CFG","DFD","ERD","Class diagram"],"x":"Program flow is visualised with a Control Flow Graph (CFG). DFD is for data flow design, ERD for data stores, class diagram for OOD.","ans":0},{"id":"W10Q3","part":"A","week":10,"topic":"White-Box & System Testing","stem":"To construct a CFG we assign numbers to all statements of the program, create a node in the CFG for each numbered statement and_____________.","opts":["Complement the CFG","Add edges","Sort the nodes"],"x":"To build a CFG number the statements, create a node per statement and add an edge from one node to another when control can transfer from the first to the second.","ans":1},{"id":"W10Q4","part":"A","week":10,"topic":"White-Box & System Testing","stem":"Branch coverage guarantees statement coverage.","opts":["True","False"],"x":"True. Branch coverage (edge testing) covers both true and false outcomes of every condition and therefore guarantees statement coverage.","ans":0,"ns":true},{"id":"W10Q5","part":"A","week":10,"topic":"White-Box & System Testing","stem":"In path coverage, test cases should ensure all __________ in the code executed at least once","opts":["Linearly independent paths","Linearly dependent paths"],"x":"Path coverage requires test cases that execute every linearly independent path at least once.","ans":0},{"id":"W10Q6","part":"A","week":10,"topic":"White-Box & System Testing","stem":"To compute cyclomatic complexity, we can use ___________, where E=number of edges, N=number of nodes","opts":["E-N+2","E-N+1","E+N-2","E+N-1"],"x":"Cyclomatic complexity = E - N + 2 (or D + 1 where D is the number of decision statements).","ans":0},{"id":"W10Q7","part":"A","week":10,"topic":"White-Box & System Testing","stem":"Three main stages of system testing is alpha testing, beta testing and _________.","opts":["Gama testing","Sigma testing","Acceptance testing","Omega testing"],"x":"System testing has three stages: alpha (in-house test team), beta (friendly customers) and acceptance testing (by the customer).","ans":2},{"id":"W10Q8","part":"A","week":10,"topic":"White-Box & System Testing","stem":"Volume testing tests system performance for ______ input","opts":["Small","Large"],"x":"Volume testing checks system performance for large input; stress testing uses abnormal or illegal input.","ans":1},{"id":"W10Q9","part":"A","week":10,"topic":"Empirical Usability Evaluation","stem":"There are _____ stages of empirical research.","opts":["Three","Four","Five","Six"],"x":"Empirical research has four stages: research question, variables, experiment design, data analysis.","ans":1},{"id":"W10Q10","part":"A","week":10,"topic":"Empirical Usability Evaluation","stem":"Data we get from observation is ________ data","opts":["Reflective","Empirical","Authoritative","Experiential"],"x":"Data obtained from observation is empirical data.","ans":1},{"id":"W11Q1","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"When we perform a controlled experiment to collect and analyze data on user behavior, the entire process is known as _______.","opts":["programmable research","hypothetical research","empirical research","theoretical research"],"x":"A controlled experiment collecting and analysing data on user behaviour is empirical research.","ans":2},{"id":"W11Q2","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"There are broadly _____ stages of empirical research?","opts":["Two","three","four","five"],"x":"There are four stages of empirical research.","ans":2},{"id":"W11Q3","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"Suppose we formed two research questions: RQ1: Is the new technique good? RQ2: Is our text input interface better than the text input interface provided by, say, MS Word? RQ3: Does the new interface let me enter text “faster” than MS Word? We call RQ3 ______ and RQ1 as _______.","opts":["testable, non-testable","alternative hypothesis, null hypothesis"],"x":"RQ3 (does the new interface let me enter text faster than MS Word) is testable because it is specific and measurable; RQ1 (is the new technique good) is vague and non-testable. Official key: testable, non-testable.","ans":0},{"id":"W11Q4","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"When we form a hypothesis, essentially stating that the test condition is not going to affect the outcome (judgment). This hypothesis is called _______.","opts":["null hypothesis","alternative hypothesis"],"x":"A hypothesis stating that the test condition will not affect the outcome is the null hypothesis; the alternative states that it does.","ans":0},{"id":"W11Q5","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"In _______, we assign some (arbitrary) codes to attributes of observational data.","opts":["nominal","ordinal","interval","ratio"],"x":"Nominal scale assigns arbitrary codes (e.g. 1 = male, 2 = female) to attributes; also called categorical data.","ans":0},{"id":"W11Q6","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"Recording data from a thermometer is an example of interval scaled data.","opts":["True","False"],"x":"True. A thermometer records equally spaced values, so it is interval scaled data (ratio scales use ratios, e.g. characters per minute).","ans":0,"ns":true},{"id":"W11Q7","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"_______ are variables that influence both the independent and dependent variables in a study, potentially leading to incorrect conclusions about the relationship between the two.","opts":["Dependant variables","Independent variables","Confounding variables","Control variables"],"x":"Confounding variables influence both the independent and dependent variables, possibly leading to wrong conclusions (e.g. the practice effect).","ans":2},{"id":"W11Q8","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"For any pilot study (or small-scale studies), 5 is probably a good number.","opts":["True","False"],"x":"True. For pilot or small-scale studies five participants is probably a good number; conclusions are only indicative.","ans":0,"ns":true},{"id":"W11Q9","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"To draw reliable conclusions from empirical data, we should use between _____ and _____ participants.","opts":["1, 5","2, 5","12, 25","10, 12"],"x":"For reliable conclusions use between 12 and 25 participants (the literature range is 5-25).","ans":2},{"id":"W11Q10","part":"A","week":11,"topic":"Empirical Usability Evaluation","stem":"When we distribute the tasks to participants in the way explained above, we call the study as _______.","opts":["between-subject","within-subject","uni-subject","center-subject"],"x":"When participants are divided into groups and each group performs tasks for only a subset of the test conditions, the study is between-subject. (The original question text is incomplete on the portal; the official key is shown.)","ans":0},{"id":"W12Q1","part":"A","week":12,"topic":"Significance Tests","stem":"With the significance test, we try to _______ the null hypothesis.","opts":["Accept","Refute"],"x":"With a significance test we try to refute (reject) the null hypothesis.","ans":1},{"id":"W12Q2","part":"A","week":12,"topic":"Significance Tests","stem":"Type I error is also known as _______.","opts":["False positive","False negative","True positive","True negative"],"x":"Type I error (alpha error) is a false positive: rejecting a null hypothesis that is true. Type II error is a false negative.","ans":0},{"id":"W12Q3","part":"A","week":12,"topic":"Significance Tests","stem":"t-statistic is the ONLY way to test for statistical significance","opts":["True","False"],"x":"False. The t-test is only one of many significance tests.","ans":1,"ns":true},{"id":"W12Q4","part":"A","week":12,"topic":"Significance Tests","stem":"There are broadly two categories of the techniques for significance test: _______ and _______.","opts":["Parametric and Non-parametric","t-test and non t-test"],"x":"Significance tests are of two categories: parametric (e.g. t-test) and non-parametric.","ans":0},{"id":"W12Q5","part":"A","week":12,"topic":"Project Management & Agile","stem":"Project planning involves estimation of Project size, Cost, Duration and Effort.","opts":["True","False"],"x":"True. Project planning involves estimation of project size, cost, duration and effort.","ans":0,"ns":true},{"id":"W12Q6","part":"A","week":12,"topic":"Project Management & Agile","stem":"COCOMO stands for _______.","opts":["Conducive Cost Estimation Model","Constructive Cost Estimation Model","Constructive Category Estimation Model","Conducive Category Estimation Model"],"x":"COCOMO = Constructive Cost Estimation Model, proposed by Boehm in 1981.","ans":1},{"id":"W12Q7","part":"A","week":12,"topic":"Project Management & Agile","stem":"According to Boehm, software cost estimation should be done through _______ stages.","opts":["Two","Three","Four","Five"],"x":"According to Boehm, cost estimation is done through three stages: basic, intermediate and complete COCOMO.","ans":1},{"id":"W12Q8","part":"A","week":12,"topic":"Project Management & Agile","stem":"Agile development ensure quick turn-around of projects","opts":["True","False"],"x":"True. Agile development ensures quick turn-around by eliminating unnecessary documentation and starting small.","ans":0,"ns":true},{"id":"W12Q9","part":"A","week":12,"topic":"Project Management & Agile","stem":"Scrum is a _______ method.","opts":["Traditional SDLC","Agile"],"x":"Scrum is an agile method (others: XP, DAD, DSDM).","ans":1},{"id":"W12Q10","part":"A","week":12,"topic":"Project Management & Agile","stem":"In a Gantt chart the length is proportional to _______ for activity","opts":["Duration planned","Effort","Cost"],"x":"In a Gantt chart each bar is an activity and its length is proportional to the planned duration.","ans":0},{"id":"W0Q1","part":"A","week":0,"topic":"Interactive Systems & Usability","stem":"Which of the following models is not suitable for accommodating any change?","opts":["Build and Fix Model","Prototyping Model","RAD Model","Waterfall Model"],"x":"The classical Waterfall model is rigid: stages follow one another and going back to change requirements or design is costly, so it accommodates change poorly. Prototyping, RAD and similar models are built around feedback and change; build-and-fix has no fixed plan at all.","ans":3,"inf":true},{"id":"W0Q6","part":"A","week":0,"topic":"Interface & Code Design Guidelines","stem":"System models are abstract descriptions of systems whose requirements are being analyzed.","opts":["True","False"],"x":"True. System models are abstract descriptions of the system whose requirements are being analysed (structural, behavioural, context and interaction models).","ans":0,"ns":true,"inf":true},{"id":"W0Q7","part":"A","week":0,"topic":"Object-Oriented Design & UML","stem":"UML is based on ______________________.","opts":["notation","transitions","states","keywords"],"x":"UML (Unified Modeling Language) is a graphical language based on a set of notations (rectangles, lines, ellipses, stick figures) with its own syntax and semantics. It is a language, not a methodology.","ans":0,"inf":true},{"id":"N1","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Why can a digital pedometer be called a computer according to the Oxford definition used in the course?","opts":["It receives data, follows stored instructions and produces a result","It runs a full operating system with a graphical interface","It is permanently connected to the internet or a smartphone","It has a large display and a keyboard like a desktop machine"],"x":"The definition needs only data input, a stored program (e.g. the step-to-distance formula) and an output; keyboards, networks or operating systems are not required.","ans":0},{"id":"N2","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Which development belongs to the pre-history phase of interactive systems (1940s to 1970s)?","opts":["Android 1.0 (2008)","Sketchpad (1963)","Mosaic web browser (1993)","Apple Mac (1984)"],"x":"Sketchpad (Sutherland, 1963) introduced GUI-style interaction in the pre-history phase. The Mac, Mosaic and Android belong to later phases.","ans":1},{"id":"N3","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Who introduced the term 'ubiquitous computing' in 1991?","opts":["Douglas Engelbart","Helen Gill","Kevin Ashton","Mark Weiser"],"x":"Mark Weiser introduced ubiquitous computing (1991); Kevin Ashton coined IoT (1999) and Helen Gill cyber-physical systems (2006); Engelbart's NLS introduced the mouse.","ans":3},{"id":"N4","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"The ISO definition of usability mentions effectiveness, efficiency and:","opts":["Learnability","Utility","Satisfaction","Memorability"],"x":"ISO 9241-210 lists effectiveness, efficiency and satisfaction in a specified context of use.","ans":2},{"id":"N5","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"According to the ISO definition, a usable product is one that can be used by:","opts":["all kinds of users in every possible situation of use","users who understand the underlying technology well","only expert users with technical training","specified users to achieve specified goals in a specified context of use"],"x":"Usability is relative to specified users, goals and context; a usable product need not be designed for everybody.","ans":3},{"id":"N6","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Which Nielsen usability component is the ease with which an intermittent user re-establishes proficiency after a gap?","opts":["Satisfaction","Learnability","Memorability","Efficiency"],"x":"Memorability concerns returning users; learnability concerns first-time users performing basic tasks.","ans":2},{"id":"N7","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Learnability in Nielsen's framework is the ease with which:","opts":["a first-time user performs basic tasks","an expert completes tasks quickly","users recover from errors","an intermittent user returns to the system"],"x":"Learnability is about first-time (novice) users; efficiency is speed; errors is error rate and recovery.","ans":0},{"id":"N8","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Nielsen argued that an acceptable product needs usability and:","opts":["aesthetics","utility","scalability","security"],"x":"Utility (functionality supporting users' functional needs) together with usability makes a product useful.","ans":1},{"id":"N9","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Who coined the term 'user-centered design' (1986)?","opts":["Nielsen","Boehm","Norman","Shneiderman"],"x":"The course attributes the term to Shneiderman (1986); ISO prefers 'human-centered design'.","ans":3},{"id":"N10","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Using Ctrl+S instead of the menu to save a file is most typical of which generic user category?","opts":["Casual","Intermittent","Expert","Novice"],"x":"Experts use shortcuts such as hotkeys; novices prefer menus. The generic categories are novice, intermittent and expert.","ans":2},{"id":"N11","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"How many major stages does the classical waterfall model have in the course?","opts":["Seven","Five","Four","Six"],"x":"Seven: feasibility, requirements, system design, coding and unit testing, integration and system testing, deployment, maintenance.","ans":0},{"id":"N12","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Which quadrant of the spiral model is devoted to development of the product (prototype) after risks have been resolved?","opts":["Fourth","Third","First","Second"],"x":"1st identify objectives and risks, 2nd risk assessment and mitigation, 3rd development, 4th evaluation and planning.","ans":1},{"id":"N13","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"The spiral model is described in the course as a:","opts":["model only for hardware projects","model without iterations","strictly linear model","meta model that encompasses other SDLCs"],"x":"The spiral model has multiple iterations (spirals) and can encompass other life cycle models.","ans":3},{"id":"N14","part":"B","week":0,"topic":"Interactive Systems & Usability","stem":"Why is the classical waterfall model unsuitable for usable interactive systems?","opts":["It has no testing stage at all before deployment","It cannot produce working code before testing finishes","It does not allow the many iterations needed to account for user feedback","It produces too few documents for the maintenance team"],"x":"UCD needs highly iterative life cycles; waterfall focuses on efficient system design and does not explicitly consider users.","ans":2},{"id":"N15","part":"B","week":0,"topic":"Usability Requirements","stem":"Which of the following is a non-functional requirement category listed in the course?","opts":["Performance related requirements","Input/output formats","Module hierarchy","Function names"],"x":"NFR categories: performance, operating constraints, economic considerations, life-cycle requirements, interface issues.","ans":0},{"id":"N16","part":"B","week":0,"topic":"Usability Requirements","stem":"Which of the following is a PERFORMANCE-related non-functional requirement?","opts":["Maintainability","Response time","Cost of design","Portability"],"x":"Reliability, security and response time are performance related; maintainability and portability are life-cycle requirements; cost is economic.","ans":1},{"id":"N17","part":"B","week":0,"topic":"Usability Requirements","stem":"In contextual inquiry the observer acts like an:","opts":["customer who dictates requirements","examiner who tests users","apprentice who treats users as masters","interviewer who follows a fixed script only"],"x":"The purpose is to learn user behaviour, not to teach them how to behave.","ans":2},{"id":"N18","part":"B","week":0,"topic":"Usability Requirements","stem":"During which stage of contextual inquiry are 'thank you' notes sent to users?","opts":["Close","Execute","Plan","Reflect"],"x":"Close stage: end the process and thank users (you may need them again).","ans":0},{"id":"N19","part":"B","week":0,"topic":"Usability Requirements","stem":"Contacting the authorities for permission and removing the users' anxieties belongs to which CI stage?","opts":["Execute","Plan","Close","Initiate"],"x":"The Initiate stage opens communication with the authorities and the end users.","ans":3},{"id":"N20","part":"B","week":0,"topic":"Usability Requirements","stem":"Which statement describes the passive mode of contextual inquiry?","opts":["The user is interviewed by phone after the task","User activities are recorded or videotaped and reviewed later","The observer sits next to the user and takes notes","The observer performs the tasks instead of the user"],"x":"Active mode: observer physically present. Passive mode: recording and later review.","ans":1},{"id":"N21","part":"B","week":0,"topic":"Usability Requirements","stem":"What is the third step of the affinity diagram method?","opts":["Generate ideas","Draw the finished diagram","Display ideas","Sort ideas into groups"],"x":"Steps: generate, display, sort into groups, create group headers, draw the finished diagram.","ans":3},{"id":"N22","part":"B","week":0,"topic":"Usability Requirements","stem":"In the affinity diagram method, ideas are usually generated and displayed using:","opts":["Gantt charts","flowcharts","sticky notes","UML class diagrams"],"x":"Observations from contextual inquiry are noted on sticky notes, displayed and grouped.","ans":2},{"id":"N23","part":"B","week":0,"topic":"Usability Requirements","stem":"A function in an SRS is described by its name, input, output and:","opts":["description","author","cost","priority"],"x":"The SRS notation uses function name, input, output and an optional description.","ans":0},{"id":"N24","part":"B","week":0,"topic":"Usability Requirements","stem":"Which feature of functional requirement specification means that functions are described without saying how they work?","opts":["Inheritance","Abstraction (black box)","Polymorphism","Normalisation"],"x":"Functions are black boxes with clearly defined input and output; decomposition and hierarchy manage complexity.","ans":1},{"id":"N25","part":"B","week":0,"topic":"Usability Requirements","stem":"The hierarchical naming of requirements in an SRS typically looks like:","opts":["R1, R1.1, R1.2","Req-X, Req-Y","F-A, F-B","A, B, C"],"x":"Requirements use a hierarchical naming convention such as R1, R1.1.","ans":0},{"id":"N26","part":"B","week":0,"topic":"Usability Requirements","stem":"Which of the following is NOT a consequence of not specifying NFRs listed in the course?","opts":["Inconsistent software","Time and cost overruns to fix software later","Unsatisfied users, clients and developers","Guaranteed faster development"],"x":"Not specifying NFRs causes dissatisfaction, inconsistency and overruns, not faster development.","ans":3},{"id":"N27","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"In user-centered design, which design concern relies mainly on creativity, experience and intuition at the start?","opts":["Code design","Database design","Interface design","Network design"],"x":"Interface design is the prime application of creativity, aided by guidelines and heuristics; code design aims at manageable code.","ans":2},{"id":"N28","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Who proposed the 'eight golden rules' of interface design?","opts":["Miller","Shneiderman","Nielsen","Norman"],"x":"Shneiderman (1986); Norman proposed seven principles; Miller gave the 7+-2 memory rule.","ans":1},{"id":"N29","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Providing menus and hotkeys for novice and expert users illustrates which golden rule?","opts":["Permit easy reversal of actions","Design for universal usability","Strive for consistency","Offer informative feedback"],"x":"Rule 2: design for universal usability (novice, intermittent, expert).","ans":1},{"id":"N30","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"A progress bar during a file upload follows which golden rule?","opts":["Permit easy reversal of actions","Reduce short-term memory load","Design dialogues to yield closure","Offer informative feedback"],"x":"Rule 3: offer informative feedback (e.g. progress bars, a changed icon after saving).","ans":3},{"id":"N31","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Providing undo and redo supports which golden rule?","opts":["Keep users in control","Strive for consistency","Permit easy reversal of actions","Offer error prevention"],"x":"Rule 6: permit easy reversal of actions (undo/redo).","ans":2},{"id":"N32","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Grouping an online shopping process into beginning, middle and end with feedback at the end of each group follows which rule?","opts":["Design dialogues to yield closure","Keep users in control","Reduce short-term memory load","Offer informative feedback only"],"x":"Rule 4: organise activities into groups with feedback at the end of each group to yield closure.","ans":0},{"id":"N33","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Miller's '7 +- 2' rule is most closely tied to which golden rule?","opts":["Strive for consistency","Offer error prevention","Keep users in control","Reduce short-term memory load"],"x":"Miller (1956): short-term memory holds about seven plus or minus two items, so users should not be forced to remember too many things.","ans":3},{"id":"N34","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"How many design principles did Norman propose (1988)?","opts":["Ten","Seven","Eight","Five"],"x":"Norman's seven principles (e.g. use knowledge in the world and in the head; simplify tasks; get the mappings right; design for error; standardize).","ans":1},{"id":"N35","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Which Norman principle is 'when all else fails'?","opts":["Standardize","Make things visible","Get the mappings right","Design for error"],"x":"The seventh principle: when all else fails, standardize.","ans":0},{"id":"N36","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"Which of the following is part of high-level (preliminary) code design?","opts":["Choosing variable names","Selecting data structures and algorithms","Identification of modules and control relationships","Writing unit tests"],"x":"High-level design: modules, control relationships and interface definitions. Data structures and algorithms belong to detailed design.","ans":2},{"id":"N37","part":"B","week":0,"topic":"Interface & Code Design Guidelines","stem":"The language used to express interface design ideas (as opposed to code design) is the:","opts":["UML","prototype","DFD","ER diagram"],"x":"Prototypes are considered the language of interface design.","ans":1},{"id":"N38","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"How many actions are defined in Norman's model of interaction?","opts":["Five","Nine","Seven","Four"],"x":"Four in the execution stage and three in the evaluation stage: seven stages of action.","ans":2},{"id":"N39","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Which is the FIRST action in Norman's execution stage?","opts":["Establishing the goal","Executing the task","Intention formulation","Task specification"],"x":"Goal -> intention -> sequence of actions -> execution; only the last involves motor action.","ans":0},{"id":"N40","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Which of these actions involves human motor activity?","opts":["Establishing the goal","Interpreting the system state","Formulating the intention","Executing the action sequence"],"x":"The first three execution actions are mental; the last (execution) is motor. Perception uses the senses and the last two evaluation actions are mental.","ans":3},{"id":"N41","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A user's interpretation of the interface state not matching the actual state is the gulf of:","opts":["execution","interaction","evaluation","intention"],"x":"Gulf of execution: actions we can specify are not supported; gulf of evaluation: interpretation does not match the real state.","ans":2},{"id":"N42","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A user who understands the goal and system but performs an incorrect action has made a:","opts":["delay","mistake","gulf","slip"],"x":"Slip: correct goal, incorrect action (fix by better interface design). Mistake: wrong goal or wrong understanding (fix by better understanding of the system).","ans":3},{"id":"N43","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Mistakes are best reduced by:","opts":["better understanding of the system","more colourful icons","better interface design only","longer help messages only"],"x":"Slips: better interface design; mistakes: better understanding of the system.","ans":0},{"id":"N44","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Which prototype represents interaction by implementing a few selected features in depth?","opts":["Low-fidelity only","Vertical","Throw-away only","Horizontal"],"x":"Vertical prototypes implement features from the first screen to the screen after the last action; horizontal prototypes show the surface of the whole interface.","ans":1},{"id":"N45","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Horizontal prototypes are most suitable for:","opts":["performing real work with the system","discussing and eliciting feedback on look and feel","analysing detailed interaction sequences","measuring typing speed of users"],"x":"Horizontal prototypes depict the whole interface without functionality.","ans":1},{"id":"N46","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Which tool use gives a medium-fidelity prototype?","opts":["Cardboard mock-up","A full Java Swing application","A PowerPoint slideshow simulating interaction","A hand sketch"],"x":"Medium fidelity: computers used to create simple prototypes (slideshows, animations). Low = paper; high = real programming.","ans":2},{"id":"N47","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"Java Swing and Tcl/Tk are examples of toolkits used for:","opts":["low-fidelity prototypes","storyboards","medium-fidelity prototypes","high-fidelity prototypes"],"x":"Hi-fidelity prototypes are built with programming and interface toolkits.","ans":3},{"id":"N48","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"In the 'evolutionary' approach to using prototypes, the:","opts":["whole system is prototyped, tested and altered until it becomes the final product","each unit is prototyped and tested separately and then integrated","prototype is never tested with real users in this approach","prototype is always thrown away once the first feedback arrives"],"x":"Incremental: separate units; evolutionary: whole system refined into the product.","ans":0},{"id":"N49","part":"B","week":0,"topic":"Norman's Model & Prototyping","stem":"A series of sketches showing how the interface changes during a task is called:","opts":["a DFD","storyboarding","a heuristic list","an affinity diagram"],"x":"Storyboarding represents interaction with a sequence of sketches.","ans":1},{"id":"N50","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"A cognitive walkthrough requires at least which kind of prototype?","opts":["No prototype, only a requirements document","Any horizontal prototype showing the surface only","A finished product with all features","A low-fidelity vertical prototype supporting several tasks"],"x":"CW is scenario-based and needs a vertical prototype with several tasks, a task description and a set of questions.","ans":3},{"id":"N51","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Which statement distinguishes heuristic evaluation from cognitive walkthrough?","opts":["It needs no task scenarios and horizontal prototypes suffice","It needs a vertical prototype with scenarios","It uses a questionnaire after each task","It requires real end users only"],"x":"Heuristic evaluation checks the system against a checklist; cognitive walkthrough is scenario-based.","ans":0},{"id":"N52","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Which set of heuristics is discussed in the course for heuristic evaluation?","opts":["Boehm's 3 stages","Norman's 7 principles","Nielsen's 10 heuristics","Shneiderman's 8 rules"],"x":"The course uses Nielsen's (1994) ten heuristics.","ans":2},{"id":"N53","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Which Nielsen heuristic says users should always be informed about what is going on through timely feedback?","opts":["Visibility of system status","Help and documentation","Consistency and standards","Error prevention"],"x":"Visibility of system status: keep users informed through appropriate feedback within a reasonable time.","ans":0},{"id":"N54","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"How many statements does the After-Scenario Questionnaire (ASQ) have?","opts":["Ten","Three","Five","Seven"],"x":"ASQ has three statements rated on a 7-point scale.","ans":1},{"id":"N55","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"The SUS questionnaire consists of how many statements?","opts":["Three","Seven","Ten","Five"],"x":"Ten statements: five positively worded and five negatively worded; 5-point scale.","ans":2},{"id":"N56","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"In SUS scoring, the contribution of a positively worded statement is:","opts":["the rating times 2.5","the rating plus 1","5 minus the rating","the rating minus 1"],"x":"Positive statements: rating - 1; negative: 5 - rating; the sum is multiplied by 2.5 for a score out of 100.","ans":3},{"id":"N57","part":"B","week":0,"topic":"Rapid Usability Evaluation","stem":"Feedback on rating scales is generally considered:","opts":["unreliable compared with open-ended questions","unsuitable for questionnaires","only useful for experts","more efficient and reliable than open-ended questions"],"x":"The course notes that open-ended feedback may not be reliable.","ans":3},{"id":"N58","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Which characteristic of a good design means that all SRS functionalities are implemented?","opts":["Maintainability","Efficiency","Coverage","Correctness"],"x":"Coverage = implement ALL functionality of the SRS; correctness = implement it CORRECTLY.","ans":2},{"id":"N59","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"A module whose functions are all performed in the same time span (e.g. initialisation) has which cohesion?","opts":["Logical","Temporal","Sequential","Communication"],"x":"Temporal cohesion: all functions to be performed in the same time span.","ans":1},{"id":"N60","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Sequential cohesion means that:","opts":["output of one element is the input of the next","functions are performed at the same time","all functions refer to the same data structure","all functions perform similar operations"],"x":"Example: get-input, validate-input, sort-input.","ans":0},{"id":"N61","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Passing an integer between two modules is an example of which coupling?","opts":["Logical coupling","Control coupling","Data coupling","Content coupling"],"x":"Data coupling: modules communicate through a data item. Control: a flag controls the other module. Content: shared code.","ans":2},{"id":"N62","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Functionally independent modules have:","opts":["high cohesion and high coupling","high cohesion and low coupling","low cohesion and low coupling","low cohesion and high coupling"],"x":"Good modular design: high cohesion and low coupling.","ans":1},{"id":"N63","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Which DFD level contains only one process representing the entire system?","opts":["Level 2","Level 3","Level 1","Level 0 (context diagram)"],"x":"The context diagram shows the entire system as a single process with external entities; data stores first appear at level 1.","ans":3},{"id":"N64","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Which statement about data stores in a DFD is correct?","opts":["Only previously stored data can be read from them","They are drawn as stick figures","They appear in the context diagram","They create new data"],"x":"Data stores cannot create new data; only previously stored data can be read. They first appear at level 1.","ans":0},{"id":"N65","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"In a DFD, a process name should be a:","opts":["number","noun","adjective","verb phrase"],"x":"Process -> verb phrase; data flow label -> noun naming the data.","ans":3},{"id":"N66","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"Who proposed the entity-relationship diagram (1976)?","opts":["Boehm","Henry Gantt","Peter Chen","Rajib Mall"],"x":"ER diagrams were proposed by Peter Chen in 1976.","ans":2},{"id":"N67","part":"B","week":0,"topic":"System Design (Cohesion, DFD, ER)","stem":"An attribute whose value is computed from other attributes (e.g. age from date of birth) is a:","opts":["derived attribute","multi-valued attribute","null attribute","simple attribute"],"x":"Derived attributes are computed from other attributes or entities.","ans":0},{"id":"N68","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"An object is best described as:","opts":["a database table","an instantiation of a class","a function with parameters","a UML diagram"],"x":"An object is an instantiation of a class: attribute values assigned and operations initialised.","ans":1},{"id":"N69","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"Use case diagrams belong to which UML view?","opts":["Environment view","Structural view","Behavioural view","User view"],"x":"User view = use case diagrams; structural = class and object; implementation = component; environment = deployment.","ans":3},{"id":"N70","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"Which diagram belongs to the environment view in UML?","opts":["Sequence diagram","Deployment diagram","Component diagram","Class diagram"],"x":"Environment view = deployment diagram.","ans":1},{"id":"N71","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"Objects with which actors interact, such as screens and menus, are:","opts":["boundary objects","controller objects","entity objects","derived objects"],"x":"Boundary: actors interact (identified from use cases); controller: coordinate; entity: hold information.","ans":0},{"id":"N72","part":"B","week":0,"topic":"Object-Oriented Design & UML","stem":"The relationship in which parts are existence-dependent on the whole is:","opts":["inheritance","aggregation","composition","association"],"x":"Composition is a stricter aggregation: parts are created and destroyed with the whole (filled diamond).","ans":2},{"id":"N73","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"A rule of thumb for comments is at least one concise comment line for every:","opts":["10 source lines","1 source line","2 source lines","3 source lines"],"x":"At least one concise explanatory comment per three source lines on average.","ans":3},{"id":"N74","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"A 'side effect' of a function call includes all EXCEPT:","opts":["modification of parameters","I/O operations","returning a value to the caller","modification of global variables"],"x":"Obscure side effects (parameters, globals, I/O) hamper understanding; returning a result is normal.","ans":2},{"id":"N75","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Code inspection is similar to which evaluation method for interfaces?","opts":["heuristic evaluation","wizard of oz","cognitive walkthrough","contextual inquiry"],"x":"Inspection uses a checklist of common errors, like heuristic evaluation; code walkthrough resembles cognitive walkthrough.","ans":0},{"id":"N76","part":"B","week":0,"topic":"Coding & Review-Based Testing","stem":"Code walkthrough is similar to:","opts":["heuristic evaluation","cognitive walkthrough","expert interview","affinity diagram"],"x":"Walkthrough: representative test cases executed by hand, like scenario-based cognitive walkthrough.","ans":1},{"id":"N77","part":"B","week":0,"topic":"Black-Box Testing","stem":"For a program that computes the square root of an integer in [0, 5000], how many equivalence classes does the course suggest?","opts":["Five","One","Three","Two"],"x":"Negative integers (invalid), integers 0-5000 (valid) and integers above 5000 (invalid).","ans":2},{"id":"N78","part":"B","week":0,"topic":"Black-Box Testing","stem":"Boundary value analysis for the range [0, 5000] adds test cases such as:","opts":["5000, 6000, 7000","100, 200, 300","1, 2500, 4999","-1, 0, 5000, 5001"],"x":"Programmers often err at class boundaries (< vs <=), so test the values at and just outside the boundaries.","ans":3},{"id":"N79","part":"B","week":0,"topic":"White-Box & System Testing","stem":"In a control flow graph each numbered statement is represented by a:","opts":["loop","node","path","edge"],"x":"Nodes represent statements; an edge is added when control can transfer from one statement to another.","ans":1},{"id":"N80","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Which coverage strategy aims to execute every statement at least once?","opts":["Statement coverage","Branch coverage","Condition coverage","Path coverage"],"x":"Statement coverage is the weakest of the listed strategies; branch coverage is stronger.","ans":0},{"id":"N81","part":"B","week":0,"topic":"White-Box & System Testing","stem":"For a CFG with 7 edges and 6 nodes, cyclomatic complexity E - N + 2 equals:","opts":["4","1","3","2"],"x":"7 - 6 + 2 = 3 (also D + 1 with D = 2 decisions).","ans":2},{"id":"N82","part":"B","week":0,"topic":"White-Box & System Testing","stem":"Alpha testing is carried out by:","opts":["a test team within the organisation","a select group of friendly customers","the customer","end users on the internet"],"x":"Alpha: in-house test team; beta: friendly customers; acceptance: the customer.","ans":0},{"id":"N83","part":"B","week":0,"topic":"White-Box & System Testing","stem":"In top-down integration testing, routines that simulate lower-level modules are called:","opts":["oracles","stubs","drivers","mocks of upper layers"],"x":"Stubs simulate lower-level routines called by routines under test; drivers simulate upper-level modules in bottom-up testing.","ans":1},{"id":"N84","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"In the study comparing text entry speed of two interfaces, the 'interface' is the:","opts":["confounding variable","control variable","dependent variable","independent variable"],"x":"Interface is controlled by the experimenter (independent); text entry speed depends on it (dependent).","ans":3},{"id":"N85","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"The values assigned to an independent variable (factor) are called:","opts":["scales","hypotheses","levels","samples"],"x":"Factors combined with levels give the test conditions.","ans":2},{"id":"N86","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Which measurement scale is used for ranking three phones as 1st, 2nd and 3rd?","opts":["Interval","Ratio","Nominal","Ordinal"],"x":"Ordinal scales impose an order; Likert ratings are also ordinal.","ans":3},{"id":"N87","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"Characters per minute (CPM) is measured on which scale?","opts":["Interval","Ratio","Nominal","Ordinal"],"x":"CPM is a ratio of characters typed to minutes spent: the most sophisticated scale.","ans":1},{"id":"N88","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"In a within-subject (repeated-measure) design:","opts":["every participant performs tasks for all test conditions","only experts take part","no participant repeats tasks","each participant performs tasks for one condition only"],"x":"Within-subject: all conditions for every participant (practice effect may occur); between-subject: subsets per group.","ans":0},{"id":"N89","part":"B","week":0,"topic":"Empirical Usability Evaluation","stem":"The Latin Square method is used to:","opts":["compute the SUS score from ratings","choose the number of participants required","counterbalance the sequence of tasks across participants","select research questions for the study"],"x":"Each condition appears once in each row and column to counter the practice effect.","ans":2},{"id":"N90","part":"B","week":0,"topic":"Significance Tests","stem":"The statistic usually compared in user-centric significance tests is the:","opts":["p-value of a prior study","mean of a group of data items","median only","sample size"],"x":"We test the significance of the difference between group means.","ans":1},{"id":"N91","part":"B","week":0,"topic":"Significance Tests","stem":"A result reported as t(11) = 2.70, p < 0.05 means:","opts":["the difference is significant; chance probability is about 5% or less","the sample had 2.70 participants on average per condition","there were 11 variables in the experiment","the data occurred by chance more than 5% of the time"],"x":"11 = degrees of freedom; p < 0.05 means the null hypothesis can be rejected.","ans":0},{"id":"N92","part":"B","week":0,"topic":"Project Management & Agile","stem":"Which is NOT one of the four project planning estimates in the course?","opts":["Duration","Cost","Size","Colour scheme"],"x":"
